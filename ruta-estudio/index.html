<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Práctica diaria de 6° y 8° básico: Matemáticas, Lenguaje, Ciencias e Historia y Geografía.">
<meta name="theme-color" content="#2c62d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruta de Estudio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Ruta de Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: a single winding path of lesson stops, one unit per curriculum block of 8°C; lesson and parent panel replace the path in place. */
:root{
  --bg:#eef3f9; --surface:#ffffff; --ink:#18233a; --muted:#5a6880; --line:#d6dfeb;
  --accent:#2c62d8; --accent-ink:#ffffff; --accent-deep:#1d48a6;
  --gold:#f0a20f; --gold-soft:#fff2d3;
  --ok:#1f9d55; --ok-soft:#e1f5e9; --bad:#d9433a; --bad-soft:#fde6e4;
  --locked:#c9d3e1;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --shadow:0 3px 0 rgba(24,35,58,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --surface:#18233a; --ink:#e7edf7; --muted:#9aa9c2; --line:#2a3854;
  --accent:#5b8cff; --accent-ink:#0b1220; --accent-deep:#3d6be0;
  --gold:#ffbe3d; --gold-soft:#3a2f12;
  --ok:#3ccf7c; --ok-soft:#123326; --bad:#ff6b61; --bad-soft:#3a1a1a;
  --locked:#33415c; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1624; --surface:#18233a; --ink:#e7edf7; --muted:#9aa9c2; --line:#2a3854;
  --accent:#5b8cff; --accent-ink:#0b1220; --accent-deep:#3d6be0;
  --gold:#ffbe3d; --gold-soft:#3a2f12;
  --ok:#3ccf7c; --ok-soft:#123326; --bad:#ff6b61; --bad-soft:#3a1a1a;
  --locked:#33415c; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--body);font-weight:700;font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.fire{color:#ef6c1a}.stat.xp{color:var(--gold)}
.tabs{display:flex;gap:6px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 12px;font-weight:800;font-size:.9rem}
.tab[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

/* goal card */
.goal{margin-top:18px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.goal .txt{flex:1;min-width:180px}
.goal h2{font-size:1.25rem}
.goal p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.btn{border:none;border-radius:14px;padding:12px 18px;font-weight:800;font-size:1rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep);letter-spacing:.02em}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn[disabled]{background:var(--locked);color:var(--muted);box-shadow:none;cursor:not-allowed}

/* path */
.unit{margin-top:28px}
.uhead{border-radius:18px;padding:14px 16px;color:#fff;background:var(--uc);box-shadow:0 4px 0 var(--ud);display:flex;gap:12px;align-items:center}
.uhead .n{font-family:var(--display);font-weight:800;font-size:.85rem;opacity:.9;letter-spacing:.08em;text-transform:uppercase}
.uhead h2{font-size:1.35rem}
.uhead .src{font-size:.8rem;opacity:.92;margin-top:2px}
.uhead .meter{margin-left:auto;text-align:right;font-weight:800;font-size:.85rem;white-space:nowrap}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 6px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(var(--dx));background:none;border:none;padding:0}
.disc{width:74px;height:70px;border-radius:50%;background:var(--uc);box-shadow:0 6px 0 var(--ud);display:grid;place-items:center;color:#fff;transition:transform .12s}
.node:hover .disc{transform:translateY(-2px)}
.node:active .disc{transform:translateY(3px);box-shadow:0 3px 0 var(--ud)}
.node.fresh .disc{background:var(--surface);color:var(--uc);border:4px solid var(--uc);box-shadow:0 6px 0 var(--line)}
.disc svg{width:34px;height:34px}
.node .lbl{font-weight:800;font-size:.86rem;max-width:180px;text-align:center;line-height:1.2}
.stars{display:flex;gap:2px;color:var(--locked)}
.stars .on{color:var(--gold)}
.stars svg{width:16px;height:16px}

/* lesson */
.lesson{min-height:100%;display:flex;flex-direction:column}
.lbar{display:flex;align-items:center;gap:12px;padding-block:16px 6px}
.x{background:none;border:none;padding:6px;color:var(--muted)}
.x svg{width:24px;height:24px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.hearts{display:flex;gap:3px;color:var(--bad)}
.hearts .off{color:var(--locked)}
.hearts svg{width:22px;height:22px}
.skill{margin-top:18px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.prompt{font-size:1.3rem;font-weight:700;margin:8px 0 16px;line-height:1.45}
.prompt .math{font-size:1.6rem;font-weight:800;white-space:nowrap;display:inline-block;margin-top:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-size:.92em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}
.fr>span{padding:0 .1em}
.fig{display:flex;justify-content:center;margin:4px 0 14px;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.g-grid{stroke:var(--line);stroke-width:1}
.g-axis{stroke:var(--muted);stroke-width:1.6}
.g-line{stroke:var(--accent);stroke-width:3.5;fill:none;stroke-linecap:round}
.g-txt{fill:var(--muted);font:600 11px var(--body)}
.g-bar{fill:var(--accent)}
.g-dot{fill:var(--accent);stroke:var(--accent);stroke-width:3}
.g-dot.open{fill:var(--surface)}
table.tv{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums;font-weight:700}
table.tv td,table.tv th{border:2px solid var(--line);padding:6px 14px;text-align:center}
table.tv th{color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:700;font-size:1.04rem;line-height:1.35;box-shadow:0 3px 0 var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));box-shadow:0 3px 0 var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans input{flex:1;min-width:0;font:800 1.5rem var(--body);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.ans .u{font-weight:800;color:var(--muted);font-size:1.2rem}
.hint{color:var(--muted);font-size:.85rem;margin-top:8px}
.foot{margin-top:auto;padding-block:20px 8px}
.foot .btn{width:100%}
.fb{border-radius:18px;padding:16px;margin-top:18px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.fb h3{font-size:1.35rem;display:flex;align-items:center;gap:8px}
.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--bad)}
.fb .ex{margin-top:6px;font-size:1rem;line-height:1.6}
.fb .ex b{font-weight:800}
.fb .btn{width:100%;margin-top:12px}
.fb.ok .btn{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.fb.no .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}

/* result */
.result{text-align:center;padding-top:40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.result h1{font-size:2.2rem}
.big-stars{display:flex;gap:8px;color:var(--locked)}
.big-stars svg{width:56px;height:56px}
.big-stars .on{color:var(--gold);animation:pop .4s ease both}
.big-stars .on:nth-child(2){animation-delay:.15s}.big-stars .on:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.3)}70%{transform:scale(1.15)}to{transform:scale(1)}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.kpi{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surface)}
.kpi b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.result .btn{min-width:240px}

/* panel */
.panel h1{font-size:1.8rem;margin-top:22px}
.panel .sub{color:var(--muted);margin:4px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.sec{margin-top:26px}
.sec h2{font-size:1.25rem;margin-bottom:10px}
.chart{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.c-bar{fill:var(--gold)}.c-bar.zero{fill:var(--line)}
.c-txt{fill:var(--muted);font:700 10px var(--body)}
.c-val{fill:var(--ink);font:800 10px var(--body)}
.c-goal{stroke:var(--accent);stroke-dasharray:4 4;stroke-width:1.5}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:16px}
table.sk{width:100%;border-collapse:collapse;font-size:.92rem}
table.sk th,table.sk td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
table.sk th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
table.sk td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
table.sk tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:800;font-size:.78rem;white-space:nowrap}
.pill.g{background:var(--ok-soft);color:var(--ok)}.pill.y{background:var(--gold-soft);color:#a86a00}.pill.r{background:var(--bad-soft);color:var(--bad)}.pill.n{background:var(--line);color:var(--muted)}
:root[data-theme="dark"] .pill.y{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.y{color:var(--gold)}}
.umeter{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:10px;align-items:center;padding:6px 0;font-weight:700;font-size:.92rem}
.umeter .bar{margin:0;height:10px}
.umeter .bar>i{background:var(--uc)}
.umeter .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.name-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.name-row input{flex:1;min-width:0;font:700 1rem var(--body);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.sync{font-size:.78rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--locked);display:inline-block}
.sync.on i{background:var(--ok)}
a{color:var(--accent)}

.subjects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
@media (max-width:560px){.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}}
.subj{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;box-shadow:0 3px 0 var(--line);font-weight:800;line-height:1.2}
.subj small{color:var(--muted);font-weight:700;font-size:.78rem;display:flex;align-items:center;gap:3px}
.subj[aria-pressed="true"]{border-color:var(--sc);box-shadow:0 3px 0 var(--sc);color:var(--sc)}
.passage{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:1rem;font-weight:500;line-height:1.6;max-height:42vh;overflow:auto}
.sgrp{font:800 .78rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
table.sk tr.grp td{font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
table.sk td.muted{color:var(--muted);font-style:italic}

.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:11px;box-shadow:0 3px 0 var(--accent-deep)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}
.rewards h1{font-size:1.8rem;margin-top:22px}
.rewards .sub,.parent .sub{color:var(--muted);margin:4px 0 0}
.note.slim{padding:8px 12px;margin-top:10px}
.habits{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.hab{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 3px 0 var(--line);font-weight:800}
.hab .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.hab .hp{color:var(--gold);font-variant-numeric:tabular-nums}
.hab small{grid-column:2/4;color:var(--muted);font-weight:700;font-size:.78rem}
.hab.st-p{border-color:var(--gold)}.hab.st-p .chk{background:var(--gold);border-color:var(--gold)}
.hab.st-a{border-color:var(--ok);background:var(--ok-soft)}.hab.st-a .chk{background:var(--ok);border-color:var(--ok)}
.hab.st-r{opacity:.7}.hab.st-r .chk{background:var(--bad);border-color:var(--bad)}
.hab[disabled]{cursor:default}
.rws{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.rw{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rw-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.rw-top b{font:800 1.15rem var(--display)}
.rw-pts{color:var(--muted);font-weight:700;font-size:.85rem}
.rw .bar{margin:0}
.rw-foot{display:flex;justify-content:flex-end}
.fam-card .wk{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted);font-weight:700}
.fam-card .wk b{color:var(--ink)}
.parent{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:22px}
.parent h2{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1.35rem}
.parent h3{font-size:1.05rem;margin:18px 0 8px}
td.act{white-space:nowrap;text-align:right}
.mbtn{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;padding:0;vertical-align:middle}
.mbtn svg{width:18px;height:18px}
.mbtn.ok{color:var(--ok);border-color:var(--ok)}.mbtn.no{color:var(--bad)}
.edit{display:grid;gap:8px;margin-bottom:8px}
.erow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.erow input,.erow select{font:700 .95rem var(--body);padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.erow input:first-child{flex:1 1 180px}
.erow input.pts{width:70px;text-align:right;flex:none}
.erow select{flex:none}
.save-row{display:flex;gap:12px;align-items:center;margin-top:16px}

.who-card.add{border-style:dashed;--hue:var(--muted)}
.av.plus{background:var(--line);color:var(--muted);box-shadow:none}
.add-form{align-items:stretch;text-align:left;gap:6px;cursor:default}
.add-form label{font-weight:800;font-size:.85rem;color:var(--muted)}
.add-form input,.add-form select{font:700 1rem var(--body);padding:9px 11px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.add-row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.del-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.danger{background:var(--bad);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.stats{display:flex;align-items:center;gap:12px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px 3px 3px;font-weight:800;font-size:.9rem}
.chip i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--hue);color:#fff;display:grid;place-items:center;font-family:var(--display)}
.chip small{color:var(--muted);font-weight:700}
.who{padding-top:28px;text-align:center}
.who h1{font-size:2rem}
.who .sub{color:var(--muted);margin:6px 0 0}
.who-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
@media (max-width:560px){.who-grid{grid-template-columns:1fr}}
.who-card{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px 12px 16px;box-shadow:0 4px 0 var(--line)}
.who-card:hover{border-color:var(--hue)}
.who-card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.av{width:72px;height:72px;border-radius:50%;background:var(--hue);color:#fff;display:grid;place-items:center;font:800 2.2rem var(--display);box-shadow:0 4px 0 color-mix(in srgb,var(--hue) 60%,#000)}
.av.sm{width:40px;height:40px;font-size:1.3rem;box-shadow:none;flex:none}
.who-card .nm{font:800 1.4rem var(--display)}
.who-card .cc{color:var(--muted);font-weight:700;font-size:.9rem}
.who-card .mini{display:flex;gap:12px;font-weight:800;font-size:.85rem;color:var(--muted);margin-top:4px}
.who-card .mini span{display:flex;align-items:center;gap:3px}
.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.fam-card{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}

.fam-card .top-row{display:flex;gap:10px;align-items:center}
.fam-card .top-row b{display:block;font:800 1.15rem var(--display)}
.fam-card .top-row small{color:var(--muted);font-weight:700}
.fam-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fam-stats span{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fam-stats b{display:block;font:800 1.2rem var(--display);color:var(--ink);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.fam-card .last{font-size:.8rem;color:var(--muted)}
.panel h2.det{font-size:1.5rem;margin-top:28px}
.panel .sec h3{font-size:1.15rem;margin-bottom:10px}
.g-arc{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent);stroke-width:2}
.g-lbl{fill:var(--ink);font:800 14px var(--body)}
.g-lbl.unk{fill:var(--bad);font-size:17px}
.g-shape{fill:color-mix(in srgb,var(--accent) 14%,var(--surface));stroke:var(--accent);stroke-width:2.5}
.g-dash{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 4}
.g-on{fill:var(--accent)}.g-off{fill:var(--line)}
.g-bar2{fill:var(--gold)}
.g-dotp{fill:var(--accent)}
.pie{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-weight:700}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
@media (max-width:520px){.top .in{gap:8px}.brand{font-size:1.1rem}.stats{gap:8px}}

@media (max-width:440px){.uhead h2{font-size:1.15rem}.prompt{font-size:1.15rem}.prompt .math{font-size:1.4rem}.kpi b{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>

<header class="top"><div class="in">
  <div class="brand">Ruta de Estudio</div>
  <div class="stats" id="stats"></div>
  <nav class="tabs" aria-label="Vistas">
    <button class="tab" id="tPath" aria-pressed="true">Aprender</button>
    <button class="tab" id="tRew" aria-pressed="false" hidden>Premios</button>
    <button class="tab" id="tPanel" aria-pressed="false">Panel</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const nz = (a,b) => { let x; do { x = R(a,b); } while (x === 0); return x; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const lcm = (a,b) => a/gcd(a,b)*b;
const MINUS = '−';
const round = (n,d=6) => Math.round(n*10**d)/10**d;

function fmt(n){
  n = round(n);
  const s = Math.abs(n).toLocaleString('es-CL',{maximumFractionDigits:4, useGrouping:true});
  return (n<0 ? MINUS : '') + s;
}
const par = n => n<0 ? `(${fmt(n)})` : fmt(n);
const money = n => '$' + fmt(n);
function frac(n,d,simplify=true){
  if (simplify){ const g=gcd(n,d); n/=g; d/=g; }
  if (d<0){ n=-n; d=-d; }
  if (d===1) return fmt(n);
  return (n<0?MINUS:'') + `<span class="fr"><span>${Math.abs(n)}</span><span>${d}</span></span>`;
}
const parFrac = (n,d) => n<0 ? `(${frac(n,d,false)})` : frac(n,d,false);

// polinomio: [[coef,'x'],[coef,'y'],[coef,'']]
function poly(terms){
  let s = '';
  terms.forEach(([c,v]) => {
    if (c===0) return;
    const abs = Math.abs(c);
    const body = v ? ((abs===1 ? '' : abs) + v) : String(abs);
    if (s==='') s = (c<0 ? MINUS : '') + body;
    else s += (c<0 ? ` ${MINUS} ` : ' + ') + body;
  });
  return s || '0';
}

function parseAns(raw){
  let s = String(raw).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[$%°C]/g,'');
  if (!s) return null;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'');
  s = s.replace(',', '.');
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (m){ const d = +m[2]; return d===0 ? null : (+m[1])/d; }
  if (/^-?\d*\.?\d+$/.test(s)) return +s;
  return null;
}

// opción múltiple
function mc(correct, distract, extra={}){
  const seen = new Set([correct]); const ds = [];
  distract.forEach(d => { if (!seen.has(d)){ seen.add(d); ds.push(d); } });
  const options = shuffle([correct, ...ds.slice(0,3)]);
  return Object.assign({type:'mc', options, correct: options.indexOf(correct)}, extra);
}
const num = (ans, extra={}) => Object.assign({type:'num', ans}, extra);

/* ============ figuras SVG ============ */
function graphLine(m,n){
  const S=20, C=130, W=260, L=-6, H=6;
  let g='';
  for(let i=L;i<=H;i++){ const p=C+i*S; g+=`<line class="g-grid" x1="${p}" y1="10" x2="${p}" y2="250"/><line class="g-grid" x1="10" y1="${p}" x2="250" y2="${p}"/>`; }
  g+=`<line class="g-axis" x1="10" y1="${C}" x2="250" y2="${C}"/><line class="g-axis" x1="${C}" y1="10" x2="${C}" y2="250"/>`;
  for(let i=L;i<=H;i+=2){ if(i===0) continue; g+=`<text class="g-txt" x="${C+i*S}" y="${C+15}" text-anchor="middle">${fmt(i)}</text><text class="g-txt" x="${C-6}" y="${C-i*S+4}" text-anchor="end">${fmt(i)}</text>`; }
  const x1=-7, x2=7, y1=m*x1+n, y2=m*x2+n;
  g+=`<clipPath id="cl"><rect x="10" y="10" width="240" height="240"/></clipPath><line class="g-line" clip-path="url(#cl)" x1="${C+x1*S}" y1="${C-y1*S}" x2="${C+x2*S}" y2="${C-y2*S}"/>`;
  g+=`<text class="g-txt" x="246" y="${C-6}" text-anchor="end">x</text><text class="g-txt" x="${C+6}" y="20">y</text>`;
  return `<svg viewBox="0 0 ${W} ${W}" width="260" role="img" aria-label="Gráfico de una recta">${g}</svg>`;
}
function numberLine(r, op){
  const W=320, S=26, C=160; let g=`<line class="g-axis" x1="10" y1="40" x2="310" y2="40"/>`;
  for(let i=-5;i<=5;i++){ const x=C+i*S; g+=`<line class="g-axis" x1="${x}" y1="34" x2="${x}" y2="46"/><text class="g-txt" x="${x}" y="64" text-anchor="middle">${fmt(r+i)}</text>`; }
  const right = op==='>'||op==='≥', closed = op==='≥'||op==='≤';
  g+=`<line class="g-line" x1="${C}" y1="40" x2="${right?306:14}" y2="40"/>`;
  g+=`<path class="g-dot" d="${right?'M300 33 L312 40 L300 47':'M20 33 L8 40 L20 47'}" style="fill:var(--accent)"/>`;
  g+=`<circle class="g-dot ${closed?'':'open'}" cx="${C}" cy="40" r="7"/>`;
  return `<svg viewBox="0 0 ${W} 74" width="320" role="img" aria-label="Recta numérica">${g}</svg>`;
}
function barChart(cats, vals){
  const W=300, H=190, max=Math.max(...vals), bw=44, gap=(W-40-cats.length*bw)/(cats.length);
  let g=`<line class="g-axis" x1="34" y1="${H-30}" x2="${W-4}" y2="${H-30}"/><line class="g-axis" x1="34" y1="10" x2="34" y2="${H-30}"/>`;
  const sc=(H-50)/max;
  for(let t=0;t<=max;t+=2){ const y=H-30-t*sc; g+=`<line class="g-grid" x1="34" y1="${y}" x2="${W-4}" y2="${y}"/><text class="g-txt" x="28" y="${y+4}" text-anchor="end">${t}</text>`; }
  cats.forEach((c,i)=>{ const x=34+gap/2+i*(bw+gap), h=vals[i]*sc; g+=`<rect class="g-bar" x="${x}" y="${H-30-h}" width="${bw}" height="${h}" rx="4"/><text class="g-txt" x="${x+bw/2}" y="${H-12}" text-anchor="middle">${c}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="300" role="img" aria-label="Gráfico de barras">${g}</svg>`;
}

/* ============ generadores de ejercicios ============ */
const SKILLS = {
  ent_suma: {name:'Suma y resta de enteros', gen(){
    if (Math.random()<.3){
      const t0=R(-12,6), d=nz(-12,12), t1=t0+d, lugar=pick(['Lonquimay','Malalcahuello','Putre','Coyhaique','Punta Arenas']);
      return num(t1,{prompt:`A las 7:00 la temperatura en ${lugar} era de ${fmt(t0)} °C. Al mediodía ${d>0?'subió':'bajó'} ${Math.abs(d)} °C. ¿Qué temperatura había al mediodía?`, unit:'°C',
        explain:`${par(t0)} ${d>0?'+':MINUS} ${Math.abs(d)} = <b>${fmt(t1)} °C</b>`});
    }
    const a=nz(-20,20), b=nz(-20,20), resta=Math.random()<.5, ans=resta?a-b:a+b;
    const ex = resta
      ? `Restar es sumar el opuesto: ${fmt(a)} ${MINUS} ${par(b)} = ${fmt(a)} + ${par(-b)} = <b>${fmt(ans)}</b>`
      : (Math.sign(a)===Math.sign(b)
        ? `Mismo signo: se suman los valores absolutos y se conserva el signo. Resultado: <b>${fmt(ans)}</b>`
        : `Distinto signo: se restan los valores absolutos y queda el signo del de mayor valor absoluto. Resultado: <b>${fmt(ans)}</b>`);
    return num(ans,{prompt:`Calcula:<br><span class="math">${fmt(a)} ${resta?MINUS:'+'} ${par(b)}</span>`, explain:ex});
  }},
  ent_mult: {name:'Multiplicación y división de enteros', gen(){
    const regla = 'Signos iguales dan positivo (+); signos distintos dan negativo (−).';
    if (Math.random()<.5){
      const a=nz(-12,12), b=nz(-12,12);
      return num(a*b,{prompt:`Calcula:<br><span class="math">${par(a)} · ${par(b)}</span>`, explain:`${regla} ${Math.abs(a)} · ${Math.abs(b)} = ${Math.abs(a*b)}, entonces el resultado es <b>${fmt(a*b)}</b>.`});
    }
    const q=nz(-12,12), b=nz(-9,9), a=q*b;
    return num(q,{prompt:`Calcula:<br><span class="math">${par(a)} : ${par(b)}</span>`, explain:`${regla} ${Math.abs(a)} : ${Math.abs(b)} = ${Math.abs(q)}, entonces el resultado es <b>${fmt(q)}</b>.`});
  }},
  ent_comb: {name:'Operaciones combinadas', gen(){
    const v=R(1,3);
    if (v===1){ const a=nz(-9,9), b=nz(-6,6), c=nz(-6,6), ans=a+b*c;
      return num(ans,{prompt:`Calcula respetando la prioridad de las operaciones:<br><span class="math">${fmt(a)} + ${par(b)} · ${par(c)}</span>`, explain:`Primero la multiplicación: ${par(b)} · ${par(c)} = ${fmt(b*c)}. Luego ${fmt(a)} + ${par(b*c)} = <b>${fmt(ans)}</b>.`}); }
    if (v===2){ const a=nz(-9,9), b=nz(-9,9), c=nz(-5,5), ans=(a+b)*c;
      return num(ans,{prompt:`Calcula:<br><span class="math">(${fmt(a)} + ${par(b)}) · ${par(c)}</span>`, explain:`Primero el paréntesis: ${fmt(a)} + ${par(b)} = ${fmt(a+b)}. Luego ${par(a+b)} · ${par(c)} = <b>${fmt(ans)}</b>.`}); }
    const a=nz(-12,12), c=nz(-6,6), k=nz(-6,6), b=c*k, ans=a-k;
    return num(ans,{prompt:`Calcula:<br><span class="math">${fmt(a)} ${MINUS} ${par(b)} : ${par(c)}</span>`, explain:`Primero la división: ${par(b)} : ${par(c)} = ${fmt(k)}. Luego ${fmt(a)} ${MINUS} ${par(k)} = <b>${fmt(ans)}</b>.`});
  }},
  rac_suma: {name:'Suma y resta de racionales', gen(){
    if (Math.random()<.35){
      const X=R(10,999), Y=R(10,999), resta=Math.random()<.5, ans=(resta?X-Y:X+Y)/100;
      return num(ans,{prompt:`Calcula:<br><span class="math">${fmt(X/100)} ${resta?MINUS:'+'} ${fmt(Y/100)}</span>`, explain:`Alinea las comas y opera: ${fmt(X/100)} ${resta?MINUS:'+'} ${fmt(Y/100)} = <b>${fmt(ans)}</b>.`});
    }
    const ds=[2,3,4,5,6,8,10,12], b=pick(ds), d=pick(ds.filter(x=>x!==b));
    const a=R(1,b+2)*(Math.random()<.2?-1:1), c=R(1,d+2), resta=Math.random()<.5;
    const L=lcm(b,d), A=a*L/b, C=c*L/d, N=resta?A-C:A+C;
    return num(N/L,{tol:.006, prompt:`Calcula:<br><span class="math">${parFrac(a,b)} ${resta?MINUS:'+'} ${frac(c,d,false)}</span>`, hint:'Puedes responder como fracción (ej. 7/12) o decimal.',
      explain:`El mínimo común denominador es ${L}: ${frac(A,L,false)} ${resta?MINUS:'+'} ${frac(C,L,false)} = ${frac(N,L,false)} = <b>${frac(N,L)}</b>.`});
  }},
  rac_mult: {name:'Multiplicación y división de racionales', gen(){
    const v=R(1,4);
    if (v===1){ const a=R(1,9)*(Math.random()<.3?-1:1), b=R(2,9), c=R(1,9), d=R(2,9);
      return num(a*c/(b*d),{tol:.006, prompt:`Calcula:<br><span class="math">${parFrac(a,b)} · ${frac(c,d,false)}</span>`, hint:'Puedes responder como fracción o decimal.', explain:`Se multiplica numerador por numerador y denominador por denominador: ${frac(a*c,b*d,false)} = <b>${frac(a*c,b*d)}</b>.`}); }
    if (v===2){ const a=R(1,9), b=R(2,9), c=R(1,9)*(Math.random()<.3?-1:1), d=R(2,9);
      return num((a*d)/(b*c),{tol:.006, prompt:`Calcula:<br><span class="math">${frac(a,b,false)} : ${parFrac(c,d)}</span>`, hint:'Puedes responder como fracción o decimal.', explain:`Dividir es multiplicar por el inverso: ${frac(a,b,false)} · ${parFrac(d,c)} = ${frac(a*d,b*c,false)} = <b>${frac(a*d,b*c)}</b>.`}); }
    if (v===3){ const x=R(1,9), y=R(2,9)*(Math.random()<.5?1:11);
      const X=x/10, Y=y/10;
      return num(round(X*Y),{prompt:`Calcula:<br><span class="math">${fmt(X)} · ${fmt(Y)}</span>`, explain:`${x} · ${y} = ${x*y}. Entre los dos factores hay 2 cifras decimales, así que el resultado es <b>${fmt(round(X*Y))}</b>.`}); }
    const q=R(2,12), y=R(2,9), X=round(q*y/10), Y=y/10;
    return num(q,{prompt:`Calcula:<br><span class="math">${fmt(X)} : ${fmt(Y)}</span>`, explain:`Amplifica ambos por 10 para quitar la coma: ${fmt(X*10)} : ${y} = <b>${q}</b>.`});
  }},
  rac_prob: {name:'Problemas con racionales', gen(){
    const v=R(1,3);
    if (v===1){ const q=pick([4,5,8]), p=R(1,q-1), V=q*R(60,900), falt=V*(q-p)/q;
      return num(falt,{unit:'L', prompt:`Un estanque de ${fmt(V)} L tiene agua hasta sus ${frac(p,q,false)} partes. ¿Cuántos litros faltan para llenarlo?`, explain:`Falta ${frac(q-p,q,false)} del estanque: ${fmt(V)} · ${frac(q-p,q,false)} = <b>${fmt(falt)} L</b>.`}); }
    if (v===2){ const f=pick([0.25,0.5,0.75,1.5,2.5]), n=R(3,20), L=round(n*f);
      return num(n,{prompt:`Una cinta de ${fmt(L)} m se corta en trozos de ${fmt(f)} m. ¿Cuántos trozos se obtienen?`, explain:`${fmt(L)} : ${fmt(f)} = <b>${n}</b> trozos.`}); }
    const b=pick([2,3,4,5,6,8]), a=R(1,b-1), w1=R(1,4), d=pick([2,3,4,5,6,8].filter(x=>x!==b)), c=R(1,d-1), w2=R(1,3);
    const L=lcm(b,d), N=(w1*b+a)*L/b + (w2*d+c)*L/d;
    return num(N/L,{tol:.006, unit:'kg', prompt:`Francisca compró ${w1}${frac(a,b,false)} kg de frutillas y Liliana ${w2}${frac(c,d,false)} kg. ¿Cuántos kg compraron entre las dos?`, hint:'Puedes responder como fracción impropia (ej. 301/40) o decimal.',
      explain:`Pasa a fracción impropia: ${frac(w1*b+a,b,false)} + ${frac(w2*d+c,d,false)} = ${frac(N,L,false)} = <b>${frac(N,L)}</b> kg (≈ ${fmt(round(N/L,2))} kg).`});
  }},
  rac_comp: {name:'Comparar racionales', gen(){
    if (Math.random()<.5){
      const base=R(1,9), opts=[[`${base},8`,base+.8],[`${base},10`,base+.1],[`${base},09`,base+.09],[`${base},75`,base+.75]];
      const mayor=Math.random()<.5, sorted=opts.slice().sort((p,q)=>p[1]-q[1]), right=mayor?sorted[3]:sorted[0];
      return mc(right[0], opts.map(o=>o[0]).filter(s=>s!==right[0]),{prompt:`¿Cuál de estos números es el <b>${mayor?'mayor':'menor'}</b>?`, explain:`Compara décimas primero: ${sorted.map(o=>o[0]).join(' &lt; ')}. ${mayor?'El mayor':'El menor'} es <b>${right[0]}</b>. Más cifras no significa número más grande.`});
    }
    let a,b,c,d; do{ b=R(3,9); d=R(3,9); a=R(1,b-1); c=R(1,d-1); }while(a*d===b*c);
    const x=frac(a,b,false), y=frac(c,d,false), big = a*d>b*c ? x : y;
    return mc(big,[big===x?y:x, 'Son iguales'],{prompt:`¿Cuál fracción es mayor?`, explain:`Multiplica cruzado: ${a}·${d} = ${a*d} y ${b}·${c} = ${b*c}. Gana <b>${big}</b>.`});
  }},
  pct_basic: {name:'Calcular porcentajes', gen(){
    const p=pick([5,10,15,20,25,30,40,50,60,75]), N=R(2,60)*100, ans=p*N/100;
    const ctx=pick([`¿Cuánto es el ${p}% de ${fmt(N)}?`, `En un colegio hay ${fmt(N)} estudiantes y el ${p}% practica fútbol. ¿Cuántos estudiantes practican fútbol?`]);
    return num(ans,{prompt:ctx, explain:`${p}% de ${fmt(N)} = ${fmt(N)} · ${p} : 100 = <b>${fmt(ans)}</b>.`});
  }},
  pct_var: {name:'Variación porcentual', gen(){
    const pct=pick([-50,-40,-25,-20,-10,10,15,20,25,30,40,50]), vi=R(2,30)*1000, vf=vi*(1+pct/100);
    const item=pick(['Un producto','Una entrada al cine','Un pasaje en bus','Una mochila','Un kilo de paltas']);
    return num(pct,{unit:'%', prompt:`${item} costaba ${money(vi)} y ahora cuesta ${money(vf)}. ¿Cuál fue la variación porcentual?`, hint:'Si bajó, escribe el signo menos (ej. −20).',
      explain:`VP = (Vf − Vi) : Vi · 100 = (${fmt(vf)} − ${fmt(vi)}) : ${fmt(vi)} · 100 = <b>${fmt(pct)}%</b> (${pct>0?'aumento':'disminución'}).`});
  }},
  pct_app: {name:'Descuentos, IVA y ofertas', gen(){
    const v=R(1,3);
    if (v===1){ const neto=R(2,90)*1000, tot=Math.round(neto*1.19);
      return num(tot,{unit:'$', prompt:`Un audífono cuesta ${money(neto)} sin IVA. Si el IVA en Chile es 19%, ¿cuál es el precio final?`, explain:`${fmt(neto)} + ${fmt(neto)} · 0,19 = ${fmt(neto)} + ${fmt(neto*0.19)} = <b>${money(tot)}</b>. Atajo: ${fmt(neto)} · 1,19.`}); }
    if (v===2){ const pr=R(4,60)*1000, d=pick([10,20,25,30,40,50]), fin=pr*(100-d)/100;
      return num(fin,{unit:'$', prompt:`Unas zapatillas cuestan ${money(pr)} y tienen ${d}% de descuento. ¿Cuánto se paga?`, explain:`Pagas el ${100-d}%: ${fmt(pr)} · ${fmt((100-d)/100)} = <b>${money(fin)}</b>.`}); }

/* ============ figuras 6°C ============ */
const PIE_COLORS=['#2c62d8','#e39a12','#0f8f8a','#c43b6c'];
function angleFig(t){
  const big=t>180, W=240, H=big?170:140, cx=big?120:70, cy=big?85:115, r=big?70:150;
  const rad=a=>a*Math.PI/180, P=(a,rr)=>[cx+rr*Math.cos(rad(a)), cy-rr*Math.sin(rad(a))];
  const [x1,y1]=P(0,big?r:150), [x2,y2]=P(t,big?r:110);
  let arc;
  if (t===360) arc=`<circle cx="${cx}" cy="${cy}" r="26" class="g-arc"/>`;
  else { const [ax,ay]=P(t,26); arc=`<path class="g-arc" d="M${cx+26} ${cy} A26 26 0 ${t>180?1:0} 0 ${ax} ${ay}"/>`; }
  const [lx,ly]=P(t===360?45:t/2, 48);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Ángulo de ${t} grados">${arc}<line class="g-line" x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}"/><line class="g-line" x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}"/><circle cx="${cx}" cy="${cy}" r="4" style="fill:var(--ink)"/><text class="g-lbl" x="${lx}" y="${ly+5}" text-anchor="middle">${t}°</text></svg>`;
}
function crossFig(t, unk){
  const cx=140, cy=90, r=85, rad=a=>a*Math.PI/180, P=(a,rr)=>[cx+rr*Math.cos(rad(a)), cy-rr*Math.sin(rad(a))];

function doubleBarFig(cats, A, B){

function stemLeaf(data){
  const s=data.slice().sort((a,b)=>a-b), rows={};
  s.forEach(v=>{ const t=Math.floor(v/10); (rows[t]=rows[t]||[]).push(v%10); });
  const ts=Object.keys(rows).map(Number), lo=Math.min(...ts), hi=Math.max(...ts); let h='';
  for(let t=lo;t<=hi;t++) h+=`<tr><td>${t}</td><td style="text-align:left;letter-spacing:.35em">${(rows[t]||[]).join(' ')}</td></tr>`;
  return `<table class="tv"><tr><th>Tallo</th><th>Hojas</th></tr>${h}</table>`;
}

      ['Una campaña que dice “Recicla: el planeta te lo agradece” es:','Propaganda',['Publicidad','Noticia','Biografía'],'Promueve una conducta, no vende un producto.'],
      ['¿Cómo se llama la frase breve y fácil de recordar de un anuncio?','Eslogan',['Titular','Lead','Moraleja'],'El eslogan identifica al producto o campaña.'],
      ['¿Qué elemento del anuncio muestra la marca del producto?','El logotipo',['La bajada','El narrador','El índice'],'El logo es el símbolo gráfico de la marca.'],
      ['Un anuncio de cereal muestra a un deportista famoso comiéndolo. ¿Qué busca?','Que el público asocie el cereal con éxito y energía',['Explicar cómo se fabrica','Informar el precio exacto','Contar la vida del deportista'],'Usa la imagen de alguien admirado para persuadir.'],
      ['¿Qué actitud debe tener un lector frente a la publicidad?','Crítica: pensar si lo que promete es real',['Creer todo lo que dice','Comprar siempre','Ignorar las imágenes'],'La publicidad exagera para convencer.'],
      ['“¡El cereal más crujiente del universo!” es un ejemplo de:','Exageración o hipérbole',['Dato científico','Instrucción','Pregunta'],'No se puede comprobar: exagera para llamar la atención.'],
      ['¿A quién se le llama “público objetivo” de un anuncio?','A las personas a quienes va dirigido',['A los que fabrican el producto','A los actores','A los periodistas'],'Ej.: un anuncio de juguetes se dirige a niños y familias.'],
      ['¿Qué recurso usan los anuncios para llamar la atención rápidamente?','Imágenes llamativas y colores',['Párrafos muy largos','Notas al pie','Bibliografía'],'Lo visual atrae en pocos segundos.'],
      ['Un afiche que invita a vacunarse es:','Propaganda',['Publicidad','Novela','Receta'],'Promueve una conducta de salud.'],
      ['¿Por qué un anuncio de bebida azucarada podría ser engañoso?','Porque muestra solo lo positivo y omite efectos en la salud',['Porque tiene colores','Porque usa un eslogan','Porque aparece en la televisión'],'Leer críticamente es notar lo que no se dice.'],
      ['¿Qué tipo de texto es un anuncio publicitario?','Persuasivo o apelativo',['Narrativo','Lírico','Instructivo'],'Busca convencer al receptor.'],
    ]},
  ]},
  {t:'Comunicación oral y vocabulario', c:'#d9771a', d:'#a85808', src:'PPT Textos orales; rúbricas de disertación', L:[
    {t:'La disertación', q:[
      ['¿Qué es una disertación?','Una exposición oral sobre un tema investigado',['Un cuento leído en voz alta','Una conversación informal','Un examen escrito'],'Se presenta un tema de forma organizada frente a un público.'],
      ['¿Cuáles son las partes de una disertación?','Introducción, desarrollo y conclusión',['Inicio, nudo y desenlace','Titular, bajada y cuerpo','Estrofa y verso'],'Se presenta el tema, se explica y se cierra con una síntesis.'],
      ['¿Qué se hace en la introducción?','Se presenta el tema y se capta la atención del público',['Se dan las conclusiones','Se responden preguntas','Se agradece al final'],'Prepara al público para lo que viene.'],
      ['¿Qué es mejor usar como apoyo visual?','Imágenes y palabras clave, no párrafos largos',['Diapositivas llenas de texto','Nada, nunca','Leer todo de una hoja'],'El apoyo visual complementa; no se lee.'],
      ['¿Cuál de estas acciones ayuda en una disertación?','Mirar al público y hablar con volumen adecuado',['Darle la espalda al curso','Hablar muy rápido','Leer todo sin levantar la vista'],'El contacto visual y la voz clara mantienen la atención.'],
      ['¿Qué es el lenguaje no verbal en una exposición?','Gestos, postura y expresión del rostro',['Las palabras escritas','Las diapositivas','La bibliografía'],'Comunica junto con las palabras.'],
      ['¿Qué registro de habla corresponde a una disertación?','Formal',['Informal con garabatos','Coloquial con chistes todo el rato','Infantil'],'Es una situación académica.'],
      ['¿Qué debe incluir la conclusión?','Un resumen de las ideas principales',['Un tema nuevo','Una lista de compras','Solo un chiste'],'Cierra recordando lo más importante.'],
      ['¿Para qué se ensaya antes de disertar?','Para manejar el tiempo y ganar seguridad',['Para memorizar palabra por palabra sin entender','Para no tener que investigar','Para aburrir al público'],'Ensayar ayuda a hablar con fluidez.'],
      ['Mientras un compañero diserta, el público debe:','Escuchar con atención y respeto',['Conversar','Usar el celular','Interrumpir'],'Escuchar activamente es parte de la comunicación oral.'],
      ['¿Qué es parafrasear?','Decir una idea con tus propias palabras',['Copiar textual','Inventar datos','Leer más rápido'],'Demuestra que entendiste lo investigado.'],
      ['Una “muletilla” es:','Una palabra que se repite sin necesidad, como “eeh” o “o sea”',['Un apoyo visual','Un tipo de conclusión','Un saludo formal'],'Conviene evitarlas para hablar con claridad.'],
      ['¿Qué tipo de texto oral es una entrevista?','Un diálogo de preguntas y respuestas',['Un monólogo sin público','Una canción','Un poema'],'Un entrevistador pregunta y el entrevistado responde.'],
    ]},
    {t:'Vocabulario en contexto', q:[
      ['¿Qué palabra es sinónimo de “contemplar”?','Observar',['Ignorar','Correr','Olvidar'],'Contemplar es mirar con atención.'],
      ['¿Cuál es el antónimo de “bondadoso”?','Malvado',['Amable','Generoso','Tranquilo'],'Antónimo = significado contrario.'],
      ['En “la playa estaba solitaria”, “solitaria” significa:','Sin gente',['Muy sucia','Con mucho sol','Peligrosa'],'Solitario: sin compañía.'],
      ['¿Qué significa el prefijo “in-” en “inofensivo”?','Negación: que no ofende o no hace daño',['Dentro','Muchas veces','Antes'],'“In-”, “im-” y “des-” suelen negar.'],
      ['¿Qué palabra significa “que no se puede ver”?','Invisible',['Visible','Revisar','Visera'],'In (no) + visible.'],
      ['“Divisar” significa:','Ver algo a lo lejos',['Dividir algo','Gritar fuerte','Esconderse'],'Ej.: “divisó un barco en el horizonte”.'],
      ['¿Cuál palabra es un sinónimo de “agilidad”?','Rapidez',['Lentitud','Tristeza','Pesadez'],'Ágil es quien se mueve con soltura y rapidez.'],
      ['En “sintió una enorme resignación”, “resignación” significa:','Aceptar algo que no se puede cambiar',['Mucha alegría','Enojo fuerte','Ganas de jugar'],'Resignarse es conformarse.'],
      ['¿Qué palabra está bien escrita?','Hacia',['Asia (para indicar dirección)','Hacía (para indicar dirección)','Ásia'],'“Hacia” es preposición de dirección; “Asia” es un continente; “hacía” viene de hacer.'],
      ['“Perturbar” significa:','Alterar o interrumpir la calma',['Ordenar','Celebrar','Dormir'],'“Nada perturbaba el silencio” = nada lo alteraba.'],
      ['El sufijo “-ito” en “casita” indica:','Tamaño pequeño o cariño (diminutivo)',['Algo enorme','Una profesión','Algo pasado'],'Es un diminutivo.'],
      ['¿Qué palabra es un antónimo de “aproximarse”?','Alejarse',['Acercarse','Llegar','Arrimarse'],'Aproximarse es acercarse; lo contrario es alejarse.'],
      ['¿Qué significa “emblema”?','Un símbolo o insignia que representa algo',['Un tipo de calzado','Un problema','Un idioma'],'Ej.: un escudo es el emblema de un colegio.'],
    ]},
  ]},
];
BANKS6.cie = [
  {t:'Ecosistemas', c:'#1f8a4c', d:'#146536', src:'PPT Ecosistemas 6°; cadena y red trófica', L:[
    {t:'Componentes del ecosistema', q:[
      ['¿Qué es un ecosistema?','El conjunto de seres vivos y el ambiente físico donde se relacionan',['Solo los animales de un lugar','Solo las plantas de un bosque','Un tipo de roca'],'Incluye factores bióticos (vivos) y abióticos (no vivos).'],
      ['¿Cuál de estos es un factor abiótico?','La luz solar',['Un hongo','Un zorro','Una bacteria'],'Abiótico = sin vida: agua, luz, temperatura, suelo.'],
      ['¿Cuál de estos es un factor biótico?','Un árbol',['El agua','La temperatura','Las rocas'],'Biótico = vivo.'],
      ['Los organismos que fabrican su propio alimento mediante la fotosíntesis son:','Productores',['Consumidores','Descomponedores','Carnívoros'],'Las plantas y algas son productoras.'],
      ['Los hongos y bacterias que degradan restos de seres vivos son:','Descomponedores',['Productores','Herbívoros','Depredadores'],'Devuelven nutrientes al suelo.'],
      ['Un animal que se alimenta solo de plantas es:','Herbívoro (consumidor primario)',['Carnívoro','Descomponedor','Productor'],'Ej.: el conejo.'],
      ['¿Qué necesitan las plantas para hacer fotosíntesis?','Luz, agua y dióxido de carbono',['Solo tierra','Carne y agua','Oxígeno y azúcar'],'Producen glucosa y liberan oxígeno.'],
      ['Un animal que come plantas y animales es:','Omnívoro',['Herbívoro','Productor','Descomponedor'],'Ej.: el ser humano o el zorro culpeo.'],
      ['¿Qué ocurre si desaparecen los descomponedores?','Se acumulan restos y el suelo pierde nutrientes',['Las plantas crecen más rápido','No pasa nada','Aumenta la luz'],'Son esenciales para reciclar materia.'],
      ['¿Qué es un hábitat?','El lugar donde vive una especie',['Lo que come un animal','El nombre científico','Un tipo de clima'],'Ej.: el hábitat del pingüino de Humboldt es la costa.'],
      ['¿Qué es una población?','Un grupo de individuos de la misma especie en un lugar',['Todas las especies de un lugar','Un solo animal','Una ciudad'],'Ej.: todos los pudúes de un bosque.'],
      ['¿Qué es una comunidad?','El conjunto de poblaciones de distintas especies que viven en un lugar',['Un solo animal','Solo los humanos','Las rocas y el agua'],'Incluye todas las especies que interactúan.'],
      ['¿Cuál es la principal fuente de energía de casi todos los ecosistemas?','El Sol',['El suelo','La Luna','El viento'],'La energía solar entra por los productores.'],
    ]},
    {t:'Cadenas y redes tróficas', q:[
      ['¿Qué representa una cadena trófica?','Quién se come a quién y el paso de energía',['El tamaño de los animales','La edad de los seres vivos','Los colores de un ecosistema'],'Las flechas muestran el paso de energía.'],
      ['En una cadena trófica, ¿hacia dónde apuntan las flechas?','Desde el que es comido hacia el que come',['Desde el que come hacia el que es comido','Hacia arriba siempre','No llevan flechas'],'La flecha indica hacia dónde va la energía.'],
      ['En la cadena pasto → conejo → zorro, ¿qué es el conejo?','Consumidor primario',['Productor','Consumidor secundario','Descomponedor'],'Come al productor (pasto).'],
      ['En la cadena pasto → conejo → zorro, ¿qué es el zorro?','Consumidor secundario',['Productor','Consumidor primario','Descomponedor'],'Come al consumidor primario.'],
      ['¿Con qué tipo de organismo empieza siempre una cadena trófica?','Un productor',['Un carnívoro','Un descomponedor','Un omnívoro'],'Son los que captan energía del Sol.'],
      ['¿Qué es una red trófica?','Varias cadenas tróficas conectadas',['Una sola cadena','Una telaraña real','Un grupo de plantas'],'Representa mejor las relaciones reales.'],
      ['Si en una red trófica desaparece el conejo, ¿qué podría pasar con el pasto?','Aumentaría, porque nadie se lo come',['Desaparecería','No cambiaría nunca','Se volvería carnívoro'],'Cada cambio afecta a los demás.'],
      ['Si desaparece el conejo, ¿qué le podría pasar al zorro?','Tendría menos alimento y su población podría disminuir',['Tendría más comida','Se volvería productor','No le afecta'],'Pierde una fuente de alimento.'],
      ['En la cadena alga → krill → ballena, el krill es:','Consumidor primario',['Productor','Descomponedor','Consumidor terciario'],'Se alimenta del alga.'],
      ['¿Qué pasa con la energía a medida que se avanza en la cadena?','Disminuye, porque se usa y se pierde como calor',['Aumenta','Se mantiene igual','Desaparece al inicio'],'Por eso hay menos depredadores que herbívoros.'],
      ['Un consumidor terciario es:','Un carnívoro que come consumidores secundarios',['Una planta','Un hongo','Un herbívoro'],'Ej.: un águila que come serpientes.'],
      ['¿Por qué los descomponedores no siempre se dibujan en la cadena?','Porque actúan en todos los niveles cuando los organismos mueren',['Porque no existen','Porque son productores','Porque son muy grandes'],'Descomponen restos de cualquier nivel.'],
      ['¿Qué efecto tiene la caza excesiva de un depredador?','Pueden aumentar mucho sus presas y desequilibrar el ecosistema',['Nada','Más depredadores','Menos plantas siempre'],'Se rompe el equilibrio de la red.'],
    ]},
  ]},
  {t:'El suelo', c:'#a8521f', d:'#7e3a12', src:'PPT Suelos; El suelo – erosión', L:[
    {t:'Formación y capas', q:[
      ['¿Cómo se forma el suelo?','Por la desintegración de rocas y la acumulación de materia orgánica durante mucho tiempo',['En pocos días','Solo por la lluvia de un año','Lo fabrican las personas'],'Es un proceso lento: miles de años.'],
      ['¿Qué es la meteorización?','La desintegración de las rocas por agentes como agua, viento y temperatura',['El transporte de suelo','La caída de meteoritos','El riego de cultivos'],'Es el primer paso en la formación del suelo.'],
      ['¿Qué es el humus?','Materia orgánica descompuesta que hace fértil el suelo',['Una roca dura','Un insecto','Un tipo de arena'],'Se forma de hojas y restos descompuestos.'],
      ['¿Cuál es la capa superior del suelo, más rica en humus?','Horizonte A (suelo superficial)',['Roca madre','Horizonte C','Subsuelo profundo'],'Es oscura y fértil.'],
      ['¿Cómo se llama la capa más profunda, de roca sólida?','Roca madre',['Humus','Horizonte A','Hojarasca'],'De ella se origina el suelo.'],
      ['¿Qué tipo de suelo tiene partículas grandes y deja pasar el agua rápido?','Arenoso',['Arcilloso','Humífero','Rocoso compacto'],'Retiene poca agua.'],
      ['¿Qué tipo de suelo retiene mucha agua y se pone pegajoso?','Arcilloso',['Arenoso','Pedregoso','Volcánico seco'],'Sus partículas son muy finas.'],
      ['¿Qué tipo de suelo es más adecuado para cultivar?','Humífero (rico en materia orgánica)',['Arenoso seco','Arcilloso compacto','Rocoso'],'Tiene nutrientes y buena retención de agua.'],
      ['¿Qué componentes tiene el suelo?','Minerales, materia orgánica, agua, aire y seres vivos',['Solo arena','Solo agua','Solo rocas'],'Es una mezcla compleja.'],
      ['¿Qué seres vivos ayudan a airear el suelo?','Las lombrices',['Los peces','Los pájaros','Las ballenas'],'Cavan túneles que dejan pasar aire y agua.'],
      ['¿Qué es la permeabilidad del suelo?','La capacidad de dejar pasar el agua',['Su color','Su temperatura','Su edad'],'El arenoso es muy permeable.'],
      ['¿Por qué el suelo es un recurso natural no renovable a escala humana?','Porque tarda miles de años en formarse',['Porque se compra','Porque no se puede tocar','Porque es infinito'],'Lo que se pierde no se recupera pronto.'],
      ['¿Qué capa del suelo está formada por fragmentos de roca madre poco alterados?','Horizonte C',['Horizonte A','Humus','Hojarasca'],'Está entre el subsuelo y la roca madre.'],
    ]},
    {t:'Erosión y cuidado del suelo', q:[
      ['¿Qué es la erosión?','El desgaste y transporte del suelo por agua, viento o hielo',['La formación de suelo nuevo','El riego de plantas','La siembra'],'Se pierde la capa fértil.'],
      ['¿Qué actividad humana aumenta la erosión?','La tala de bosques',['Plantar árboles','Hacer terrazas','Usar cobertura vegetal'],'Sin raíces, el suelo queda desprotegido.'],
      ['¿Cómo protegen las raíces de las plantas al suelo?','Lo sujetan y evitan que el agua y el viento se lo lleven',['Lo calientan','Lo vuelven arena','No lo protegen'],'Por eso la reforestación ayuda.'],
      ['¿Qué es la erosión eólica?','La causada por el viento',['La causada por el agua','La causada por animales','La causada por volcanes'],'Eolo era el dios del viento.'],
      ['¿Qué es la erosión hídrica?','La causada por el agua',['La causada por el viento','La causada por el fuego','La causada por el Sol'],'Ej.: lluvias intensas que arrastran tierra.'],
      ['Las terrazas de cultivo en laderas sirven para:','Disminuir la velocidad del agua y evitar la erosión',['Decorar el cerro','Hacer caminos','Calentar el suelo'],'Forman escalones que retienen suelo.'],
      ['¿Qué efecto tiene el sobrepastoreo?','Elimina la vegetación y deja el suelo expuesto',['Mejora el suelo','Produce lluvia','Crea humus rápido'],'Demasiados animales comen toda la cubierta vegetal.'],
      ['¿Qué práctica ayuda a conservar los nutrientes del suelo?','Rotar cultivos',['Sembrar siempre lo mismo','Quemar pastizales','Echar basura'],'Cada cultivo usa nutrientes distintos.'],
      ['¿Cómo afectan los incendios forestales al suelo?','Eliminan la cubierta vegetal y favorecen la erosión',['Lo hacen más fértil para siempre','No lo afectan','Lo vuelven más húmedo'],'Tras un incendio, la lluvia arrastra más suelo.'],
      ['¿Qué es la contaminación del suelo?','La presencia de sustancias dañinas como pesticidas o basura',['La presencia de lombrices','El exceso de humus','La lluvia'],'Afecta a plantas, animales y personas.'],
      ['El compostaje ayuda al suelo porque:','Transforma restos orgánicos en abono',['Lo vuelve más seco','Elimina las lombrices','Lo endurece'],'Devuelve materia orgánica.'],
      ['¿Por qué es importante cuidar el suelo?','Porque de él dependen la agricultura, las plantas y muchos seres vivos',['Porque es decorativo','Porque es infinito','No es importante'],'Es la base de los ecosistemas terrestres.'],
      ['Un sector sin plantas en una pendiente es más vulnerable a:','La erosión por lluvia',['La fotosíntesis','La formación de humus','El aumento de lombrices'],'El agua corre rápido y arrastra suelo.'],
    ]},
  ]},
  {t:'La energía', c:'#d9771a', d:'#a85808', src:'PPT Energía y sus transformaciones; El viaje de la energía; Energy Explorer', L:[
    {t:'Formas de energía', q:[
      ['¿Qué es la energía?','La capacidad de producir cambios o realizar trabajo',['Un tipo de material','Solo la electricidad','Un ser vivo'],'Está presente en todo lo que cambia o se mueve.'],
      ['¿Qué tipo de energía tiene un auto en movimiento?','Cinética',['Potencial química','Lumínica solamente','Sonora solamente'],'Cinética = energía del movimiento.'],
      ['¿Qué energía almacena una pila?','Química',['Cinética','Eólica','Sonora'],'Se transforma en eléctrica al usarla.'],
      ['¿Qué energía tiene un objeto ubicado en altura?','Potencial gravitatoria',['Lumínica','Sonora','Térmica'],'Puede transformarse en movimiento al caer.'],
      ['¿Qué energía tienen los alimentos?','Química',['Eólica','Lumínica','Nuclear'],'El cuerpo la transforma en movimiento y calor.'],
      ['¿Qué energía produce el viento en un aerogenerador?','Eólica (cinética del aire)',['Solar','Geotérmica','Química'],'Mueve las aspas y genera electricidad.'],
      ['¿Qué tipo de energía emite una ampolleta encendida?','Lumínica y térmica',['Solo sonora','Química','Eólica'],'Produce luz y algo de calor.'],
      ['¿Cuál es una fuente de energía renovable?','El Sol',['El petróleo','El carbón','El gas natural'],'Se renueva constantemente.'],
      ['¿Cuál es una fuente NO renovable?','El carbón',['El viento','El agua de un río','El Sol'],'Se formó en millones de años y se agota.'],
      ['¿Qué energía aprovechan las centrales hidroeléctricas?','La del agua en movimiento',['La del viento','La del Sol directamente','La del petróleo'],'El agua mueve turbinas.'],
      ['La energía del interior de la Tierra que se aprovecha en termas o centrales se llama:','Geotérmica',['Eólica','Mareomotriz','Solar'],'Geo = tierra, térmica = calor.'],
      ['¿Qué energía tiene un sonido?','Sonora',['Química','Nuclear','Potencial'],'Se transmite como vibraciones.'],
      ['¿Por qué Chile tiene gran potencial de energía solar?','Porque el desierto de Atacama recibe mucha radiación solar',['Porque llueve mucho','Porque tiene muchos volcanes apagados','Porque es muy frío'],'Atacama tiene cielos despejados casi todo el año.'],
    ]},
    {t:'Transformaciones de la energía', q:[
      ['¿Qué dice el principio de conservación de la energía?','La energía no se crea ni se destruye, solo se transforma',['La energía se acaba siempre','La energía se crea de la nada','La energía solo es eléctrica'],'Cambia de una forma a otra.'],
      ['En un ventilador, la energía eléctrica se transforma principalmente en:','Cinética',['Química','Lumínica','Nuclear'],'Las aspas se mueven.'],
      ['En un panel solar, la energía lumínica se transforma en:','Eléctrica',['Química','Sonora','Cinética'],'Las celdas fotovoltaicas producen electricidad.'],
      ['Cuando andas en bicicleta, la energía química de tu cuerpo se transforma en:','Cinética',['Lumínica','Eólica','Nuclear'],'Los músculos usan la energía de los alimentos.'],
      ['En una linterna a pilas, ¿cuál es la secuencia correcta?','Química → eléctrica → lumínica',['Lumínica → química → eléctrica','Eléctrica → química → sonora','Cinética → nuclear → lumínica'],'La pila entrega energía eléctrica a la ampolleta.'],
      ['En la fotosíntesis, las plantas transforman energía lumínica en:','Energía química',['Energía sonora','Energía eólica','Energía cinética'],'La guardan en azúcares.'],
      ['¿Qué transformación ocurre en un parlante?','Eléctrica → sonora',['Sonora → química','Química → lumínica','Lumínica → eólica'],'Convierte señales eléctricas en sonido.'],
      ['Al frotar tus manos, la energía cinética se transforma en:','Térmica (calor)',['Lumínica','Química','Eléctrica'],'El roce produce calor.'],
      ['En una estufa a gas, la energía química se transforma en:','Térmica y lumínica',['Eólica','Sonora solamente','Cinética solamente'],'La combustión produce calor y luz.'],
      ['Una pelota que cae desde una mesa transforma energía:','Potencial en cinética',['Cinética en química','Lumínica en sonora','Eléctrica en potencial'],'Pierde altura y gana velocidad.'],
      ['¿Por qué se dice que una ampolleta LED es más eficiente?','Transforma más energía en luz y menos en calor',['Porque no usa electricidad','Porque es más grande','Porque suena'],'Desperdicia menos energía.'],
      ['¿Qué acción ayuda a ahorrar energía en casa?','Apagar las luces que no se usan',['Dejar el refrigerador abierto','Cargar el celular toda la noche','Encender todas las luces'],'Ahorrar energía cuida recursos y el ambiente.'],
      ['En una central eólica, la secuencia de transformación es:','Cinética del viento → cinética de las aspas → eléctrica',['Química → térmica → eléctrica','Lumínica → química','Eléctrica → eólica'],'El viento mueve las aspas que activan un generador.'],
    ]},
  ]},
  {t:'La Tierra y la pubertad', c:'#3a7bbf', d:'#255a91', src:'El planeta; Cambios en la pubertad; Aparato reproductor', L:[
    {t:'Capas de la Tierra', q:[
      ['¿Cuáles son las capas internas de la Tierra, de afuera hacia adentro?','Corteza, manto y núcleo',['Núcleo, corteza y manto','Manto, núcleo y corteza','Atmósfera, corteza y océano'],'La corteza es la capa más delgada y externa.'],
      ['¿En qué capa vivimos?','Corteza',['Manto','Núcleo externo','Núcleo interno'],'Es la capa sólida superficial.'],
      ['¿Qué capa de la Tierra es la más caliente?','El núcleo',['La corteza','El manto superior','La atmósfera'],'Supera los 5.000 °C.'],

      ['¿Cuáles son las capas externas o “esferas” de la Tierra?','Atmósfera, hidrosfera y geosfera',['Núcleo, manto y corteza','Solo la atmósfera','Biosfera y núcleo'],'Atmósfera (aire), hidrosfera (agua), geosfera (roca).'],
      ['¿Qué es la hidrosfera?','Toda el agua del planeta',['Toda el aire del planeta','Los volcanes','El núcleo'],'Océanos, ríos, lagos, hielos y aguas subterráneas.'],
      ['¿Qué son las placas tectónicas?','Grandes bloques de la corteza que se mueven',['Platos de cerámica','Nubes','Ríos subterráneos'],'Su movimiento produce sismos y volcanes.'],
      ['¿Por qué en Chile hay tantos sismos?','Porque está donde la placa de Nazca se mete bajo la placa Sudamericana',['Porque llueve mucho','Por el viento','Porque hay muchos ríos'],'Es una zona de subducción.'],
      ['¿Qué fenómeno se produce cuando el magma sale a la superficie?','Una erupción volcánica',['Un tsunami siempre','Una sequía','Un tornado'],'El magma en la superficie se llama lava.'],
      ['¿Qué es la biosfera?','La parte del planeta donde hay vida',['El centro de la Tierra','Solo el océano','El espacio exterior'],'Incluye partes de las otras esferas.'],
      ['¿Qué capa de la Tierra es la más delgada?','La corteza',['El manto','El núcleo','La atmósfera completa'],'Es como la cáscara de una manzana.'],
      ['¿Qué debes hacer durante un sismo fuerte en la sala?','Agacharte, cubrirte bajo una mesa y sujetarte',['Correr por las escaleras','Asomarte a la ventana','Usar el ascensor'],'Es la conducta recomendada de autocuidado.'],
      ['Un tsunami es:','Una serie de olas gigantes causada por un sismo bajo el mar',['Un viento fuerte','Una lluvia intensa','Una erupción en la cordillera'],'Ante alerta, hay que ir a zonas altas.'],
    ]},
    {t:'Pubertad', q:[
      ['¿Qué es la pubertad?','La etapa en que el cuerpo cambia para pasar de niño o niña a adulto',['Una enfermedad','La etapa de la vejez','La etapa de bebé'],'Ocurre más o menos entre los 9 y 15 años.'],
      ['¿Qué sustancias del cuerpo inician los cambios de la pubertad?','Las hormonas',['Las vitaminas','Los huesos','Los dientes'],'Son mensajeros químicos producidos por glándulas.'],
      ['¿La pubertad comienza a la misma edad en todas las personas?','No, cada persona tiene su propio ritmo',['Sí, siempre a los 12 años','Sí, el día del cumpleaños','Solo en las niñas'],'Es normal que haya diferencias.'],
      ['¿Cuál es un cambio físico común en niñas y niños durante la pubertad?','Aparece vello en axilas y zona genital',['Dejan de crecer','Se caen todos los dientes','Cambia el color de ojos'],'También aumenta el sudor.'],
      ['¿Qué cambio de la voz es más notorio en los niños durante la pubertad?','La voz se vuelve más grave',['La voz desaparece','La voz se vuelve más aguda siempre','No cambia'],'La laringe crece.'],
      ['¿Por qué es importante la higiene diaria en la pubertad?','Porque aumenta el sudor y la grasa en la piel',['Porque se deja de sudar','Porque el pelo se cae','No es importante'],'Ducharse y usar desodorante ayuda.'],
      ['¿Qué cambios emocionales pueden aparecer en la pubertad?','Cambios de ánimo y más interés por la propia imagen',['Ninguno','Solo felicidad','Pérdida de memoria'],'Es normal; conversar con adultos de confianza ayuda.'],
      ['El estirón de la pubertad se refiere a:','Un crecimiento rápido de estatura',['Un ejercicio de elongación','El crecimiento del pelo','Un tipo de baile'],'Se crece varios centímetros en poco tiempo.'],
      ['¿Qué es el acné?','Granitos que aparecen por el aumento de grasa en la piel',['Una alergia a la comida','Una quemadura de sol','Una herida'],'Lavar la cara ayuda a controlarlo.'],
      ['¿Cuál es la función del sistema reproductor?','Permitir la reproducción y producir hormonas sexuales',['Digerir los alimentos','Transportar oxígeno','Filtrar la sangre'],'Se desarrolla en la pubertad.'],
      ['¿Qué es la menstruación?','Un sangrado mensual normal que comienza en la pubertad de las niñas',['Una enfermedad','Una herida','Algo que solo ocurre en adultas mayores'],'Es parte del ciclo menstrual.'],
      ['Si tienes dudas sobre los cambios de tu cuerpo, lo mejor es:','Conversar con un adulto de confianza o profesional de salud',['Guardártelo siempre','Creer cualquier cosa de internet','Burlarte de otros'],'Informarse en fuentes confiables da tranquilidad.'],
      ['¿Qué actitud es correcta frente a los cambios de los compañeros?','Respetarlos y no burlarse',['Reírse de ellos','Contarle a todos','Ignorar a quien cambia antes'],'Cada cuerpo cambia a su ritmo.'],
    ]},
  ]},
];

  {t:'Organización de la República', c:'#7b4fd6', d:'#5a33ad', src:'Guía Autoritarismo conservador; Reformas liberales', L:[
    {t:'Ensayos y orden conservador', q:[

      ['¿Qué presidentes gobernaron durante los decenios conservadores?','Prieto, Bulnes y Montt',['O’Higgins y Carrera','Balmaceda y Allende','Freire y Pinto solamente'],'Cada uno gobernó diez años (dos períodos).'],
      ['¿Qué institución educativa se fundó en 1842?','La Universidad de Chile',['La Universidad de Concepción','El Instituto Nacional','La primera escuela del país'],'Su primer rector fue Andrés Bello.'],
      ['¿Qué aporte hizo Andrés Bello?','Redactó el Código Civil y fue rector de la Universidad de Chile',['Lideró la Reconquista','Fundó Santiago','Ganó la batalla de Maipú'],'Fue un gran intelectual venezolano.'],
      ['¿Qué guerra enfrentó Chile contra la Confederación Perú-Boliviana?','La Guerra contra la Confederación (1836–1839)',['La Guerra del Pacífico','La Guerra de Arauco','La Primera Guerra Mundial'],'Terminó con la batalla de Yungay.'],

    {t:'Reformas liberales y democracia', q:[

      ['¿Qué estableció la ley que prohibió la reelección inmediata del presidente (1871)?','Que el presidente no podía gobernar dos períodos seguidos',['Que el presidente sería vitalicio','Que el presidente sería elegido por el rey','Que no habría presidente'],'Limitó el poder presidencial.'],
      ['Las leyes laicas (1883–1884) crearon:','El registro civil, el matrimonio civil y los cementerios laicos',['La Iglesia católica','La Universidad de Chile','El voto femenino'],'Separaron funciones del Estado y la Iglesia.'],

      ['¿Qué poder resuelve conflictos aplicando las leyes?','El Judicial',['El Legislativo','El Ejecutivo','Las juntas de vecinos'],'Lo encabeza la Corte Suprema.'],
      ['¿Desde qué edad se puede votar en Chile?','Desde los 18 años',['Desde los 14 años','Desde los 21 años','Desde los 16 años'],'Además hay que ser ciudadano.'],
      ['¿Qué significa que el voto sea secreto?','Nadie puede saber por quién votaste',['Que no hay elecciones','Que se vota en voz alta','Que solo votan algunos'],'Protege la libertad del votante.'],
      ['¿Qué significa que el voto sea igualitario?','Cada voto vale lo mismo',['Unos votos valen más','Solo votan los ricos','Se vota dos veces'],'Una persona, un voto.'],
      ['¿Qué es una dictadura?','Un gobierno que concentra el poder sin elecciones libres ni respeto a derechos',['Un gobierno elegido por votación','Un tipo de Congreso','Una elección municipal'],'Lo opuesto a la democracia.'],

      ['Una región donde se habla una misma lengua o hay tradiciones comunes es una región:','Cultural',['Natural','Administrativa','Climática'],'Ej.: el territorio mapuche.'],
      ['¿Qué mide el Índice de Desarrollo Humano (IDH)?','Salud, educación e ingresos de la población',['Solo la cantidad de dinero','Solo el tamaño del país','La cantidad de autos'],'Considera esperanza de vida, escolaridad e ingreso.'],

BANKS8.cie = [
  {t:'Método científico y célula', c:'#1f8a4c', d:'#146536', src:'Guía Método científico; Guía Célula estructura y función', L:[
    {t:'Método científico', q:[

      ['¿Qué es una hipótesis?','Una posible respuesta o explicación que se pone a prueba',['Una ley comprobada','Un dato del experimento','La conclusión final'],'Debe poder comprobarse experimentalmente.'],
      ['En un experimento, la variable que el investigador modifica es la:','Variable independiente',['Variable dependiente','Variable controlada','Hipótesis'],'Ej.: la cantidad de luz que recibe una planta.'],

  {t:'Membrana y tejidos', c:'#3a7bbf', d:'#255a91', src:'Membrana celular, transporte pasivo y activo; Guía Tejidos animales', L:[
    {t:'Transporte a través de la membrana', q:[

      ['¿Qué es el transporte pasivo?','El paso de sustancias sin gasto de energía, a favor del gradiente',['Paso con gasto de energía','Entrada de alimentos grandes','Salida de células'],'De mayor a menor concentración.'],
      ['¿Qué es la difusión?','El movimiento de partículas de mayor a menor concentración',['De menor a mayor concentración','El paso del agua solamente','Un transporte con ATP'],'Ej.: el oxígeno entrando a la célula.'],
      ['¿Qué es la osmosis?','El paso de agua a través de una membrana semipermeable',['El paso de glucosa con energía','La entrada de bacterias','La división celular'],'El agua va hacia donde hay más solutos.'],
      ['Si una célula animal se coloca en agua destilada (medio hipotónico), ¿qué ocurre?','Entra agua y puede reventar',['Pierde agua y se arruga','No cambia','Se divide'],'El agua entra hacia donde hay más solutos.'],
      ['Si una célula se coloca en agua muy salada (medio hipertónico), ¿qué ocurre?','Pierde agua y se arruga',['Gana agua y revienta','No ocurre nada','Se vuelve vegetal'],'El agua sale hacia el medio más concentrado.'],
      ['¿Qué es el transporte activo?','El paso de sustancias en contra del gradiente, con gasto de energía (ATP)',['Paso sin energía','Difusión simple','Osmosis'],'Ej.: bomba sodio-potasio.'],
      ['La difusión facilitada ocurre:','Con ayuda de proteínas de membrana, sin gasto de energía',['Con gasto de ATP','Sin membrana','Solo con agua'],'Es un tipo de transporte pasivo.'],
      ['La endocitosis es:','La entrada de partículas grandes envolviéndolas con la membrana',['La salida de sustancias','El paso de agua','La división del núcleo'],'Ej.: fagocitosis de bacterias.'],
      ['La exocitosis es:','La salida de sustancias en vesículas que se fusionan con la membrana',['La entrada de alimento','La osmosis','La difusión simple'],'Ej.: secreción de hormonas.'],
      ['¿Por qué se marchita una lechuga con sal?','Porque pierde agua por osmosis',['Porque gana agua','Porque se calienta','Porque absorbe la sal y crece'],'La sal crea un medio hipertónico.'],
      ['¿Qué molécula aporta la energía para el transporte activo?','El ATP',['El agua','El oxígeno','La celulosa'],'Es la “moneda energética” de la célula.'],

    {t:'Tejidos y organización', q:[
      ['¿Qué es un tejido?','Un conjunto de células similares que cumplen una función común',['Un órgano completo','Una sola célula','Un sistema del cuerpo'],'Ej.: tejido muscular.'],

  {t:'Electricidad (Física)', c:'#c43b6c', d:'#952450', src:'Taller de Física: Ley de Ohm, potencia eléctrica, circuitos y energía', L:[
    {t:'Carga y circuitos', q:[
      ['¿Qué partícula tiene carga negativa?','El electrón',['El protón','El neutrón','El átomo completo'],'Los protones son positivos.'],

      ['¿Qué material es buen conductor de electricidad?','El cobre',['El plástico','La madera seca','El vidrio'],'Por eso se usa en los cables.'],

      ['¿Qué tipo de circuito se usa en las casas?','En paralelo',['En serie','Sin conductores','Abierto siempre'],'Así cada aparato funciona independiente.'],
      ['¿Qué es un circuito abierto?','Uno interrumpido, por el que no circula corriente',['Uno que funciona','Uno con muchas pilas','Uno con cables de cobre'],'Ej.: interruptor apagado.'],
      ['¿Con qué unidad se mide el voltaje?','Volt (V)',['Ampere (A)','Ohm (Ω)','Watt (W)'],'Es la diferencia de potencial.'],
      ['¿Con qué unidad se mide la resistencia eléctrica?','Ohm (Ω)',['Volt','Ampere','Joule'],'Indica la oposición al paso de corriente.'],
      ['¿Qué dispositivo protege un circuito cortando la corriente si hay exceso?','El fusible o disyuntor',['La ampolleta','El enchufe','El cable'],'Previene incendios.'],

    {t:'Ley de Ohm y potencia', q:[
      ['¿Qué dice la Ley de Ohm?','V = I · R',['V = I + R','I = V · R','R = V + I'],'Voltaje = intensidad × resistencia.'],

      ['Si I = 2 A y R = 10 Ω, ¿cuál es el voltaje?','20 V',['5 V','12 V','0,2 V'],'V = I · R = 2 · 10.'],
      ['Si V = 220 V e I = 11 A, ¿cuál es la resistencia?','20 Ω',['2.420 Ω','209 Ω','231 Ω'],'R = V / I = 220 / 11.'],

      ['Un hervidor funciona con 220 V y 10 A. ¿Cuál es su potencia?','2.200 W',['22 W','230 W','2,2 W'],'P = 220 · 10.'],

      ['¿En qué unidad cobra la compañía eléctrica la energía consumida?','Kilowatt-hora (kWh)',['Volt','Ohm','Ampere'],'Energía = potencia × tiempo.'],

      ['¿Qué medida ayuda a ahorrar electricidad?','Desenchufar aparatos que no se usan',['Dejar el cargador conectado siempre','Usar ampolletas incandescentes','Abrir el refrigerador a cada rato'],'Muchos aparatos consumen en reposo.'],

  {t:'El átomo (Química)', c:'#7b4fd6', d:'#5a33ad', src:'Taller de Química: modelos atómicos, constitución atómica, números cuánticos', L:[
    {t:'Modelos atómicos', q:[
      ['¿Qué planteaba Dalton sobre el átomo (1808)?','Que era una esfera indivisible',['Que tenía electrones en órbitas','Que tenía un núcleo con protones','Que era un pudín con pasas'],'Era la partícula más pequeña e indivisible.'],
      ['¿Qué partícula descubrió Thomson?','El electrón',['El protón','El neutrón','El núcleo'],'Usando tubos de rayos catódicos.'],
      ['¿Cómo se conoce el modelo de Thomson?','Budín (pudín) de pasas',['Sistema planetario','Esfera indivisible','Nube de electrones'],'Electrones incrustados en una masa positiva.'],
      ['¿Qué descubrió Rutherford con su experimento de la lámina de oro?','Que el átomo tiene un núcleo pequeño, denso y positivo',['Que el átomo es indivisible','Que no hay electrones','Que los átomos son cuadrados'],'La mayoría de las partículas atravesaban la lámina.'],
      ['Según Rutherford, ¿cómo es la mayor parte del átomo?','Espacio vacío',['Sólida','Líquida','Llena de protones'],'Por eso las partículas alfa pasaban.'],
      ['¿Qué aportó Bohr al modelo atómico?','Los electrones giran en niveles de energía definidos',['El átomo es indivisible','Descubrió el neutrón','El átomo es un pudín'],'Explica los espectros de emisión.'],
      ['¿Quién descubrió el neutrón en 1932?','James Chadwick',['Dalton','Thomson','Bohr'],'Partícula sin carga del núcleo.'],
      ['¿Qué filósofo griego propuso la idea de átomo (“indivisible”)?','Demócrito',['Aristóteles','Platón','Pitágoras'],'Sin experimentos, solo por razonamiento.'],
      ['¿Qué observó Crookes en los tubos de descarga?','Rayos que se propagaban en línea recta desde el cátodo',['Que el átomo es indivisible','El núcleo','Las órbitas'],'Fueron los rayos catódicos.'],
      ['El modelo actual describe a los electrones en:','Orbitales, zonas de probabilidad',['Órbitas circulares fijas','Pasas en un budín','El núcleo'],'Modelo mecano-cuántico.'],
      ['¿Por qué cambian los modelos atómicos con el tiempo?','Porque nuevas evidencias muestran limitaciones de los anteriores',['Porque los científicos se aburren','Por moda','Porque los átomos cambian'],'La ciencia es dinámica.'],
      ['¿Qué fenómeno NO podía explicar el modelo de Dalton?','La radiactividad',['Que existen elementos','Que el agua tiene hidrógeno y oxígeno','Que los átomos se combinan'],'Mostró que el átomo sí tenía partes.'],
      ['¿Qué indican los números cuánticos?','La ubicación probable y la energía de un electrón en el átomo',['La masa del núcleo','El número de neutrones','La edad del átomo'],'Son cuatro: n, l, m y s.'],
    ]},
    {t:'Constitución atómica', q:[
      ['¿Qué indica el número atómico (Z)?','La cantidad de protones',['La cantidad de neutrones','La masa total','La cantidad de moléculas'],'Identifica al elemento.'],
      ['¿Qué indica el número másico (A)?','Protones + neutrones',['Solo protones','Solo electrones','Electrones + protones'],'Partículas del núcleo.'],
      ['Un átomo con Z = 6 y A = 14, ¿cuántos neutrones tiene?','8',['6','14','20'],'n = A − Z = 14 − 6.'],
      ['Un átomo neutro con Z = 11, ¿cuántos electrones tiene?','11',['22','10','12'],'En un átomo neutro, electrones = protones.'],
      ['¿Qué son los isótopos?','Átomos del mismo elemento con distinto número de neutrones',['Elementos distintos con igual masa','Átomos con distinto número de protones','Iones negativos'],'Igual Z, distinto A.'],
      ['Protio, deuterio y tritio son isótopos del:','Hidrógeno',['Oxígeno','Carbono','Helio'],'Tienen 0, 1 y 2 neutrones.'],
      ['¿Qué es un catión?','Un ion con carga positiva, que perdió electrones',['Un ion negativo','Un átomo neutro','Un neutrón libre'],'Ej.: Na⁺.'],
      ['¿Qué es un anión?','Un ion con carga negativa, que ganó electrones',['Un ion positivo','Un protón','Un isótopo'],'Ej.: Cl⁻.'],
      ['El ion Mg²⁺ (Z = 12) tiene:','10 electrones',['12 electrones','14 electrones','2 electrones'],'Perdió 2 electrones: 12 − 2.'],
      ['El ion O²⁻ (Z = 8) tiene:','10 electrones',['8 electrones','6 electrones','16 electrones'],'Ganó 2 electrones: 8 + 2.'],
      ['¿Qué son los isóbaros?','Átomos de elementos distintos con igual número másico',['Mismo elemento con distinto A','Igual número de neutrones','Iones con igual carga'],'Igual A, distinto Z.'],
      ['¿Qué son los isótonos?','Átomos distintos con igual número de neutrones',['Igual número másico','Mismo elemento','Igual número de electrones'],'Distinto A y Z, mismo n.'],
      ['¿Dónde se encuentran los protones y neutrones?','En el núcleo',['En la nube electrónica','Fuera del átomo','En los orbitales externos'],'Los electrones están alrededor.'],
    ]},
  ]},
];

  {t:'La Ilustración', c:'#7b4fd6', d:'#5a33ad', src:'Ficha informativa principios políticos de la Ilustración; Manual del redactor ilustrado', L:[
    {t:'Ideas ilustradas', q:[
      ['¿Qué fue la Ilustración?','Un movimiento intelectual del siglo XVIII que confiaba en la razón',['Una guerra religiosa','Un estilo de pintura medieval','Un imperio'],'Se le llamó el “Siglo de las Luces”.'],
