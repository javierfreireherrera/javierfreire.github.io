      ['¿Qué significa “soberanía popular”?','Que el poder pertenece al pueblo',['Que el poder pertenece al rey','Que el poder es de la Iglesia','Que no hay poder'],'Base de las democracias.'],
      ['¿Qué revolución de 1789 aplicó ideas ilustradas?','La Revolución Francesa',['La Revolución Industrial','La Revolución Rusa','La Revolución Cubana'],'Lema: libertad, igualdad, fraternidad.'],
      ['¿Qué documento se aprobó en 1789 en Francia?','La Declaración de los Derechos del Hombre y del Ciudadano',['La Constitución de Chile','El Tratado de Tordesillas','La Carta Magna'],'Afirmó derechos universales.'],
      ['¿Qué país independizado en 1776 se inspiró en ideas ilustradas?','Estados Unidos',['Brasil','Canadá','México'],'Su Declaración de Independencia menciona derechos naturales.'],
      ['¿Qué es el despotismo ilustrado?','Reyes absolutos que aplicaron reformas ilustradas: “todo para el pueblo, pero sin el pueblo”',['Una democracia','Una república federal','Una dictadura militar moderna'],'Ej.: Carlos III de España.'],
      ['¿Cómo influyó la Ilustración en América?','Inspiró los movimientos de independencia',['No tuvo influencia','Fortaleció el absolutismo','Detuvo el comercio'],'Los criollos leyeron a los ilustrados.'],
      ['¿Qué valoraban los ilustrados por sobre la tradición y la fe?','La razón y la ciencia',['La superstición','La obediencia ciega','La fuerza'],'“¡Atrévete a saber!” (Kant).'],
    ]},
    {t:'Revoluciones y derechos', q:[
      ['¿Qué hecho simboliza el inicio de la Revolución Francesa?','La toma de la Bastilla (14 de julio de 1789)',['La coronación de Napoleón','La caída de Constantinopla','El descubrimiento de América'],'Era una prisión símbolo del absolutismo.'],
      ['¿Qué tres estamentos formaban la sociedad francesa antes de 1789?','Clero, nobleza y tercer estado',['Reyes, presidentes y ministros','Ricos, pobres y extranjeros','Campesinos, obreros y soldados'],'El tercer estado era la gran mayoría y pagaba impuestos.'],
      ['¿Qué grupo lideró la Revolución Francesa?','La burguesía',['El clero','La nobleza','Los reyes'],'Quería participar del poder político.'],
      ['¿Qué significa la separación de poderes?','Que el Ejecutivo, el Legislativo y el Judicial están en manos distintas',['Que el rey tiene todo el poder','Que no hay leyes','Que cada región tiene su rey'],'Evita los abusos de poder.'],
      ['¿Qué son los derechos naturales según los ilustrados?','Derechos que tiene toda persona por el solo hecho de ser humana',['Derechos que da el rey','Derechos solo de los nobles','Leyes sobre la naturaleza'],'Vida, libertad, igualdad, propiedad.'],
      ['¿Qué es una constitución?','La ley fundamental que organiza el Estado y garantiza derechos',['Un tratado comercial','Una carta personal','Un libro de historia'],'Limita el poder de los gobernantes.'],
      ['¿Qué es una república?','Una forma de gobierno donde las autoridades se eligen y gobiernan por un tiempo limitado',['Un reino hereditario','Un imperio','Un gobierno religioso'],'Lo contrario de la monarquía hereditaria.'],
      ['¿Qué ideal ilustrado se refleja en “todos los hombres nacen libres e iguales en derechos”?','La igualdad ante la ley',['El absolutismo','El mercantilismo','El feudalismo'],'Fin de los privilegios por nacimiento.'],
      ['¿Qué fue la independencia de las Trece Colonias?','La separación de colonias inglesas en América del Norte que formaron Estados Unidos',['La independencia de Chile','La unificación de Italia','La conquista de México'],'Declarada en 1776.'],
      ['¿Qué papel tuvo la prensa durante la Ilustración?','Difundir ideas y críticas al poder',['Prohibir libros','Apoyar solo al rey','No existía la prensa'],'Folletos, periódicos y la Enciclopedia.'],
      ['¿Qué fue el Antiguo Régimen?','El sistema de monarquía absoluta y sociedad estamental previo a las revoluciones',['Un gobierno democrático','Una dictadura militar del siglo XX','La Prehistoria'],'Las revoluciones lo derribaron.'],
      ['¿Qué implica la libertad de expresión?','El derecho a manifestar ideas sin censura',['Obligar a todos a pensar igual','Prohibir los periódicos','Hablar solo con permiso del rey'],'Defendida por Voltaire.'],
      ['¿Por qué se dice que las ideas ilustradas siguen vigentes?','Porque las democracias actuales se basan en derechos y separación de poderes',['Porque seguimos teniendo reyes absolutos','Porque se prohibió la ciencia','No siguen vigentes'],'Están en las constituciones modernas.'],
    ]},
  ]},

    let i, tries=0; do{ i=Math.floor(Math.random()*list.length); tries++; }while(recent.includes(i) && tries<40);
    recent.push(i); if (recent.length>Math.min(8,list.length-2)) recent.shift();
    const [q,ok,ds,ex,pk]=list[i];
    return mc(ok, shuffle(ds), {prompt:(pk?`<div class="passage">${passages[pk]}</div>`:'')+q, explain:ex});

/* ============ lección ============ */
function startLesson(id, skills){
  const sk = skills || LESSONS[id].sk;
  let q=[]; while(q.length<PER_LESSON) q=q.concat(shuffle(sk));
  LS = {who, id, title: id==='repaso'?'Repaso de errores · '+SUBJ_T[getSubj()]:SUBJ_T[LESSONS[id].sj]+' · '+LESSONS[id].t, queue:q.slice(0,PER_LESSON), i:0, correct:0, mistakes:0, hearts:3, tally:{}, cur:null, sel:null, done:false};
  view='lesson'; setTab('path'); window.scrollTo({top:0}); nextQ();
}
function nextQ(){
  if (LS.correct>=PER_LESSON || LS.hearts<=0) return finish();
  const key = LS.queue[LS.i];
  LS.cur = Object.assign({key}, SKILLS[key].gen()); LS.sel=null; LS.done=false;
  drawQ();
}
function drawQ(){
  const q=LS.cur;
  app.innerHTML = `<div class="lesson">
    <div class="lbar"><button class="x" id="bQuit" aria-label="Salir de la lección">${IC.x}</button>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${PER_LESSON}" aria-valuenow="${LS.correct}"><i style="width:${LS.correct/PER_LESSON*100}%"></i></div>
      <div class="hearts" aria-label="${LS.hearts} vidas">${[1,2,3].map(i=>`<span class="${i<=LS.hearts?'':'off'}">${IC.heart}</span>`).join('')}</div></div>
    <div class="skill">${SKILLS[q.key].name}</div>
    <div class="prompt">${q.prompt}</div>
    ${q.figure?`<div class="fig">${q.figure}</div>`:''}
    ${q.type==='mc'
      ? `<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${o}</button>`).join('')}</div>`
      : `<div class="ans"><input id="inp" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu respuesta" aria-label="Tu respuesta">${q.unit?`<span class="u">${q.unit}</span>`:''}</div>
         <div class="hint">${q.hint||'Usa coma para decimales y el signo − para negativos.'}</div>`}
    <div id="fbBox"></div>
    <div class="foot" id="footBox"><button class="btn" id="bCheck" disabled>Comprobar</button></div>
  </div>`;
  $('#bQuit').onclick=()=>{ view='path'; render(); };
  const bc=$('#bCheck');
  if (q.type==='mc'){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(LS.done) return; app.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); LS.sel=+b.dataset.i; bc.disabled=false; });
  } else {
    const inp=$('#inp'); inp.focus({preventScroll:true});
    inp.oninput=()=>{ bc.disabled = parseAns(inp.value)===null; };
    inp.onkeydown=e=>{ if(e.key==='Enter' && !bc.disabled && !LS.done){ e.preventDefault(); check(); } };
  }
  bc.onclick=check;
}
function check(){
  const q=LS.cur; let ok;
  if (q.type==='mc'){
    ok = LS.sel===q.correct;
    app.querySelectorAll('.opt').forEach((b,i)=>{ if(i===q.correct) b.classList.add('right'); else if(i===LS.sel) b.classList.add('wrong'); });
  } else {
    const v=parseAns($('#inp').value); $('#inp').readOnly=true;
    ok = v!==null && Math.abs(v-q.ans) <= (q.tol||1e-6);
  }
  LS.done=true;
  const t=LS.tally[q.key]||(LS.tally[q.key]={ok:0,n:0}); t.n++;
  if (ok){ LS.correct++; t.ok++; } else { LS.mistakes++; LS.hearts--; LS.queue.push(q.key); }
  LS.i++;
  const right = q.type==='mc' ? q.options[q.correct] : `${q.unit==='$'?'$':''}${fmt(q.ans)}${q.unit&&q.unit!=='$'?' '+q.unit:''}`;
  $('#footBox').innerHTML='';
  $('#fbBox').innerHTML = `<div class="fb ${ok?'ok':'no'}" role="status">
    <h3>${ok?IC.check+' ¡Correcto!':'Respuesta correcta: '+right}</h3>
    <div class="ex">${q.explain}</div>
    <button class="btn" id="bNext">${LS.hearts<=0?'Ver resultado':'Continuar'}</button></div>`;
  document.querySelector('.prog i').style.width = (LS.correct/PER_LESSON*100)+'%';
  document.querySelectorAll('.hearts > span').forEach((h,i)=>h.className = i<LS.hearts?'':'off');
  const bn=$('#bNext'); bn.focus({preventScroll:true}); bn.onclick=nextQ;
  bn.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function finish(){
  const S=ST[LS.who], won=LS.correct>=PER_LESSON;
  const stars = !won ? 0 : LS.mistakes===0 ? 3 : LS.mistakes<=2 ? 2 : 1;
  const xp = won ? 10 + LS.correct + (LS.mistakes===0?5:0) : LS.correct;
  const answered = LS.correct + LS.mistakes;
  S.xp += xp;
  const d=today(); S.days[d]=(S.days[d]||0)+xp;
  if (LS.id!=='repaso' && stars){ const prev=S.lessons[LS.id]||{stars:0,times:0}; S.lessons[LS.id]={stars:Math.max(prev.stars,stars), times:(prev.times||0)+1}; }
  Object.entries(LS.tally).forEach(([k,t])=>{ const s=S.skills[k]||{ok:0,n:0}; S.skills[k]={ok:s.ok+t.ok, n:s.n+t.n}; });
  S.sessions.unshift({t:Date.now(), l:LS.id, title:LS.title, ok:LS.correct, n:answered, xp, won});
  S.sessions = S.sessions.slice(0,60);
  S.updatedAt = Date.now();
  saveLocal(LS.who); push(LS.who);
  renderStats();
  app.innerHTML = `<div class="result">
    ${won?starsHtml(stars,'big-stars'):''}
    <h1>${won?(stars===3?'¡Lección perfecta!':'¡Lección completada!'):'Se acabaron las vidas'}</h1>
    <p>${won?LS.title:'Repasa las explicaciones y vuelve a intentarlo. Los ejercicios cambian cada vez.'}</p>
    <div class="kpis">
      <div class="kpi"><b>+${xp}</b><span>XP</span></div>
      <div class="kpi"><b>${answered?Math.round(LS.correct/answered*100):0}%</b><span>Precisión</span></div>
      <div class="kpi"><b>${streakOf(S)}</b><span>Racha</span></div>
    </div>
    <button class="btn" id="bBack">Continuar</button>
    <button class="btn ghost" id="bAgain">Repetir con otros números</button>
  </div>`;
  const id=LS.id, sk=LS.id==='repaso'?Object.keys(LS.tally):null;
  $('#bBack').onclick=()=>{ view='path'; render(); };
  $('#bAgain').onclick=()=>startLesson(id, sk);
  $('#bBack').focus({preventScroll:true});
}

    {id:'cama', n:'Hacer la cama', p:5},

  ],

};
let CFG = JSON.parse(JSON.stringify(DEFAULT_CFG));
const HAB = {};   // id doc "<niño>_<lunes>" -> {child, week, e:{"<fecha>__<hábito>": {h,n,d,p,s,t}}}
const CAN = {};   // id niño -> {c:{"<premio>__<periodo>": {r,n,per,pk,p,s,t}}}

try { const r=localStorage.getItem('ruta-cfg'); if (r) CFG=Object.assign(CFG, JSON.parse(r)); } catch(e) {}
try { const r=localStorage.getItem('ruta-hab'); if (r) Object.assign(HAB, JSON.parse(r)); } catch(e) {}
try { const r=localStorage.getItem('ruta-can'); if (r) Object.assign(CAN, JSON.parse(r)); } catch(e) {}
const saveRW = () => { try { localStorage.setItem('ruta-cfg',JSON.stringify(CFG)); localStorage.setItem('ruta-hab',JSON.stringify(HAB)); localStorage.setItem('ruta-can',JSON.stringify(CAN)); } catch(e) {} };

const dKey = d => d.toLocaleDateString('en-CA');
function mondayOf(d=new Date()){ const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }
const weekKey = (d=new Date()) => dKey(mondayOf(d));
const monthKey = (d=new Date()) => dKey(d).slice(0,7);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function weekDates(d=new Date()){ const m=mondayOf(d); return Array.from({length:7},(_,i)=>{ const x=new Date(m); x.setDate(m.getDate()+i); return dKey(x); }); }

function deepMerge(t, p){ for (const k in p){ if (p[k] && typeof p[k]==='object' && !Array.isArray(p[k])){ t[k]=deepMerge(t[k]&&typeof t[k]==='object'?t[k]:{}, p[k]); } else t[k]=p[k]; } return t; }

let RWDB = null;
async function dbPatch(col, id, patch, full){
  if (!RWDB) return;
  const ref = RWDB.doc(col+'/'+id);
  try { await ref.update(patch); }
  catch(e){ try { await ref.set(JSON.parse(JSON.stringify(full))); } catch(e2) { sync = e2 && e2.code==='invalid_argument' ? 'readonly' : sync; renderSync(); } }
}
function patchHab(child, week, key, val){
  const id=`${child}_${week}`;
  HAB[id] = deepMerge(HAB[id]||{child,week,e:{}}, {e:{[key]:val}});
  saveRW(); dbPatch('habitos', id, {e:{[key]:val}}, HAB[id]);
}
function patchCan(child, key, val){
  CAN[child] = deepMerge(CAN[child]||{c:{}}, {c:{[key]:val}});
  saveRW(); dbPatch('canjes', child, {c:{[key]:val}}, CAN[child]);
}
async function saveCfg(){
  CFG.updatedAt = Date.now(); saveRW();
  if (RWDB) { try { await RWDB.doc('config/familia').set(JSON.parse(JSON.stringify(CFG))); } catch(e) {} }
}
function rerenderSoft(){ if (view==='rewards') renderRewards(false); else if (view==='panel') renderPanel(); else if (view==='path') renderStats(); }
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db'); if (!db) return; RWDB = db;
    db.doc('config/familia').onSnapshot(snap=>{ if (snap.exists){ const r=snap.data(); if ((r.updatedAt||0) >= (CFG.updatedAt||0)){ CFG=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)), JSON.parse(JSON.stringify(r))); saveRW(); rerenderSoft(); } } }, ()=>{});
    db.collection('habitos').onSnapshot(qs=>{ qs.docs.forEach(d=>{ HAB[d.id]=JSON.parse(JSON.stringify(d.data())); }); saveRW(); rerenderSoft(); }, ()=>{});
    db.collection('canjes').onSnapshot(qs=>{ qs.docs.forEach(d=>{ CAN[d.id]=JSON.parse(JSON.stringify(d.data())); }); saveRW(); rerenderSoft(); }, ()=>{});
  } catch(e) {}
})();

function habEntries(child){ return Object.values(HAB).filter(d=>d && d.child===child).flatMap(d=>Object.entries(d.e||{}).map(([k,v])=>Object.assign({k, week:d.week}, v))); }
function lessonPts(child, dates){ const S=ST[child]; return dates.reduce((a,d)=>a+(S.days[d]||0),0); }
function habPts(child, dates, status='a'){ const set=new Set(dates); return habEntries(child).filter(e=>e.s===status && set.has(e.d)).reduce((a,e)=>a+(e.p||0),0); }
function monthDates(d=new Date()){ const y=d.getFullYear(), m=d.getMonth(), n=new Date(y,m+1,0).getDate(); return Array.from({length:n},(_,i)=>dKey(new Date(y,m,i+1))); }
function periodInfo(child, per){
  const dates = per==='s' ? weekDates() : monthDates();
  const earned = lessonPts(child,dates) + habPts(child,dates,'a');
  const pending = habPts(child,dates,'p');
  const pk = per==='s' ? weekKey() : monthKey();
  const claims = Object.values((CAN[child]||{}).c||{}).filter(c=>c.per===per && c.pk===pk && c.s!=='x');
  const spent = claims.reduce((a,c)=>a+(c.p||0),0);
  return {dates, earned, pending, pk, claims, spent, avail: earned-spent};
}
const perLabel = per => per==='s' ? 'esta semana' : 'este mes';

  app.innerHTML = `<div class="rewards">
    <h1>Mis puntos y premios</h1>

    <div class="cards">

    <section class="sec"><h2>Tareas de hoy</h2>
      <div class="habits">${hs.map(h=>{ const e=todayE[h.id], st=e&&e.s!=='x'?e.s:null;
        return `<button class="hab ${st?'st-'+st:''}" data-hab="${h.id}" aria-pressed="${!!st}" ${st&&st!=='p'?'disabled':''}>
          <span class="chk">${st?IC.check:''}</span><span class="hn">${esc(h.n)}</span><span class="hp">+${h.p}</span>
          ${st?`<small>${stateTxt[st]}${st==='p'?' · toca para deshacer':''}</small>`:''}</button>`; }).join('')}</div>
    </section>
    <section class="sec"><h2>Premios</h2>

      <div class="rws">${CFG.rewards.map(card).join('')}</div>
    </section>
  </div>`;
  app.querySelectorAll('[data-hab]').forEach(b=>b.onclick=()=>{
    const h=hs.find(x=>x.id===b.dataset.hab), e=todayE[h.id], key=`${td}__${h.id}`;
    if (e && e.s==='p') patchHab(who, weekKey(), key, {s:'x', t:Date.now()});

    renderRewards(false);
  });
  app.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{
    const r=CFG.rewards.find(x=>x.id===b.dataset.claim), P=r.per==='s'?W:M;

    renderRewards(false);
  });
  if (scroll) window.scrollTo({top:0});
}

function bindParent(){

  app.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>{ readEdits(); CFG.rewards.splice(+b.dataset.dr,1); renderPanel(); });
  $('#bSaveCfg').onclick=async()=>{ readEdits(); await saveCfg(); $('#cfgMsg').textContent='Guardado.'; };
}

    <section class="sec"><h3>Habilidades</h3><div class="tbl-wrap"><table class="sk">
      <tr><th>Habilidad</th><th style="text-align:right">Intentos</th><th style="text-align:right">Acierto</th><th>Estado</th></tr>
      ${SUBJ.map(x=>{ const rs=rowsFor(x.id).filter(r=>r.n>0); return `<tr class="grp"><td colspan="4">${x.t}</td></tr>`+(rs.length?rs.map(r=>`<tr><td>${r.name}</td><td class="n">${r.n}</td><td class="n">${Math.round(r.p*100)}%</td><td>${r.pill}</td></tr>`).join(''):`<tr><td colspan="4" class="muted">Sin práctica todavía</td></tr>`); }).join('')}
    </table></div></section>
    <section class="sec"><h3>Últimas sesiones</h3>
      ${S.sessions.length?`<div class="tbl-wrap"><table class="sk"><tr><th>Cuándo</th><th>Lección</th><th style="text-align:right">Correctas</th><th style="text-align:right">XP</th></tr>
      ${S.sessions.slice(0,15).map(x=>`<tr><td>${fmtDate(x.t)}</td><td>${esc(x.title)}${x.won?'':' <span class="pill r">Sin terminar</span>'}</td><td class="n">${x.ok}/${x.n}</td><td class="n">+${x.xp}</td></tr>`).join('')}</table></div>`
      :`<p class="note">${esc(s.name)} todavía no tiene sesiones. Cuando complete su primera lección, aparecerá aquí con la fecha, los aciertos y el XP ganado.</p>`}
    </section>
    <section class="sec"><h3>Perfil</h3><div class="del-row" id="delBox"><button class="btn ghost sm" id="bDel">Eliminar el perfil de ${esc(s.name)}</button></div></section>
    <p class="note">Los ejercicios de matemáticas se generan al azar en cada intento. Las preguntas de Lenguaje, Ciencias e Historia y Geografía vienen de un banco basado en el programa de 6° y 8° básico. Cada lección pide 8 respuestas correctas con 3 vidas; 0 errores = 3 estrellas.</p>
  </div>`;
  renderSync();
  app.querySelectorAll('.fam-card').forEach(b=>b.onclick=()=>{ panelSel=b.dataset.id; renderPanel(); });
  $('#bDel').onclick=()=>{ $('#delBox').innerHTML=`<span>Se borrará todo el progreso de ${esc(s.name)} en este dispositivo. ¿Seguro?</span><button class="btn ghost sm" id="bDelNo">Cancelar</button><button class="btn sm danger" id="bDelYes">Sí, eliminar</button>`;
    $('#bDelNo').onclick=()=>renderPanel();
    $('#bDelYes').onclick=()=>{ const id=s.id; STUDENTS=STUDENTS.filter(x=>x.id!==id); reindex(); saveProfiles(); delete ST[id]; try{ localStorage.removeItem('ruta-v2-'+id); }catch(e){}
      if (who===id){ who=null; try{ localStorage.removeItem('ruta-who'); }catch(e){} } panelSel=null; renderStats(); renderPanel(); }; };

}

render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
