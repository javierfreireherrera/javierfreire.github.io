     <p class="rule">El IVA en Chile es 19%: precio final = precio neto · 1,19.</p>
     <p class="exm">$10.000 + 19% = $11.900</p>`),
   C('Ofertas en palabras', `<ul><li>"Lleve 4 y pague 3" → regalan 1 de 4 = <b>25%</b> de descuento.</li>
     <li>"Lleve 6 y pague 5" → 1 de 6 ≈ <b>16,67%</b>.</li>
     <li>"Rebaja en un tercio" ≈ <b>33,33%</b> · "en un quinto" = <b>20%</b> · "a la mitad" = <b>50%</b>.</li></ul>`)],
  ['Una tienda tenía 500 clientes al mes y ahora tiene 450. ¿Cuál es la variación porcentual?','−10%',['−50%','10%','−45%'],'(450 − 500) : 500 · 100 = −50 : 500 · 100 = <b>−10%</b>: una disminución del 10%.']),

'8c-mat-u4': rv('Matemáticas',4,'Expresiones algebraicas','#7b4fd6',
  '¡Guau! Repasemos el lenguaje del álgebra.',
  'Guías N°6, N°7 y N°8 (Matemáticas 8°C)',
  [C('Partes de un término algebraico', `<p>En <b>−3ab</b> se distinguen:</p>
     <ul><li><b>Signo:</b> −</li><li><b>Coeficiente numérico:</b> 3</li><li><b>Factor literal:</b> ab</li><li><b>Grado:</b> suma de los exponentes = 1 + 1 = 2</li></ul>
     <p>Según la cantidad de términos: <b>monomio</b> (1), <b>binomio</b> (2), <b>trinomio</b> (3), <b>polinomio</b> (más de uno).</p>`),
   C('Valorizar', `<p>Valorizar es <b>reemplazar las letras por números</b> y calcular.</p>
     <ul class="steps"><li>Si x = −2 e y = 3, ¿cuánto vale 4x + 2y − 1?</li><li>4 · (−2) + 2 · 3 − 1</li><li class="exm">= −8 + 6 − 1 = −3</li></ul>`),
   C('Términos semejantes', `<p>Son los que tienen el <b>mismo factor literal</b> (mismas letras con los mismos exponentes). Solo esos se suman o restan.</p>
     <p class="exm">5x + 3y − 2x + y = 3x + 4y</p>
     <p class="rule">x e y no se juntan: 3x + 4y ya está reducido.</p>`),
   C('Multiplicar', `<p class="rule">Se multiplican los coeficientes y se suman los exponentes de letras iguales.</p>
     <p class="exm">3x²y · (−5xy) = −15x³y²</p>
     <p class="rule">Monomio por polinomio: propiedad distributiva.</p>
     <p class="exm">−2y · (8x − 4y) = −16xy + 8y²</p>`)],
  ['Reduce: 7a − 2b − 3a + 5b','4a + 3b',['4a − 3b','10a + 3b','7ab'],'Términos en a: 7a − 3a = 4a. Términos en b: −2b + 5b = 3b. Resultado: <b>4a + 3b</b>.']),

'8c-mat-u5': rv('Matemáticas',5,'Ecuaciones','#c43b6c',
  '¡Guau! Una ecuación es como una balanza en equilibrio. Repasemos.',
  'Guía N°9 – Ecuaciones (Matemáticas 8°C)',
  [C('¿Qué es una ecuación?', `<p>Es una <b>igualdad</b> entre dos expresiones que tiene uno o más valores desconocidos, llamados <b>incógnitas</b>.</p>
     <p class="rule">Funciona como una balanza en equilibrio: lo que hagas a un lado, hazlo también al otro.</p>`),
   C('Reglas para resolver', `<ul><li><b>Regla de la adición:</b> puedes sumar o restar el mismo número en ambos lados.</li>
     <li><b>Regla de la multiplicación:</b> puedes multiplicar o dividir ambos lados por el mismo número (distinto de 0).</li></ul>
     <ul class="steps"><li class="exm">5x + 12 = 37</li><li>Resto 12 en ambos lados: 5x = 25</li><li>Divido por 5: <b>x = 5</b></li></ul>`),
   C('x a ambos lados y paréntesis', `<ul class="steps"><li class="exm">2x + 7 = 12 − 3x</li><li>Junto las x a la izquierda: 2x + 3x = 12 − 7</li><li class="exm">5x = 5 → x = 1</li></ul>
     <p>Si hay paréntesis, primero aplica la distributiva: 2(x − 6) = 2x − 12.</p>`),
   C('Problemas', `<p>1) Llama <b>x</b> a lo que no sabes. 2) Escribe la ecuación. 3) Resuélvela. 4) Comprueba.</p>
     <p class="rule">"El doble de un número más 4" → 2x + 4 &nbsp;·&nbsp; "30 menos que su padre" → x − 30</p>
     <p class="exm">Libro + triple del libro = $10.500 → x + 3x = 10.500 → x = $2.625</p>`)],
  ['Resuelve: 8x − 19 = 45','x = 8',['x = 3,25','x = 26','x = 64'],'Suma 19 en ambos lados: 8x = 64. Divide por 8: <b>x = 8</b>.']),

'8c-mat-u6': rv('Matemáticas',6,'Inecuaciones','#1f8a4c',
  '¡Guau! Las inecuaciones se parecen a las ecuaciones, con una trampa. Repasemos.',
  'PPT – Introducción a las Inecuaciones Lineales; Actividad inecuaciones de un paso (Matemáticas 8°C)',
  [C('Símbolos', `<div class="signs"><span>&lt; menor que</span><span>&gt; mayor que</span><span>≤ menor o igual</span><span>≥ mayor o igual</span></div>
     <p>Para verificar si un valor cumple, <b>reemplázalo</b>: si x = 8, ¿x + 1 &gt; 5? → 9 &gt; 5, verdadero.</p>`),
   C('Resolver', `<p>Se despeja la x igual que en una ecuación.</p>
     <ul class="steps"><li class="exm">3x − 4 ≥ 8</li><li>Sumo 4: 3x ≥ 12</li><li>Divido por 3: <b>x ≥ 4</b></li></ul>
     <p class="rule">¡Ojo! Si multiplicas o divides por un número NEGATIVO, el símbolo se da vuelta.</p>
     <p class="exm">−3x &gt; 6 → x &lt; −2</p>`),
   C('Recta numérica e intervalos', `<table class="rv"><tr><td><b>&lt; o &gt;</b></td><td>Círculo <b>abierto</b>: el número no se incluye. Corchete hacia afuera: ]a, +∞[</td></tr>
     <tr><td><b>≤ o ≥</b></td><td>Círculo <b>cerrado</b>: el número sí se incluye. Corchete hacia el número: [a, +∞[</td></tr></table>
     <p>x &lt; 3 → ]−∞, 3[ &nbsp;·&nbsp; x ≥ 4 → [4, +∞[</p>`)],
  ['Resuelve: −x + 5 &lt; 4','x &gt; 1',['x &lt; 1','x &lt; −1','x &gt; −1'],'Resta 5: −x &lt; −1. Multiplica por −1 y <b>da vuelta el símbolo</b>: <b>x &gt; 1</b>.']),

'8c-mat-u7': rv('Matemáticas',7,'Función lineal y afín','#3a7bbf',
  '¡Guau! Repasemos las rectas y sus fórmulas.',
  'PPT – Función Lineal y Afín; Guías complementarias 00 y 01 (Matemáticas 8°C)',
  [C('Función lineal', `<p class="rule">f(x) = mx, con m ≠ 0. Su gráfico es una recta que pasa por el origen (0, 0).</p>
     <p><b>m</b> es la <b>pendiente</b> y también la constante de proporcionalidad directa.</p>
     <p>Si m &gt; 0 la recta es <b>creciente</b>; si m &lt; 0, <b>decreciente</b>. f(x) = x se llama función identidad.</p>`),
   C('Función afín', `<p class="rule">f(x) = mx + n, con n ≠ 0. Es una recta que NO pasa por el origen.</p>
     <ul><li><b>m:</b> pendiente (cuánto sube o baja por cada paso a la derecha).</li><li><b>n:</b> coeficiente de posición (donde la recta corta al eje y).</li></ul>`),
   C('Evaluar y leer gráficos', `<ul class="steps"><li>Si f(x) = 2x + 3, ¿cuánto es f(4)?</li><li class="exm">2 · 4 + 3 = 11</li></ul>
     <p>Desde un gráfico: mira dónde corta al eje y (n) y cuántas unidades sube o baja por cada unidad a la derecha (m).</p>`)],
  ['En f(x) = −4x + 7, ¿cuál es la pendiente y es creciente o decreciente?','m = −4, decreciente',['m = 7, creciente','m = −4, creciente','m = 4, decreciente'],'La pendiente es el número que acompaña a x: <b>−4</b>. Como es negativa, la función es <b>decreciente</b>. El 7 es el coeficiente de posición.']),

'8c-mat-u8': rv('Matemáticas',8,'Estadística','#a8521f',
  '¡Guau! Repasemos cómo se organizan y resumen los datos.',
  'PPT Conceptos básicos de estadística; PPT Tipos de gráficos y medidas de tendencia central; Guías N°11, N°12 y N°13 (Matemáticas 8°C)',
  [C('Población, muestra y variables', `<ul><li><b>Población:</b> todo el grupo que se quiere estudiar.</li><li><b>Muestra:</b> la parte de la población que se estudia de verdad.</li></ul>
     <table class="rv"><tr><td><b>Cualitativa nominal</b></td><td>Categorías sin orden: color de pelo, género musical.</td></tr>
       <tr><td><b>Cualitativa ordinal</b></td><td>Categorías con orden: medallas, nivel educacional.</td></tr>
       <tr><td><b>Cuantitativa discreta</b></td><td>Se cuenta: número de hermanos.</td></tr>
       <tr><td><b>Cuantitativa continua</b></td><td>Se mide y admite decimales: estatura, tiempo.</td></tr></table>`),
   C('Tablas de frecuencia', `<ul><li><b>Frecuencia absoluta (f):</b> cuántas veces se repite un dato.</li>
     <li><b>Frecuencia acumulada (F):</b> suma de las frecuencias hasta ese dato.</li>
     <li><b>Frecuencia relativa (fr):</b> f dividido por el total de datos.</li>
     <li><b>Frecuencia relativa porcentual (fr%):</b> fr · 100.</li></ul>
     <p class="rule">Si 4 de 25 futbolistas tienen 20 años: fr = 4/25 = 0,16 = 16%.</p>`),
   C('Gráficos', `<ul><li><b>Barras:</b> comparar frecuencias de categorías (simple, agrupado o apilado).</li>
     <li><b>Circular:</b> partes de un total en porcentaje.</li><li><b>Líneas:</b> cambios en el tiempo.</li>
     <li><b>Ojiva:</b> frecuencias acumuladas.</li></ul>`),
   C('Medidas de tendencia central y rango', `<ul><li><b>Media (promedio):</b> suma de los datos dividida por la cantidad de datos.</li>
     <li><b>Mediana:</b> el dato central con los datos ordenados; si son pares, el promedio de los dos centrales.</li>
     <li><b>Moda:</b> el dato que más se repite (puede no existir o haber más de una).</li>
     <li><b>Rango:</b> dato mayor − dato menor.</li></ul>
     <p class="exm">{5, 6, 10, 11, 12, 16}: mediana = (10 + 11) : 2 = 10,5 · rango = 16 − 5 = 11</p>`)],
  ['¿Cuál de estas variables es cualitativa ordinal?','Medalla obtenida (oro, plata, bronce)',['Color de pelo','Cantidad de hermanos','Estatura en cm'],'Las medallas son categorías que tienen un <b>orden</b>: oro, plata, bronce. El color de pelo no tiene orden (nominal) y las otras son cuantitativas.']),

'8c-mat-u9': rv('Matemáticas',9,'Potencias y raíz cuadrada','#2c62d8',
  '¡Guau! Repasemos potencias y raíces, que vienen del Taller de Geometría.',
  'Guía N°1 – Potencias; Guía N°2 – Raíces cuadradas (Taller de Geometría 8°C)',
  [C('¿Qué es una potencia?', `<p>Es un producto de factores iguales: <b>a<sup>n</sup> = a · a · … · a</b> (n veces).</p>
     <p class="exm">2<sup>4</sup> = 2 · 2 · 2 · 2 = 16</p>
     <p><b>a</b> es la base y <b>n</b> el exponente.</p>`),
   C('Propiedades', `<table class="rv"><tr><td>Igual base, multiplicación</td><td class="exm">a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup></td></tr>
     <tr><td>Igual base, división</td><td class="exm">a<sup>m</sup> : a<sup>n</sup> = a<sup>m−n</sup></td></tr>
     <tr><td>Igual exponente</td><td class="exm">a<sup>n</sup> · b<sup>n</sup> = (a·b)<sup>n</sup></td></tr>
     <tr><td>Potencia de potencia</td><td class="exm">(a<sup>m</sup>)<sup>n</sup> = a<sup>m·n</sup></td></tr>
     <tr><td>Exponente cero</td><td class="exm">a<sup>0</sup> = 1</td></tr></table>`),
   C('Raíz cuadrada', `<p>La raíz cuadrada de un número es el valor que, multiplicado por sí mismo, da ese número.</p>
     <p class="exm">√49 = 7, porque 7 · 7 = 49</p>
     <p class="rule">Si un cuadrado tiene área A, su lado mide √A: un cuadrado de 64 cm² tiene lados de 8 cm.</p>
     <p>√50 no es exacta: está entre 7 y 8, porque 49 &lt; 50 &lt; 64.</p>`)],
  ['¿Cuánto es 5<sup>3</sup> : 5<sup>1</sup>?','25',['5','125','15'],'Igual base en una división: se restan los exponentes. 5<sup>3−1</sup> = 5<sup>2</sup> = <b>25</b>.']),

'8c-mat-u10': rv('Matemáticas',10,'Teorema de Pitágoras','#0f8f8a',
  '¡Guau! Repasemos el teorema más famoso de los triángulos rectángulos.',
  'PPT – Teorema de Pitágoras (Taller de Geometría 8°C)',
  [C('El teorema', `<p>En todo triángulo <b>rectángulo</b> (con un ángulo de 90°):</p>
     <p class="rule">a² + b² = c²: la suma de los catetos al cuadrado es igual a la hipotenusa al cuadrado.</p>
     <p>La <b>hipotenusa</b> (c) es el lado más largo, opuesto al ángulo recto. Los <b>catetos</b> (a y b) forman el ángulo recto.</p>`),
   C('Calcular la hipotenusa', `<ul class="steps"><li>Catetos 6 cm y 8 cm.</li><li>c² = 6² + 8² = 36 + 64 = 100</li><li class="exm">c = √100 = 10 cm</li></ul>`),
   C('Calcular un cateto', `<ul class="steps"><li>Hipotenusa 13 cm y un cateto 5 cm.</li><li>b² = 13² − 5² = 169 − 25 = 144</li><li class="exm">b = √144 = 12 cm</li></ul>
     <p class="rule">Para un cateto se RESTA; para la hipotenusa se SUMA.</p>`)],
  ['Un triángulo rectángulo tiene catetos de 9 cm y 12 cm. ¿Cuánto mide la hipotenusa?','15 cm',['21 cm','225 cm','10,5 cm'],'c² = 9² + 12² = 81 + 144 = 225, entonces c = √225 = <b>15 cm</b>.']),

'8c-mat-u11': rv('Matemáticas',11,'Área y volumen de prismas y cilindros','#d9771a',
  '¡Guau! Repasemos cuánto papel envuelve una caja y cuánta agua cabe en un tarro.',
  'Guía N°4 – Área de Prismas; Guía N°5 – Área de Cilindro; Guía N°6 – Volumen de Prismas y Cilindro (Taller de Geometría 8°C)',
  [C('Área de un prisma', `<p>El área total de un prisma es el área de su <b>red</b>: las dos bases más todas las caras laterales.</p>
     <p class="rule">Caja (paralelepípedo) de largo l, ancho a y alto h: A = 2(l·a + l·h + a·h)</p>
     <p class="exm">Caja de 10 × 8 × 4 cm: 2(80 + 40 + 32) = 304 cm²</p>
     <p>Cubo de arista a: A = 6a².</p>`),
   C('Área del cilindro', `<p>Su red tiene dos círculos (bases) y un rectángulo (manto).</p>
     <ul><li>Área basal: π · r²</li><li>Área lateral (manto): 2 · π · r · h</li><li>Área total: 2πr² + 2πrh</li></ul>
     <p class="rule">En las guías se usa π ≈ 3,14.</p>`),
   C('Volumen', `<p class="rule">V = Área de la base · altura (sirve para prismas y cilindros).</p>
     <p class="exm">Prisma de base rectangular 5 × 4 cm y altura 10 cm: V = 20 · 10 = 200 cm³</p>
     <p class="exm">Cilindro de radio 2 cm y altura 10 cm: V = 3,14 · 2² · 10 = 125,6 cm³</p>`)],
  ['¿Cuál es el volumen de un cilindro de radio 3 cm y altura 5 cm? (π ≈ 3,14)','141,3 cm³',['47,1 cm³','94,2 cm³','282,6 cm³'],'V = π · r² · h = 3,14 · 9 · 5 = <b>141,3 cm³</b>.']),

'8c-mat-u12': rv('Matemáticas',12,'Traslación','#7b4fd6',
  '¡Guau! Esta unidad viene de la guía nueva de traslaciones. Repasemos.',
  'PPT – Transformaciones isométricas: Traslación (Taller de Geometría 8°C)',
  [C('Transformaciones isométricas', `<p><b>Isometría</b> significa "igual medida".</p>
     <p class="rule">La figura NO cambia su forma ni su tamaño (queda congruente); solo cambia su posición.</p>`),
   C('¿Qué es una traslación?', `<p>Es <b>deslizar</b> una figura en línea recta. Todos sus puntos se mueven igual, en líneas paralelas.</p>
     <p>Tiene tres elementos: <b>sentido</b> (derecha, izquierda, arriba, abajo), <b>dirección</b> (horizontal, vertical u oblicua) y <b>magnitud</b> (cuánto se desplaza).</p>`),
   C('Vector de traslación T(a, b)', `<p class="rule">El punto P(x, y) se traslada a P'(x + a, y + b).</p>
     <ul><li><b>a</b> positivo → derecha; negativo → izquierda.</li><li><b>b</b> positivo → arriba; negativo → abajo.</li></ul>
     <ul class="steps"><li>P(2, 1) con T(3, −5)</li><li class="exm">P'(2 + 3, 1 + (−5)) = P'(5, −4)</li></ul>
     <p>Para encontrar el vector: T = (x' − x, y' − y).</p>`)],
  ['El punto (2, 5) se trasladó al punto (−9, 2). ¿Cuál fue el vector de traslación?','T(−11, −3)',['T(−7, 7)','T(11, 3)','T(−11, 3)'],'T = (x\' − x, y\' − y) = (−9 − 2, 2 − 5) = <b>(−11, −3)</b>: 11 a la izquierda y 3 hacia abajo.']),

/* ---------- 8° Lenguaje ---------- */
'8c-len-u2': rv('Lenguaje',2,'Lenguaje poético','#7b4fd6',
  '¡Guau! Repasemos el mundo de la poesía.',
  'Clase 1 Interpretar lenguaje figurado; Clase 3 Lenguaje poético; Clase 4 Mundo lírico; Clase 5 Figuras literarias (Lengua y Literatura 8°C)',
  [C('Denotación y connotación', `<ul><li><b>Denotativo:</b> sentido literal. "La víbora se arrastra por el piso."</li>
     <li><b>Connotativo:</b> sentido figurado. "Esa persona es una víbora" (falsa, poco confiable).</li></ul>
     <p class="rule">El contexto decide si una palabra se usa en sentido denotativo o connotativo.</p>`),
   C('El mundo lírico', `<table class="rv"><tr><td><b>Hablante lírico</b></td><td>La voz ficticia que habla en el poema (no es el autor).</td></tr>
     <tr><td><b>Objeto lírico</b></td><td>El ser, objeto o situación real que provoca los sentimientos.</td></tr>
     <tr><td><b>Motivo lírico</b></td><td>La idea central, casi siempre un sustantivo abstracto: amor, soledad, nostalgia.</td></tr>
     <tr><td><b>Temple de ánimo</b></td><td>El sentimiento o estado de ánimo que expresa el hablante.</td></tr></table>`),
   C('Actitudes líricas', `<ul><li><b>Enunciativa:</b> el hablante se centra en lo externo (hechos, paisaje, personas).</li>
     <li><b>Apostrófica:</b> el hablante le habla directamente a un "tú".</li>
     <li><b>Carmínica o de la canción:</b> expresa su mundo interior, en primera persona.</li></ul>`),
   C('Figuras literarias', `<ul><li><b>Comparación:</b> usa "como", "igual que": "duro como el acero".</li>
     <li><b>Metáfora:</b> comparación sin nexo: "el oro que cae en tus hombros" (tu cabello).</li>
     <li><b>Antítesis:</b> ideas opuestas: "Es tan corto el amor y tan largo el olvido".</li>
     <li><b>Anáfora:</b> repetir palabras al inicio de versos.</li>
     <li><b>Personificación</b>, <b>hipérbole</b> (exageración), <b>aliteración</b> (repetir sonidos) y <b>sinestesia</b> (mezclar sentidos: "dulce mirada").</li></ul>`)],
  ['"Es tan corto el amor y tan largo el olvido" contiene principalmente una:','Antítesis',['Anáfora','Comparación','Onomatopeya'],'Contrapone ideas opuestas: <b>corto / largo</b> y <b>amor / olvido</b>. Eso es una antítesis.']),

'8c-len-u3': rv('Lenguaje',3,'Epopeya y drama','#0f8f8a',
  '¡Guau! Repasemos a los héroes y el teatro.',
  'Clase 5 La epopeya; Beowulf y Helena de Troya; Orígenes del drama; Estructura interna y externa; Guía de actividades texto dramático (Lengua y Literatura 8°C)',
  [C('La epopeya', `<p>Narración en verso o prosa que cuenta las <b>hazañas de un héroe</b>, que representa los ideales de su pueblo. Al principio se transmitía de forma <b>oral</b>.</p>
     <ul><li><b>Temas:</b> guerras y viajes. La Ilíada (guerra de Troya) y la Odisea (regreso de Ulises).</li>
     <li><b>Epítetos:</b> frases fijas que destacan al héroe: "el de los pies ligeros".</li>
     <li><b>Dioses</b> que ayudan o castigan, como Atenea y Poseidón.</li></ul>
     <p>La epopeya escrita más antigua es la de <b>Gilgamesh</b> (sumeria).</p>`),
   C('El género dramático', `<p>Obras creadas para ser <b>representadas</b> ante un público. Presentan un <b>conflicto humano</b> mediante el <b>diálogo</b>, sin narrador.</p>
     <p>Nació en la <b>antigua Grecia</b>, en fiestas en honor al dios <b>Dionisio</b>. "Theatron" significa "lugar para contemplar".</p>
     <p class="rule">Las acotaciones (entre paréntesis) indican gestos, movimientos y lugares.</p>`),
   C('Estructura del drama', `<ul><li><b>Interna:</b> inicio (presentación), desarrollo del conflicto, clímax y desenlace. El conflicto enfrenta al protagonista con el antagonista.</li>
     <li><b>Externa:</b> <b>acto</b> (gran división), <b>escena</b> (cambia cuando entran o salen personajes) y <b>cuadro</b> (cambio de escenografía).</li></ul>`),
   C('Tragedia y comedia', `<ul><li><b>Tragedia:</b> conflictos graves y un final de sufrimiento o destrucción del protagonista.</li>
     <li><b>Comedia:</b> hace reír, pero también <b>critica a la sociedad</b> mostrando vicios y malos hábitos con personajes tipo. Ej.: "El estornudo".</li></ul>`)],
  ['En un texto dramático, ¿qué marca el cambio de escena?','La entrada o salida de personajes',['La caída del telón al final de la obra','El cambio de narrador','El final de cada estrofa'],'La <b>escena</b> cambia cuando entran o salen personajes. El acto se marca con el telón y el cuadro con un cambio de escenografía.']),

'8c-len-u4': rv('Lenguaje',4,'Taller de Lenguaje','#d9771a',
  '¡Guau! Repasemos cómo funcionan las palabras.',
  'Clase 1 ¿Quién inventó las palabras?; Clase 2 Signo lingüístico; Clases 3 y 4 Las palabras y sus fenómenos; Clase 7 Vocabulario (Taller de Lenguaje 8°C)',
  [C('El signo lingüístico (Saussure)', `<ul><li><b>Significante:</b> la imagen acústica, los sonidos o letras de la palabra.</li>
     <li><b>Significado:</b> la imagen mental o concepto.</li></ul>
     <p class="rule">Son dos caras inseparables, como una moneda que no se puede partir.</p>`),
   C('El signo es arbitrario', `<p>No hay una relación natural entre la palabra y lo que nombra: nada en un perro obliga a llamarlo "perro". Es una <b>convención</b>, un acuerdo entre hablantes.</p>
     <p>Por eso "perro", "dog" y "chien" nombran lo mismo.</p>`),
   C('Fenómenos de las palabras', `<table class="rv"><tr><td><b>Polisemia</b></td><td>Una palabra con varios significados (banco).</td></tr>
     <tr><td><b>Sinonimia</b></td><td>Significado igual o parecido (alegre / contento).</td></tr>
     <tr><td><b>Antonimia</b></td><td>Significado opuesto (claro / oscuro).</td></tr>
     <tr><td><b>Hiperonimia</b></td><td>Palabra general que incluye a otras (fruta).</td></tr>
     <tr><td><b>Hiponimia</b></td><td>Palabra incluida en otra más general (manzana).</td></tr>
     <tr><td><b>Denotación / connotación</b></td><td>Sentido literal / sentido figurado.</td></tr></table>`)],
  ['"Fruta" respecto de "manzana", "pera" y "plátano" es un:','Hiperónimo',['Hipónimo','Sinónimo','Antónimo'],'"Fruta" es la palabra general que incluye a las otras: es un <b>hiperónimo</b>. Manzana, pera y plátano son sus hipónimos.']),

/* ---------- 8° Ciencias ---------- */
'8c-cie-u1': rv('Ciencias',1,'Método científico y célula','#1f8a4c',
  '¡Guau! Repasemos cómo investigan los científicos y de qué estamos hechos.',
  'Guía Método científico 2026; Guía Célula estructura y función 2026 (Ciencias Naturales 8°C)',
  [C('Etapas del método científico', `<p><b>Observación → problema → hipótesis → diseño experimental → análisis de datos → conclusión.</b></p>
     <p class="rule">Hipótesis: "Si… (causa), entonces… (efecto)". Debe poder ponerse a prueba.</p>`),
   C('Variables y grupo control', `<ul><li><b>Variable independiente:</b> la que el investigador manipula (causa). Ej.: cantidad de compost.</li>
     <li><b>Variable dependiente:</b> la que responde (efecto). Ej.: crecimiento de la lechuga.</li>
     <li><b>Variables controladas:</b> las que se mantienen iguales (luz, riego, macetero).</li>
     <li><b>Grupo control:</b> sin el cambio, para comparar con el grupo experimental.</li></ul>`),
   C('La célula', `<p>Todos los seres vivos están formados por células.</p>
     <ul><li><b>Procarionte:</b> sin núcleo definido (bacterias).</li><li><b>Eucarionte:</b> con núcleo verdadero que contiene el ADN.</li></ul>
     <p><b>Vegetal vs. animal:</b> la vegetal tiene <b>pared celular</b>, <b>cloroplastos</b> y una vacuola grande; la animal tiene centriolos y no tiene pared.</p>`),
   C('Organelos y su función', `<table class="rv"><tr><td><b>Núcleo</b></td><td>Controla las actividades de la célula; contiene el ADN.</td></tr>
     <tr><td><b>Mitocondria</b></td><td>Produce energía (ATP).</td></tr><tr><td><b>Ribosomas</b></td><td>Fabrican proteínas.</td></tr>
     <tr><td><b>Retículo E. rugoso / liso</b></td><td>Proteínas / lípidos.</td></tr>
     <tr><td><b>Aparato de Golgi</b></td><td>Modifica, empaqueta y distribuye proteínas.</td></tr>
     <tr><td><b>Lisosomas</b></td><td>Digestión celular.</td></tr><tr><td><b>Cloroplasto</b></td><td>Fotosíntesis (solo vegetales).</td></tr>
     <tr><td><b>Membrana plasmática</b></td><td>Delimita la célula y controla lo que entra y sale.</td></tr></table>`)],
  ['En un experimento se cambia la cantidad de compost para ver cómo crecen las lechugas. ¿Cuál es la variable independiente?','La cantidad de compost',['El crecimiento de las lechugas','El tipo de macetero','La luz que reciben'],'La variable independiente es la que el investigador <b>manipula</b>: la cantidad de compost. El crecimiento es la dependiente; la luz y el macetero son controladas.']),

'8c-cie-u2': rv('Ciencias',2,'Membrana y tejidos','#3a7bbf',
  '¡Guau! Repasemos cómo entran y salen las sustancias de la célula.',
  'PPT Membrana celular: transporte pasivo y activo; Guía Mecanismos de transporte; Guía Tejidos animales (Ciencias Naturales 8°C)',
  [C('La membrana plasmática', `<p>Es una <b>bicapa de lípidos con proteínas</b> (modelo de mosaico fluido). Es <b>semipermeable</b>: deja pasar algunas sustancias y otras no.</p>`),
   C('Transporte pasivo (sin gastar energía)', `<ul><li><b>Difusión:</b> partículas de mayor a menor concentración.</li>
     <li><b>Difusión facilitada:</b> con ayuda de proteínas de membrana.</li>
     <li><b>Osmosis:</b> paso de agua a través de la membrana, hacia donde hay más solutos.</li></ul>
     <p class="rule">En agua muy salada la célula pierde agua y se arruga; en agua destilada gana agua y puede reventar.</p>`),
   C('Transporte activo (gasta ATP)', `<ul><li>Mueve sustancias <b>en contra</b> del gradiente (de menor a mayor concentración).</li>
     <li><b>Endocitosis:</b> entrada de partículas grandes. <b>Exocitosis:</b> salida en vesículas.</li></ul>`),
   C('Tejidos', `<p><b>Célula → tejido → órgano → sistema → organismo.</b></p>
     <ul><li><b>Epitelial:</b> cubre y reviste (piel).</li><li><b>Conectivo:</b> une y sostiene (hueso, cartílago, sangre, grasa).</li>
     <li><b>Muscular:</b> esquelético (voluntario), cardíaco y liso (involuntarios).</li><li><b>Nervioso:</b> neuronas que transmiten impulsos.</li></ul>`)],
  ['¿Por qué se marchita una lechuga si le echas mucha sal?','Pierde agua por osmosis',['Gana agua por osmosis','Gasta ATP por transporte activo','Hace fotosíntesis más rápido'],'La sal hace que afuera haya más solutos: el agua sale de las células por <b>osmosis</b> y la lechuga se marchita.']),

'8c-cie-u3': rv('Ciencias',3,'Nutrición y sistemas','#d9771a',
  '¡Guau! Repasemos qué pasa con lo que comemos y respiramos.',
  'PPT Alimentación y nutrientes; PPT Nutrición; Retroalimentación Sistema digestivo y enzimas; PPT Sistema respiratorio (Ciencias Naturales 8°C)',
  [C('Nutrientes y sus funciones', `<ul><li><b>Energéticos:</b> carbohidratos y lípidos. Los lípidos aportan más energía (9 kcal por gramo).</li>
     <li><b>Estructurales o constructores:</b> proteínas.</li><li><b>Reguladores:</b> vitaminas, sales minerales y agua.</li></ul>
     <p class="rule">Alimentarse es elegir y comer; nutrirse es el proceso del cuerpo para aprovechar los nutrientes.</p>`),
   C('Sistema digestivo', `<p>Etapas: <b>ingestión → digestión → absorción → egestión</b>.</p>
     <table class="rv"><tr><td><b>Boca</b></td><td>Saliva con <b>amilasa</b> (almidón). Se forma el <b>bolo</b>.</td></tr>
       <tr><td><b>Estómago</b></td><td>pH ácido; <b>pepsina</b> digiere proteínas. Se forma el <b>quimo</b>.</td></tr>
       <tr><td><b>Intestino delgado</b></td><td>Tripsina, lipasa pancreática; se absorben los nutrientes. Se forma el <b>quilo</b>.</td></tr>
       <tr><td><b>Hígado</b></td><td>Produce <b>bilis</b>, que emulsiona las grasas.</td></tr>
       <tr><td><b>Intestino grueso</b></td><td>Absorbe agua; sus bacterias producen vitamina K.</td></tr></table>`),
   C('Sistema respiratorio', `<p>Recorrido del aire: <b>nariz → faringe → laringe → tráquea → bronquios → bronquiolos → alvéolos</b>.</p>
     <p class="rule">Hematosis: en los alvéolos el O₂ pasa a la sangre y el CO₂ sale de ella, por difusión.</p>
     <p><b>Inspiración:</b> el diafragma se contrae y baja. <b>Espiración:</b> se relaja y sube.</p>`)],
  ['¿Qué enzima comienza la digestión de las proteínas en el estómago?','Pepsina',['Amilasa salival','Lipasa pancreática','Bilis'],'La <b>pepsina</b> actúa en el medio ácido del estómago y transforma las proteínas en péptidos.']),

'8c-cie-u4': rv('Ciencias',4,'Electricidad (Física)','#c43b6c',
  '¡Guau! Repasemos corriente, voltaje y resistencia.',
  'Electricidad II Ley de Ohm; Guías N°1, 2 y 3 de Ley de Ohm; Electricidad III Potencia eléctrica; Guía de circuitos y energía eléctrica (Taller de Física 8°C)',
  [C('Conceptos básicos', `<table class="rv"><tr><td><b>Intensidad (i)</b></td><td>Carga que circula por unidad de tiempo. Se mide en <b>ampere (A)</b>.</td></tr>
     <tr><td><b>Voltaje (V)</b></td><td>Energía para mover cada carga. Se mide en <b>volt (V)</b>.</td></tr>
     <tr><td><b>Resistencia (R)</b></td><td>Oposición al paso de la corriente. Se mide en <b>ohm (Ω)</b>.</td></tr></table>
     <p><b>Corriente continua:</b> siempre en un sentido (pilas). <b>Alterna:</b> va y vuelve (generadores, enchufes).</p>`),
   C('Ley de Ohm', `<p class="rule">V = i · R</p>
     <ul class="steps"><li>V = 12 V y R = 4 Ω</li><li class="exm">i = V : R = 12 : 4 = 3 A</li></ul>
     <p>Un cable conduce mejor si es más corto, más grueso y de un material de baja resistividad (como el cobre).</p>`),
   C('Circuitos', `<ul><li><b>Serie:</b> un solo camino. Si se quema una ampolleta, se apagan todas.</li>
     <li><b>Paralelo:</b> varios caminos. Si se quema una, las otras siguen. Así son las instalaciones de las casas.</li></ul>`),
   C('Potencia y energía', `<p class="rule">P = V · i, en watts (W). La energía consumida se cobra en kilowatt-hora (kWh).</p>
     <p class="exm">Hervidor de 220 V y 10 A → P = 2.200 W</p>
     <p><b>Efecto Joule:</b> un conductor se calienta cuando circula corriente (estufas, hervidores).</p>`)],
  ['Si por una resistencia de 10 Ω circulan 2 A, ¿cuál es el voltaje?','20 V',['5 V','12 V','0,2 V'],'Ley de Ohm: V = i · R = 2 · 10 = <b>20 V</b>.']),

'8c-cie-u5': rv('Ciencias',5,'El átomo (Química)','#7b4fd6',
  '¡Guau! Repasemos cómo fuimos descubriendo el átomo.',
  'Guía Constitución atómica de la materia 2026; Trabajo Modelos atómicos; Guía Números cuánticos (Taller de Química 8°C)',
  [C('Partículas del átomo', `<table class="rv"><tr><td><b>Protón</b></td><td>Carga positiva, en el núcleo.</td></tr>
     <tr><td><b>Neutrón</b></td><td>Sin carga, en el núcleo. Masa parecida a la del protón.</td></tr>
     <tr><td><b>Electrón</b></td><td>Carga negativa, alrededor del núcleo. Masa muy pequeña.</td></tr></table>`),
   C('Z, A e iones', `<ul><li><b>Número atómico (Z):</b> cantidad de protones; identifica al elemento.</li>
     <li><b>Número másico (A):</b> protones + neutrones. Neutrones = A − Z.</li>
     <li><b>Catión:</b> perdió electrones (+). <b>Anión:</b> ganó electrones (−).</li></ul>
     <p class="exm">Z = 6, A = 14 → 14 − 6 = 8 neutrones</p>`),
   C('Isótopos, isóbaros e isótonos', `<ul><li><b>Isótopos:</b> mismo elemento (igual Z) con distinto número de neutrones. Ej.: protio, deuterio y tritio (hidrógeno).</li>
     <li><b>Isóbaros:</b> elementos distintos con igual A.</li><li><b>Isótonos:</b> elementos distintos con igual número de neutrones.</li></ul>`),
   C('Modelos atómicos', `<ul><li><b>Dalton (1808):</b> esfera indivisible.</li><li><b>Thomson:</b> descubre el electrón; modelo del "budín de pasas".</li>
     <li><b>Rutherford:</b> lámina de oro; núcleo pequeño, denso y positivo; casi todo el átomo es vacío.</li>
     <li><b>Bohr:</b> electrones en niveles de energía. <b>Chadwick (1932):</b> descubre el neutrón.</li></ul>
     <p class="rule">Los modelos cambian cuando nuevas evidencias muestran sus límites.</p>`)],
  ['Dos átomos del mismo elemento con distinto número de neutrones son:','Isótopos',['Isóbaros','Isótonos','Iones'],'Mismo elemento significa igual Z (mismos protones). Si cambian los neutrones, son <b>isótopos</b>.']),

/* ---------- 8° Historia ---------- */
'8c-his-u1': rv('Historia y Geografía',1,'Humanismo y Renacimiento','#2c62d8',
  '¡Guau! Repasemos el paso de la Edad Media a la Edad Moderna.',
  'Guías N°1, N°2 y N°3 Unidad 1; Comprensión lectora Renacimiento; Obras de arte del Renacimiento (Historia 8°C)',
  [C('Humanismo', `<p>Movimiento intelectual nacido en la <b>Italia del siglo XV</b> (Florencia, Roma, Venecia).</p>
     <p class="rule">Se pasa del teocentrismo (Dios al centro) al antropocentrismo (el ser humano y su razón al centro).</p>
     <p>Se vuelve a estudiar a los autores <b>grecorromanos</b>. Humanistas: Erasmo de Róterdam, Maquiavelo ("El Príncipe"), Montaigne (el ensayo) y Christine de Pizan.</p>`),
   C('Renacimiento', `<ul><li>Retoma los modelos de la Antigüedad clásica, con mayor interés por la figura humana y la <b>perspectiva</b>.</li>
     <li>Aparecen los <b>mecenas</b>, que financian a los artistas.</li>
     <li><b>Leonardo da Vinci:</b> Mona Lisa, La Última Cena, bocetos de inventos y estudios de anatomía.</li></ul>`),
   C('Reforma, imprenta y ciencia', `<ul><li><b>Reforma protestante (1517):</b> Lutero publica sus 95 tesis contra la venta de indulgencias. La Iglesia responde con el <b>Concilio de Trento</b>.</li>
     <li><b>Imprenta de Gutenberg (c. 1440):</b> tipos móviles; los libros se multiplican y se abaratan.</li>
     <li><b>Revolución Científica:</b> Copérnico (heliocentrismo), Galileo y Newton (gravedad).</li></ul>`),
   C('Estado moderno y mercantilismo', `<ul><li>Poder <b>centralizado</b> en el rey, con <b>burocracia</b>, <b>sistema fiscal</b> (impuestos) y <b>ejércitos profesionales</b>.</li>
     <li><b>Absolutismo:</b> el rey concentra todo el poder, justificado por el derecho divino.</li>
     <li><b>Mercantilismo:</b> el Estado interviene para acumular metales preciosos, exportar más que importar y monopolizar rutas comerciales.</li></ul>`)],
  ['¿Qué significa antropocentrismo?','Que el ser humano y su razón están en el centro',['Que Dios es el centro de todo','Que la Tierra es el centro del universo','Que el rey concentra todo el poder'],'El Humanismo pasó del <b>teocentrismo</b> medieval al <b>antropocentrismo</b>: el ser humano y su razón al centro.']),

'8c-his-u2': rv('Historia y Geografía',2,'Conquista y Colonia','#c43b6c',
  '¡Guau! Repasemos la llegada de los europeos y la vida en la frontera.',
  'Forjamiento del mundo moderno y América; Amanecer del mundo moderno; Guías 1, 2 y 3 Unidad 2; La frontera viva; Actividades económicas (Historia 8°C)',
  [C('Expansión europea', `<ul><li>Los europeos buscaron nuevas rutas a Oriente porque los otomanos controlaban las antiguas (Constantinopla, 1453).</li>
     <li>Avances técnicos: <b>brújula, astrolabio y carabela</b>.</li>
     <li><b>1492:</b> Colón llega a América. <b>Tratado de Tordesillas (1494):</b> divide las tierras entre España y Portugal.</li></ul>`),
   C('Conquista', `<ul><li>Cortés conquista a los aztecas y Pizarro a los incas.</li>
     <li>A Chile llega primero <b>Almagro (1536)</b>; <b>Pedro de Valdivia</b> funda Santiago en 1541.</li>
     <li>La población indígena disminuye por enfermedades, guerras y trabajo forzado (<b>encomienda</b>).</li></ul>`),
   C('Sociedad de frontera en el Biobío', `<p>Tras la batalla de <b>Curalaba (1598)</b>, se destruyen las ciudades al sur del Biobío y el río se convierte en <b>frontera</b>.</p>
     <table class="rv"><tr><td><b>Guerra de Arauco</b></td><td>Conflicto largo entre españoles y mapuche por el territorio al sur del Biobío.</td></tr>
       <tr><td><b>Parlamentos</b></td><td>Encuentros diplomáticos para negociar paz e intercambios.</td></tr>
       <tr><td><b>Malones</b></td><td>Incursiones mapuche contra estancias españolas.</td></tr>
       <tr><td><b>Malocas</b></td><td>Incursiones españolas para capturar personas y esclavizarlas.</td></tr>
       <tr><td><b>Real Situado</b></td><td>Dinero enviado desde Perú para pagar un ejército permanente.</td></tr></table>
     <p class="rule">"Frontera viva": además de guerra, hubo comercio, mestizaje y misiones.</p>`),
   C('Economía y sociedad colonial', `<ul><li>Base económica: <b>hacienda</b>, agricultura y ganadería; trabajadores como <b>inquilinos</b>.</li>
     <li>En la cima social, los españoles peninsulares; luego criollos, mestizos, indígenas y africanos esclavizados.</li></ul>`)],
  ['¿Qué eran los parlamentos en la frontera del Biobío?','Encuentros para negociar acuerdos entre españoles y mapuche',['Incursiones mapuche contra estancias','Dinero enviado desde Perú','El Congreso Nacional de Chile'],'Los <b>parlamentos</b> eran encuentros diplomáticos y festivos entre autoridades españolas y líderes mapuche para acordar la paz y el intercambio.']),

'8c-his-u3': rv('Historia y Geografía',3,'La Ilustración','#7b4fd6',
  '¡Guau! Repasemos el Siglo de las Luces.',
  'Ficha informativa: Principios políticos de la Ilustración; Manual del redactor ilustrado; El Siglo de las Luces (Historia 8°C)',
  [C('¿Qué fue la Ilustración?', `<p>Movimiento cultural e intelectual europeo del <b>siglo XVIII</b> que defendía la <b>razón</b> como herramienta para conocer el mundo.</p>
     <p class="rule">Se le llamó "Siglo de las Luces" porque la razón venía a iluminar un pasado de superstición y obediencia ciega.</p>
     <p><b>Secularización:</b> disminuye la influencia de la religión en la sociedad, promoviendo la libertad de pensamiento y la tolerancia.</p>`),
   C('Principios políticos', `<ul><li><b>Ordenamiento constitucional:</b> una constitución que limite el poder y garantice derechos.</li>
     <li><b>Separación de poderes:</b> Ejecutivo, Legislativo y Judicial (Montesquieu).</li>
     <li><b>Libertad e igualdad</b> ante la ley, sin privilegios de nacimiento.</li>
     <li><b>Soberanía popular:</b> el poder reside en el pueblo (Rousseau).</li></ul>`),
   C('Pensadores y revoluciones', `<ul><li><b>Locke:</b> derechos naturales (vida, libertad y propiedad). <b>Voltaire:</b> tolerancia y libertad de expresión.</li>
     <li><b>La Enciclopedia</b> (Diderot y D'Alembert) reunió el saber de la época.</li>
     <li>Ideas aplicadas en la independencia de <b>EE. UU. (1776)</b> y la <b>Revolución Francesa (1789)</b>, y más tarde en las independencias americanas.</li></ul>`)],
  ['¿Qué principio ilustrado dice que el poder político reside en los ciudadanos?','Soberanía popular',['Derecho divino','Absolutismo','Mercantilismo'],'La <b>soberanía popular</b> plantea que el poder se origina en el pueblo, y no en el rey como en el absolutismo.']),

'8c-his-u4': rv('Historia y Geografía',4,'Taller de Geografía','#0f8f8a',
  '¡Guau! Repasemos regiones, desarrollo y el Chile productivo.',
  'Concepto de región y tipos de regiones; Guía Desarrollo Humano; Chile en tres capas; Chile’s Productive Geography; Guía Misión Biobío (Taller de Geografía)',
  TALLER_GEO, TALLER_GEO_CHECK),

/* ---------- 6° Matemáticas ---------- */
'6c-mat-u1': rv('Matemáticas',1,'Números naturales','#2c62d8',
  '¡Guau! Repasemos múltiplos, divisores y primos.',
  'Guía 1 Numeración 6° 2026 (Matemáticas 6°C)',
  [C('Múltiplos y divisores', `<p>Los <b>múltiplos</b> de un número se obtienen multiplicándolo por 1, 2, 3, 4…: múltiplos de 6 → 6, 12, 18, 24…</p>
     <p>Un número es <b>divisor</b> de otro si al dividir el resto es cero: 4 es divisor de 32 porque 32 : 4 = 8.</p>
     <p class="rule">Los factores de un número también son sus divisores.</p>`),
   C('Primos y compuestos', `<ul><li><b>Primo:</b> tiene solo dos divisores, el 1 y él mismo (2, 3, 5, 7, 11, 13…).</li>
     <li><b>Compuesto:</b> tiene más de dos divisores (4, 6, 8, 9…).</li></ul>
     <p>Todo número compuesto se puede escribir como producto de primos: 60 = 2 · 2 · 3 · 5.</p>`),
   C('Mínimo común múltiplo (mcm)', `<p>Es el <b>menor</b> de los múltiplos comunes, distinto de cero.</p>
     <ul class="steps"><li>Claudia va a cerámica cada 2 días y Álvaro a guitarra cada 3 días.</li><li>Múltiplos de 2: 2, 4, <b>6</b>, 8… · Múltiplos de 3: 3, <b>6</b>, 9…</li><li class="exm">mcm(2, 3) = 6 → se vuelven a ver en 6 días</li></ul>`),
   C('Operaciones combinadas', `<p>1° Paréntesis · 2° Multiplicación y división, de izquierda a derecha · 3° Adición y sustracción, de izquierda a derecha.</p>
     <p class="exm">5 + 3 · 4 = 5 + 12 = 17</p>`)],
  ['Juan visita a su abuela cada 3 días y Margarita cada 5 días. Si hoy coinciden, ¿en cuántos días volverán a coincidir?','15 días',['8 días','2 días','5 días'],'Buscamos el mcm de 3 y 5: múltiplos de 3 → 3, 6, 9, 12, <b>15</b>; de 5 → 5, 10, <b>15</b>. El mcm es <b>15</b>.']),

'6c-mat-u2': rv('Matemáticas',2,'Fracciones','#0f8f8a',
  '¡Guau! Repasemos las fracciones antes de practicar.',
  'Guía 2 Fracciones 6° 2026 (Matemáticas 6°C)',
  [C('Tipos de fracciones', `<ul><li><b>Propia:</b> numerador menor que el denominador (3/5).</li><li><b>Impropia:</b> numerador mayor (7/4).</li><li><b>Igual a la unidad:</b> numerador igual al denominador (5/5 = 1).</li></ul>`),
   C('Amplificar y simplificar', `<p class="rule">Se multiplica o divide numerador y denominador por el mismo número: la fracción queda equivalente.</p>
     <p class="exm">2/3 = 4/6 = 8/12 &nbsp;·&nbsp; 10/15 = 2/3</p>`),
   C('Números mixtos', `<p>Un número mixto tiene una parte entera y una fracción: 2 ¾.</p>
     <ul class="steps"><li>Mixto a impropia: 2 ¾ → 2 · 4 + 3 = 11 → <b>11/4</b></li><li>Impropia a mixto: 11/4 → 11 : 4 = 2, resto 3 → <b>2 ¾</b></li></ul>`),
   C('Sumar y restar', `<p class="rule">Igual denominador: se suman los numeradores. Distinto denominador: se igualan con el mcm.</p>
     <p class="exm">1/2 + 1/3 = 3/6 + 2/6 = 5/6</p>`)],
  ['¿Cuánto es 3/4 + 1/8?','7/8',['4/12','4/8','1/2'],'El mcm de 4 y 8 es 8: 3/4 = 6/8. Luego 6/8 + 1/8 = <b>7/8</b>.']),

'6c-mat-u3': rv('Matemáticas',3,'Números decimales','#7b4fd6',
  '¡Guau! Repasemos los números con coma.',
  'Guía 3 Decimales 6° 2026 (Matemáticas 6°C)',
  [C('Sumar y restar', `<p class="rule">Ubica las comas una debajo de la otra y completa con ceros si hace falta.</p>
     <p class="exm">6 − 4,30 = 1,70 m (el cable que le sobró a José)</p>`),
   C('Multiplicar y dividir por 10, 100 y 1.000', `<ul><li>Multiplicar: la coma se corre a la <b>derecha</b> tantos lugares como ceros. 2,35 · 100 = 235.</li>
     <li>Dividir: la coma se corre a la <b>izquierda</b>. 45,6 : 10 = 4,56.</li></ul>`),
   C('Multiplicar y dividir decimales', `<p class="exm">1,25 · 3 = 3,75</p>
     <p>Al dividir un decimal por un natural, divide normalmente y mantén la coma en su lugar: 7,5 : 3 = 2,5.</p>`),
   C('Decimales y fracciones', `<p>0,5 = 1/2 · 0,25 = 1/4 · 0,75 = 3/4 · 0,2 = 1/5 · 0,1 = 1/10</p>
     <p class="rule">Para pasar una fracción a decimal, divide el numerador por el denominador: 3/5 = 3 : 5 = 0,6.</p>`)],
  ['¿Cuánto es 4,7 · 100?','470',['47','4.700','0,047'],'Multiplicar por 100 corre la coma <b>dos lugares a la derecha</b>: 4,7 → 470.']),

'6c-mat-u4': rv('Matemáticas',4,'Razón y porcentaje','#d9771a',
  '¡Guau! Repasemos razones y porcentajes.',
  'Guía 4 Razón y porcentaje 6° 2026 (Matemáticas 6°C)',
  [C('Razón', `<p>Una razón compara dos cantidades. Se escribe <b>a : b</b> y se lee "a es a b".</p>
     <p class="rule">El orden importa: niñas a niños no es lo mismo que niños a niñas.</p>
     <p class="exm">Si plantan 15 árboles en 5 días → 3 árboles por día → en 8 días plantan 24.</p>`),
   C('¿Qué es un porcentaje?', `<p>Es una razón con denominador 100: 25% = 25/100 = 1/4 = 0,25.</p>
     <p>En una cuadrícula de 100 cuadrados, el 30% son 30 cuadrados pintados.</p>`),
   C('Calcular porcentajes', `<ul><li><b>10%</b> → dividir por 10. 10% de 400 = 40.</li><li><b>25%</b> → dividir por 4. 25% de 400 = 100.</li><li><b>50%</b> → la mitad. 50% de 400 = 200.</li></ul>`)],
  ['¿Cuánto es el 25% de 80?','20',['25','40','8'],'El 25% es la cuarta parte: 80 : 4 = <b>20</b>.']),

'6c-mat-u5': rv('Matemáticas',5,'Ángulos','#1f8a4c',
  '¡Guau! Repasemos los ángulos antes de practicar.',
  'Guía 1 Geometría ángulos; Guía 2 Ángulos entre rectas (Matemáticas 6°C)',
  [C('Tipos de ángulos', `<table class="rv"><tr><td><b>Agudo</b></td><td>Menos de 90°</td></tr><tr><td><b>Recto</b></td><td>90°</td></tr>
     <tr><td><b>Obtuso</b></td><td>Entre 90° y 180°</td></tr><tr><td><b>Extendido</b></td><td>180°</td></tr><tr><td><b>Completo</b></td><td>360°</td></tr></table>
     <p>Se miden con el <b>transportador</b>, en grados.</p>`),
   C('Complementarios y suplementarios', `<ul><li><b>Complementarios:</b> suman 90°. Complemento de 30° = 60°.</li><li><b>Suplementarios:</b> suman 180°. Suplemento de 130° = 50°.</li></ul>`),
   C('Ángulos entre rectas', `<p>Cuando dos rectas se cortan:</p>
     <ul><li><b>Opuestos por el vértice:</b> miden lo mismo.</li><li><b>Adyacentes:</b> están uno al lado del otro y suman 180°.</li></ul>`)],
  ['¿Cuánto mide el suplemento de un ángulo de 65°?','115°',['25°','295°','65°'],'Suplementarios suman 180°: 180° − 65° = <b>115°</b>.']),

'6c-mat-u6': rv('Matemáticas',6,'Triángulos y cuadriláteros','#c43b6c',
  '¡Guau! Repasemos las figuras de 3 y 4 lados.',
  'Guía 3 Geometría Triángulos; Guía 4 Geometría Teselaciones (Matemáticas 6°C)',
  [C('Triángulos', `<p class="rule">Los ángulos interiores de un triángulo suman 180°.</p>
     <ul><li>Según sus lados: <b>equilátero</b> (3 iguales), <b>isósceles</b> (2 iguales), <b>escaleno</b> (todos distintos).</li>
     <li>Según sus ángulos: <b>acutángulo</b> (3 agudos), <b>rectángulo</b> (uno de 90°), <b>obtusángulo</b> (uno obtuso).</li></ul>`),
   C('Cuadriláteros', `<p class="rule">Los ángulos interiores de un cuadrilátero suman 360°.</p>
     <ul><li><b>Paralelogramos</b> (2 pares de lados paralelos): cuadrado, rectángulo, rombo y romboide.</li>
     <li><b>Trapecio:</b> un solo par de lados paralelos. <b>Trapezoide:</b> ninguno.</li></ul>`),
   C('Teselaciones', `<p>Cubrir el plano con figuras sin dejar huecos ni superponerlas.</p>
     <p class="rule">Los ángulos que se juntan en un vértice deben sumar 360°.</p>
     <p>Con un solo polígono regular solo funcionan: triángulos (6 × 60°), cuadrados (4 × 90°) y hexágonos (3 × 120°).</p>`)],
  ['Un triángulo tiene ángulos de 50° y 60°. ¿Cuánto mide el tercero?','70°',['110°','90°','250°'],'Los ángulos de un triángulo suman 180°: 180° − 50° − 60° = <b>70°</b>.']),

'6c-mat-u7': rv('Matemáticas',7,'Medición','#3a7bbf',
  '¡Guau! Repasemos unidades, áreas y volúmenes.',
  'Guía 5 Geometría área y volumen; Guía 6 Geometría Medición (Matemáticas 6°C)',
  [C('Unidades de longitud', `<p>1 km = 1.000 m · 1 m = 100 cm · 1 cm = 10 mm</p>
     <p class="rule">De una unidad mayor a una menor se multiplica; de una menor a una mayor se divide.</p>
     <p>Superficie: <b>cm²</b> para cosas pequeñas (cuaderno), <b>m²</b> para espacios (habitación, parcela), <b>km²</b> para ciudades y regiones.</p>`),
   C('Perímetro y área', `<ul><li><b>Perímetro:</b> la medida del contorno (suma de los lados).</li><li><b>Rectángulo:</b> A = largo · ancho.</li>
     <li><b>Triángulo:</b> A = base · altura : 2.</li><li><b>Rombo y romboide:</b> A = base · altura.</li>
     <li><b>Trapecio:</b> A = (base mayor + base menor) · altura : 2.</li></ul>`),
   C('Volumen', `<ul><li><b>Cubo:</b> V = arista · arista · arista.</li><li><b>Paralelepípedo:</b> V = largo · ancho · alto.</li></ul>
     <p class="rule">1 m³ = 1.000 litros.</p>`)],
  ['¿Cuál es el área de un triángulo de base 10 cm y altura 6 cm?','30 cm²',['60 cm²','16 cm²','32 cm²'],'A = base · altura : 2 = 10 · 6 : 2 = <b>30 cm²</b>.']),

'6c-mat-u8': rv('Matemáticas',8,'Ecuaciones','#a8521f',
  '¡Guau! Repasemos cómo encontrar el número escondido.',
  'Guía Ecuaciones 6° 2026 (Matemáticas 6°C)',
  [C('¿Qué es una ecuación?', `<p>Una igualdad con un valor desconocido, la <b>incógnita</b> (x).</p>
     <p class="rule">Es como una balanza en equilibrio: lo que haces a un lado, lo haces al otro.</p>`),
   C('Operaciones inversas', `<table class="rv"><tr><td class="exm">x + 15 = 40</td><td>Resto 15 → x = 25</td></tr>
     <tr><td class="exm">x − 8 = 12</td><td>Sumo 8 → x = 20</td></tr><tr><td class="exm">4 · x = 36</td><td>Divido por 4 → x = 9</td></tr>
     <tr><td class="exm">x : 3 = 7</td><td>Multiplico por 3 → x = 21</td></tr></table>`),
   C('Problemas', `<p>1) Llama x a lo que no conoces. 2) Escribe la ecuación. 3) Resuélvela.</p>
     <p class="exm">Pienso un número, le sumo 12 y obtengo 30 → x + 12 = 30 → x = 18</p>`)],
  ['Resuelve: 3x + 5 = 26','x = 7',['x = 21','x = 10,3','x = 31'],'Resta 5: 3x = 21. Divide por 3: <b>x = 7</b>.']),

'6c-mat-u9': rv('Matemáticas',9,'Datos y probabilidades','#4d7a1f',
  '¡Guau! Repasemos gráficos y azar.',
  'Guías A y B de Datos y probabilidades 6° 2026 (Matemáticas 6°C)',
  [C('Diagramas', `<ul><li><b>Diagrama de puntos:</b> cada punto es un dato. La columna más alta es la moda.</li>
     <li><b>Tallo y hojas:</b> el tallo son las decenas y las hojas las unidades. Tallo 2 y hoja 7 → 27.</li></ul>`),
   C('Gráficos', `<ul><li><b>Barras dobles:</b> comparan dos grupos (ej. 6°A y 6°B) en las mismas categorías.</li>
     <li><b>Circular:</b> muestra partes de un total en porcentaje; el sector más grande es el más frecuente.</li></ul>`),
   C('Azar', `<ul><li><b>Seguro:</b> siempre ocurre. <b>Posible:</b> puede ocurrir o no. <b>Imposible:</b> nunca ocurre.</li>
     <li>Al lanzar una moneda muchas veces, esperamos cerca de la <b>mitad</b> de caras.</li>
     <li>Al lanzar un dado, cada número tiene 1 de 6 posibilidades.</li></ul>`)],
  ['Al lanzar un dado común, ¿cómo es el evento "obtener un 7"?','Imposible',['Seguro','Posible','Muy probable'],'Un dado común solo tiene los números del 1 al 6, así que obtener un 7 es <b>imposible</b>.']),

/* ---------- 6° Lenguaje ---------- */
'6c-len-u1': rv('Lenguaje',1,'Leer narraciones','#c43b6c',
  '¡Guau! Repasemos cómo se arma una historia.',
  'Guía N°1 6° Lenguaje (Ami, el niño de las estrellas); Guías N°2 y N°3; Lectura N°1 (Lenguaje 6°C)',
  [C('Elementos de la narración', `<ul><li><b>Narrador:</b> la voz que cuenta la historia (no siempre es el autor).</li>
     <li><b>Personajes:</b> protagonista, antagonista y secundarios.</li><li><b>Acciones:</b> los hechos que ocurren.</li>
     <li><b>Ambiente:</b> el lugar, el tiempo y el clima emocional donde pasa la historia.</li></ul>`),
   C('Tipos de narrador', `<ul><li><b>Protagonista:</b> cuenta su propia historia en primera persona ("yo"). Pedro, en "Ami, el niño de las estrellas", es narrador protagonista.</li>
     <li><b>Testigo:</b> cuenta lo que vio, pero no es el principal.</li><li><b>Omnisciente:</b> lo sabe todo, incluso lo que piensan los personajes.</li></ul>`),
   C('Estructura', `<p><b>Inicio</b> (se presenta la situación) → <b>desarrollo o nudo</b> (aparece el conflicto) → <b>desenlace</b> (se resuelve).</p>
     <p class="rule">La raya (—) al comienzo de una línea indica que un personaje habla.</p>`),
   C('Comprender lo que leo', `<ul><li><b>Literal:</b> la respuesta está escrita en el texto.</li><li><b>Inferencial:</b> la respuesta se deduce de pistas.</li></ul>
     <p>Para descubrir el significado de una palabra nueva, fíjate en las palabras que la rodean (el contexto).</p>`)],
  ['En "Yo estaba sobre unas rocas altas junto a la playa…", ¿qué tipo de narrador hay?','Protagonista',['Omnisciente','Testigo','No hay narrador'],'El narrador usa "yo" y le pasan los hechos a él: es <b>protagonista</b>, en primera persona.']),

'6c-len-u2': rv('Lenguaje',2,'Biografía y noticia','#7b4fd6',
  '¡Guau! Repasemos dos textos que informan.',
  'Guía Biografía 6°; Guía N°2 Biografía; Póster La noticia (Lenguaje 6°C)',
  [C('La biografía', `<p>Texto no literario que cuenta la vida de una persona, escrito por <b>otra</b> persona, en <b>tercera persona</b> y en <b>orden cronológico</b>.</p>
     <p class="rule">Si la escribe la misma persona sobre sí misma, es una autobiografía (primera persona).</p>
     <p>Usa marcadores de tiempo ("a los 20 años", "en 2011") y verbos en pasado.</p>`),
   C('La noticia', `<p>Texto informativo sobre un hecho <b>reciente</b> y de interés para una comunidad. Es <b>objetiva</b> y se escribe en tercera persona.</p>
     <p>Responde: <b>qué, quién, cuándo, dónde, cómo y por qué</b>.</p>`),
   C('Partes de la noticia', `<table class="rv"><tr><td><b>Epígrafe o antetítulo</b></td><td>Va sobre el titular, lo complementa y llama la atención.</td></tr>
     <tr><td><b>Titular</b></td><td>Presenta la noticia de manera breve.</td></tr><tr><td><b>Bajada o subtítulo</b></td><td>Resume lo más importante, bajo el titular.</td></tr>
     <tr><td><b>Lead o entradilla</b></td><td>Primer párrafo; responde las preguntas básicas.</td></tr>
     <tr><td><b>Cuerpo</b></td><td>Agrega información de lo más a lo menos importante (pirámide invertida).</td></tr></table>`)],
  ['¿Qué parte de la noticia responde qué, quién, cuándo, dónde, cómo y por qué?','El lead o entradilla',['El titular','El epígrafe','La imagen'],'El <b>lead</b> es el primer párrafo y concentra la información esencial de la noticia.']),

'6c-len-u3': rv('Lenguaje',3,'Textos discontinuos','#0f8f8a',
  '¡Guau! Repasemos los textos que no se leen de corrido. Incluye la guía nueva de infografías.',
  'Hoja de información Textos discontinuos; Guía 1 Infografía 6°; PPT Características de la infografía; Póster Infografía; Anuncio publicitario (Lenguaje 6°C)',
  [C('Textos discontinuos', `<p>Presentan la información en <b>fragmentos</b> (tablas, gráficos, imágenes, listas), sin párrafos seguidos. Puedes leer solo la parte que te interesa.</p>
     <p>Ejemplos: mapas, listas, tablas, gráficos, instructivos, carteles, esquemas, diagramas, infografías e historietas.</p>`),
   C('La infografía', `<p class="rule">Información + gráfica = infografía. Es una palabra compuesta.</p>
     <p>Presenta información de forma <b>visual</b>, con imágenes, datos y textos breves, para que sea fácil de entender y recordar.</p>
     <ul><li>Sirve para información que se puede <b>resumir</b>, poner en una <b>lista</b>, <b>ordenar en secuencia</b>, <b>comparar</b> o mostrar en un gráfico.</li>
       <li><b>No</b> sirve para información muy compleja y larga.</li>
       <li>Usa título, viñetas, marcos, colores con cuidado, íconos y flechas que guían la lectura, y la fuente de los datos.</li></ul>`),
   C('Publicidad y propaganda', `<ul><li><b>Publicidad:</b> busca que compres o uses un producto o servicio.</li>
     <li><b>Propaganda:</b> promueve ideas o conductas (reciclar, vacunarse).</li></ul>
     <p>Usan <b>eslogan</b> (frase breve), <b>logotipo</b>, imágenes llamativas y a veces exageraciones.</p>
     <p class="rule">Hay que leerlas con actitud crítica: ¿es real lo que promete?</p>`)],
  ['¿Qué tipo de información NO es buena para una infografía?','Una explicación muy compleja y larga',['Datos que se pueden poner en una lista','Los pasos de un proceso en orden','Una comparación entre dos cosas'],'La infografía funciona con información que se puede <b>resumir</b> en fragmentos breves. Una explicación compleja y larga no cabe bien.']),

'6c-len-u4': rv('Lenguaje',4,'Comunicación oral y vocabulario','#d9771a',
  '¡Guau! Repasemos cómo hablar frente al curso y ampliar tu vocabulario.',
  'PPT Textos orales; Rúbricas de disertación y oralidad 6° (Lenguaje 6°C)',
  [C('La disertación', `<p>Exposición oral de un tema investigado, con <b>introducción</b> (presenta el tema), <b>desarrollo</b> (lo explica) y <b>conclusión</b> (resume lo importante).</p>
     <ul><li>Mira al público, habla con volumen claro y en registro <b>formal</b>.</li><li>Apoyo visual con imágenes y palabras clave, no párrafos largos.</li>
     <li>Evita las <b>muletillas</b> ("eeh", "o sea").</li><li>Ensaya para manejar el tiempo.</li></ul>`),
   C('Escuchar también es comunicar', `<p>Cuando un compañero diserta, el público escucha con atención y respeto.</p>
     <p>El <b>lenguaje no verbal</b> (gestos, postura, expresión) acompaña a las palabras.</p>`),
   C('Vocabulario', `<ul><li><b>Sinónimos:</b> significado parecido (contemplar / observar).</li><li><b>Antónimos:</b> significado contrario (aproximarse / alejarse).</li>
     <li><b>Prefijos:</b> "in-" o "des-" suelen negar (invisible, inofensivo).</li><li><b>Sufijos:</b> "-ito" forma diminutivos (casita).</li></ul>`)],
  ['¿Cuáles son las partes de una disertación?','Introducción, desarrollo y conclusión',['Inicio, nudo y desenlace','Titular, bajada y cuerpo','Estrofa, verso y rima'],'Una disertación se organiza en <b>introducción</b>, <b>desarrollo</b> y <b>conclusión</b>.']),

/* ---------- 6° Ciencias ---------- */
'6c-cie-u1': rv('Ciencias',1,'Ecosistemas','#1f8a4c',
  '¡Guau! Repasemos cómo se relacionan los seres vivos con su ambiente.',
  'PPT Ecosistemas 6°; Cadena y red trófica (Ciencias Naturales 6°C)',
  [C('¿Qué es un ecosistema?', `<p>El conjunto de <b>seres vivos</b>, los <b>factores físicos</b> del lugar donde viven y las relaciones entre ellos.</p>
     <ul><li><b>Bióticos:</b> todo lo que tiene vida (plantas, animales, microorganismos, personas).</li>
     <li><b>Abióticos:</b> lo que no tiene vida (agua, luz, temperatura, rocas, suelo).</li></ul>`),
   C('Niveles de organización', `<p><b>Organismo → población → comunidad → ecosistema</b></p>
     <ul><li><b>Población:</b> individuos de la misma especie en un lugar.</li><li><b>Comunidad:</b> conjunto de poblaciones de distintas especies.</li></ul>`),
   C('Cadenas y redes tróficas', `<ul><li><b>Productores:</b> fabrican su alimento con la fotosíntesis (plantas, algas).</li>
     <li><b>Consumidores:</b> primarios (herbívoros), secundarios y terciarios.</li>
     <li><b>Descomponedores:</b> hongos y bacterias que devuelven nutrientes al suelo.</li></ul>
     <p class="rule">La flecha apunta desde el que es comido hacia el que come: pasto → conejo → zorro.</p>`)],
  ['En la cadena pasto → conejo → zorro, ¿qué es el conejo?','Consumidor primario',['Productor','Consumidor secundario','Descomponedor'],'El conejo come al productor (el pasto): es un <b>consumidor primario</b>, herbívoro.']),

'6c-cie-u2': rv('Ciencias',2,'El suelo','#a8521f',
  '¡Guau! Repasemos de qué está hecho el suelo y cómo cuidarlo.',
  'Guía 6° El suelo – Erosión; PPT Suelos (Ciencias Naturales 6°C)',
  [C('Composición y formación', `<p>El suelo es la capa más superficial de la litósfera. Tiene <b>minerales, agua, aire y materia orgánica</b>.</p>
     <p class="rule">Se forma por meteorización: la lluvia y los cambios de temperatura fragmentan las rocas durante miles de años.</p>
     <p>Las <b>lombrices</b> remueven el suelo y dejan entrar aire y agua.</p>`),
   C('Horizontes del suelo', `<table class="rv"><tr><td><b>O</b></td><td>El más superficial: oscuro, con restos de plantas y animales que forman <b>humus</b>.</td></tr>
     <tr><td><b>A</b></td><td>Mucha materia orgánica; aquí crecen las raíces y viven lombrices e insectos.</td></tr>
     <tr><td><b>B</b></td><td>Acumulación de minerales (arcilla, hierro) arrastrados por el agua.</td></tr>
     <tr><td><b>C</b></td><td>Rocas fragmentadas.</td></tr><tr><td><b>R</b></td><td>Roca entera: la <b>roca madre</b>.</td></tr></table>`),
   C('Tipos de suelo', `<ul><li><b>Arenoso:</b> partículas grandes, no retiene agua.</li><li><b>Arcilloso:</b> partículas finas, retiene mucha agua y se pone pegajoso.</li>
     <li><b>Limoso</b> y <b>rocoso</b>.</li><li><b>Orgánico:</b> rico en humus, esponjoso; el mejor para cultivar.</li></ul>`),
   C('Erosión', `<ul><li><b>Natural:</b> hídrica (lluvia, ríos, glaciares) y eólica (viento).</li>
     <li><b>Antrópica (humana):</b> cultivos en pendientes, sobrepastoreo, tala de bosques e incendios.</li></ul>
     <p class="rule">Desertización: pérdida de suelo por causas naturales. Desertificación: por acción humana.</p>`)],
  ['¿Qué tipo de suelo es el mejor para cultivar, según la guía?','El suelo orgánico, rico en humus',['El suelo arenoso','El suelo rocoso','El horizonte C'],'El <b>suelo orgánico</b> tiene abundante humus y nutrientes, y retiene bien el agua.']),

'6c-cie-u3': rv('Ciencias',3,'La energía','#d9771a',
  '¡Guau! Repasemos qué es la energía y cómo cambia de forma.',
  'Energía y sus transformaciones 6°; El viaje de la energía; Energy Explorer (Ciencias Naturales 6°C)',
  [C('¿Qué es la energía?', `<p>La capacidad de un objeto para realizar un trabajo o <b>provocar un cambio</b> (de movimiento, forma o temperatura).</p>
     <p class="rule">La energía no se crea ni se destruye: solo se transforma y se transfiere.</p>`),
   C('Formas de energía', `<ul><li><b>Cinética:</b> la de los cuerpos en movimiento. Mayor masa o rapidez, más energía.</li>
     <li><b>Potencial gravitatoria:</b> la de un cuerpo en altura.</li><li><b>Térmica:</b> agitación de las partículas (temperatura).</li>
     <li><b>Lumínica</b> (luz) y <b>química</b> (alimentos, pilas, combustibles).</li></ul>`),
   C('Fuentes de energía', `<ul><li><b>Renovables:</b> solar, eólica, hidráulica, undimotriz (olas), biomasa, geotérmica.</li>
     <li><b>No renovables:</b> petróleo, carbón y gas natural.</li></ul>
     <p>La mayoría de la energía viene directa o indirectamente del <b>Sol</b>.</p>
     <p class="exm">Linterna: química (pila) → eléctrica → lumínica</p>`)],
  ['Una pelota cae desde una mesa. ¿Qué transformación de energía ocurre?','Potencial en cinética',['Cinética en química','Lumínica en sonora','Eléctrica en potencial'],'Al caer pierde altura (energía <b>potencial</b>) y gana rapidez (energía <b>cinética</b>).']),

'6c-cie-u4': rv('Ciencias',4,'La Tierra y la pubertad','#3a7bbf',
  '¡Guau! Repasemos cómo es nuestro planeta y los cambios del cuerpo.',
  'El planeta; Cambios en la pubertad; Aparato reproductor (Ciencias Naturales 6°C)',
  [C('Capas de la Tierra', `<ul><li><b>Internas</b> (de afuera hacia adentro): <b>corteza</b> (donde vivimos, la más delgada), <b>manto</b> y <b>núcleo</b> (la más caliente).</li>
     <li><b>Externas:</b> atmósfera (aire), hidrosfera (agua) y geosfera (roca).</li></ul>
     <p class="rule">En Chile hay tantos sismos porque la placa de Nazca se mete bajo la placa Sudamericana.</p>`),
   C('Ante un sismo', `<p>Agáchate, cúbrete bajo una mesa y sujétate. Ante alerta de tsunami, ve a zonas altas.</p>`),
   C('La pubertad', `<p>Etapa de cambios en el cuerpo para pasar de niño o niña a adulto. La inician las <b>hormonas</b> y cada persona tiene su propio ritmo.</p>
     <ul><li><b>Cambios físicos:</b> aumento de estatura (estirón), vello en axilas, sudor y acné.</li>
     <li><b>Cambios psicológicos y sociales:</b> cambios de ánimo, intereses propios y amistades más intensas.</li></ul>
     <p class="rule">La higiene diaria es clave: ducharse, usar desodorante y lavarse los dientes.</p>`)],
  ['¿Qué capa de la Tierra es la más delgada y es donde vivimos?','La corteza',['El manto','El núcleo','La atmósfera'],'La <b>corteza</b> es la capa sólida más externa y delgada; ahí vivimos.']),

/* ---------- 6° Historia ---------- */
'6c-his-u1': rv('Historia y Geografía',1,'Geografía de Chile','#2c62d8',
  '¡Guau! Repasemos el territorio de Chile.',
  'Cuestionario 6° Básico; Guía organización del territorio; Mapas regionales (Historia 6°C)',
  [C('Territorio', `<p>Espacio terrestre, marítimo y aéreo donde el Estado ejerce soberanía.</p>
     <p class="rule">Chile es tricontinental: tiene territorio en América, Oceanía (Rapa Nui) y la Antártica.</p>
     <p>Limita con Perú, Bolivia y Argentina.</p>`),
   C('Regiones', `<p>La actual <b>regionalización</b> comenzó en la década de 1970 para administrar mejor el país. Hoy hay <b>16 regiones</b>.</p>
     <p>Creadas en el siglo XXI: <b>Arica y Parinacota</b> y <b>Los Ríos</b> (2007) y <b>Ñuble</b> (2018). La capital del Biobío es Concepción.</p>`),
   C('Relieve y zonas naturales', `<p>Macroformas (de oeste a este): <b>planicies litorales, cordillera de la Costa, depresión intermedia y cordillera de los Andes</b>.</p>
     <p>Cinco zonas naturales: Norte Grande, Norte Chico, Zona Central, Zona Sur y Zona Austral.</p>`),
   C('Ambientes', `<ul><li><b>Desértico</b> (Norte Grande): el desierto más árido del mundo.</li><li><b>Altiplánico:</b> gran altura, frío y lluvias de verano.</li>
     <li><b>Mediterráneo</b> (Zona Central): veranos secos e inviernos lluviosos; concentra a la población.</li>
     <li><b>Andino:</b> reserva de agua dulce (nieve y hielo).</li><li><b>Frío y lluvioso, patagónico y polar</b> en el sur.</li></ul>`)],
  ['¿Por qué se dice que Chile es tricontinental?','Tiene territorio en América, Oceanía y la Antártica',['Limita con tres países','Tiene tres zonas naturales','Tiene tres cordilleras'],'Chile tiene territorio en <b>América</b>, <b>Oceanía</b> (Rapa Nui) y la <b>Antártica</b>.']),

'6c-his-u2': rv('Historia y Geografía',2,'Independencia de Chile','#c43b6c',
  '¡Guau! Repasemos cómo Chile se hizo independiente.',
  'Antecedentes de la independencia; Procesos de independencia; Presentación Unidad 2 (Historia 6°C)',
  [C('Antecedentes', `<ul><li>Ideas de la <b>Ilustración</b> y ejemplos de la independencia de EE. UU. (1776) y la Revolución Francesa (1789).</li>
     <li>Malestar de los <b>criollos</b>, que no podían ocupar los cargos más altos.</li>
     <li><b>1808:</b> Napoleón invade España y captura al rey Fernando VII.</li></ul>`),
   C('Patria Vieja (1810-1814)', `<ul><li><b>18 de septiembre de 1810:</b> Primera Junta Nacional de Gobierno, presidida por Mateo de Toro y Zambrano.</li>
     <li>Primer Congreso Nacional (1811): libertad de vientre. José Miguel Carrera, primera bandera y La Aurora de Chile.</li>
     <li>Termina con el <b>Desastre de Rancagua</b> (1814).</li></ul>`),
   C('Reconquista y Patria Nueva', `<ul><li><b>Reconquista (1814-1817):</b> España recupera el control. Destaca el guerrillero <b>Manuel Rodríguez</b>.</li>
     <li>El Ejército de los Andes (San Martín y O'Higgins) se organiza en Mendoza y vence en <b>Chacabuco (1817)</b>.</li>
     <li><b>12 de febrero de 1818:</b> Acta de Independencia. La batalla de <b>Maipú</b> la consolida.</li>
     <li>O'Higgins es Director Supremo hasta su abdicación en 1823.</li></ul>`)],
  ['¿Qué batalla puso fin a la Patria Vieja en 1814?','El Desastre de Rancagua',['Chacabuco','Maipú','Lircay'],'Con el <b>Desastre de Rancagua</b> (1814) los patriotas fueron derrotados y comenzó la Reconquista.']),

'6c-his-u3': rv('Historia y Geografía',3,'Organización de la República','#7b4fd6',
  '¡Guau! Repasemos cómo se organizó Chile después de la independencia.',
  'Guía Autoritarismo conservador; Guía Reformas liberales; Organización democrática de Chile (Historia 6°C)',
  [C('Ensayos y orden conservador', `<ul><li><b>1823-1830:</b> ensayos constitucionales (federalistas, liberales y conservadores).</li>
     <li><b>Lircay (1830):</b> triunfan los conservadores. Ideólogo: <b>Diego Portales</b>.</li>
     <li><b>Constitución de 1833:</b> presidente con mucho poder, <b>voto censitario</b> y religión católica oficial.</li>
     <li>Decenios de Prieto, Bulnes y Montt. Se funda la Universidad de Chile (1842) con Andrés Bello.</li></ul>`),
   C('Reformas liberales', `<ul><li>Buscaban limitar el poder del presidente y ampliar las libertades.</li><li><b>1871:</b> se prohíbe la reelección inmediata.</li>
     <li><b>Leyes laicas (1883-1884):</b> registro civil, matrimonio civil y cementerios laicos.</li></ul>`),
   C('La democracia hoy', `<p>La <b>Constitución</b> es la ley fundamental: organiza el gobierno, establece derechos y deberes y define los poderes del Estado.</p>
     <table class="rv"><tr><td><b>Ejecutivo</b></td><td>Presidente y ministros: gobiernan.</td></tr>
       <tr><td><b>Legislativo</b></td><td>Congreso (Senado y Cámara de Diputados): hace las leyes.</td></tr>
       <tr><td><b>Judicial</b></td><td>Tribunales y Corte Suprema: aplican la ley y resuelven conflictos.</td></tr></table>
     <p><b>Ciudadanos:</b> chilenos de 18 años o más, sin condena a pena aflictiva. El voto es personal, igualitario y secreto.</p>`)],
  ['¿Qué poder del Estado hace las leyes?','El Legislativo (Congreso)',['El Ejecutivo','El Judicial','La municipalidad'],'El <b>Poder Legislativo</b>, el Congreso Nacional, discute y aprueba las leyes.']),

'6c-his-u4': rv('Historia y Geografía',4,'Taller de Geografía','#0f8f8a',
  '¡Guau! Repasemos regiones, desarrollo y el Chile productivo.',
  'Concepto de región y tipos de regiones; Guía Desarrollo Humano; Chile en tres capas; Chile’s Productive Geography; Guía Misión Biobío (Taller de Geografía 6°C)',

'8c-fis-u1': rv('Física',1,'Corriente, voltaje y resistencia','#c43b6c',
  '¡Guau! Antes de calcular, repasemos de qué está hecha la electricidad.',
  'Electricidad II: Ley de Ohm (PPT); Guía N°3 de Ley de Ohm (Taller de Física 8°C)',
  [C('Tres magnitudes clave', `<table class="rv"><tr><td><b>Intensidad (i)</b></td><td>Carga que pasa por un conductor en cada segundo. <b>i = q : t</b>. Se mide en <b>ampere (A)</b>.</td></tr>
     <tr><td><b>Voltaje (V)</b></td><td>Energía para mover cada carga. También se llama tensión o diferencia de potencial. Se mide en <b>volt (V)</b>.</td></tr>
     <tr><td><b>Resistencia (R)</b></td><td>Oposición al paso de la corriente. Se mide en <b>ohm (Ω)</b>.</td></tr></table>
     <p class="exm">5 A durante 1 min (60 s) → q = 5 · 60 = 300 C</p>`),
   C('Corriente continua y alterna', `<ul><li><b>Continua:</b> las cargas van siempre en el mismo sentido. La dan las <b>pilas y baterías</b>.</li>
     <li><b>Alterna:</b> las cargas van y vuelven. La producen los <b>generadores</b>; es la del enchufe.</li></ul>`),
   C('¿De qué depende la resistencia de un cable?', `<p class="rule">R = ρ · L : A</p>
     <ul><li>Más <b>largo</b> (L) → más resistencia.</li><li>Más <b>grueso</b> (A) → menos resistencia.</li><li>Material con menor <b>resistividad</b> (ρ) → conduce mejor. La plata es la mejor; el cobre es casi igual y más barato.</li></ul>`),
   C('Conductores y aislantes', `<p><b>Conductores:</b> metales como cobre, aluminio y hierro. <b>Aislantes:</b> plástico, caucho, madera seca y vidrio.</p>
     <p>Un circuito necesita <b>fuente</b> (pila), <b>conductores</b> (cables), <b>receptor</b> (ampolleta) y un <b>interruptor</b>.</p>`)],
  ['Un alambre conduce mejor si es:','Corto, grueso y de baja resistividad',['Largo, delgado y de alta resistividad','Largo y grueso','De plástico'],'La resistencia crece con la longitud y baja con el grosor. Un material de baja resistividad, como el cobre, conduce mejor.']),

'8c-fis-u2': rv('Física',2,'Ley de Ohm','#d9771a',
  '¡Guau! Una sola fórmula y tres formas de usarla. Vamos.',
  'Guías de Ley de Ohm de las clases del 14, 21 y 28 de julio (Taller de Física 8°C)',
  [C('La Ley de Ohm', `<p class="rule">V = i · R</p><p>Despeja según lo que buscas:</p>
     <div class="signs"><span>V = i · R</span><span>i = V : R</span><span>R = V : i</span></div>
     <p>En un gráfico de voltaje versus intensidad, la <b>resistencia es la pendiente</b>.</p>`),
   C('Ejemplos de la guía', `<ul class="steps"><li>Brasero de 22 Ω enchufado a 110 V → <b>i = 110 : 22 = 5 A</b></li>
     <li>Calientaplatos de 24 Ω que absorbe 5 A → <b>V = 5 · 24 = 120 V</b></li>
     <li>Ampolleta de 120 V que absorbe 1,6 A → <b>R = 120 : 1,6 = 75 Ω</b></li></ul>`),
   C('Cuidado con las unidades', `<p>1 A = 1.000 mA. Si te piden miliamperes, calcula en ampere y multiplica por 1.000.</p>
     <p class="exm">220 V : 1.500 Ω ≈ 0,147 A ≈ 147 mA</p>
     <p>Si R aumenta y V se mantiene, i <b>disminuye</b> (son inversamente proporcionales).</p>`)],
  ['Un tostador de 8 Ω funciona a 120 V. ¿Qué corriente circula?','15 A',['960 A','128 A','0,07 A'],'i = V : R = 120 : 8 = <b>15 A</b>.']),

'8c-fis-u3': rv('Física',3,'Circuitos en serie y en paralelo','#2c62d8',
  '¡Guau! Serie o paralelo: esa es la pregunta.',
  'Clase 7 de julio; Guía de circuitos y energía eléctrica; Desafío científico N°1 (Taller de Física 8°C)',
  [C('Circuito en serie', `<p>Un solo camino: las resistencias van una tras otra.</p>
     <div class="signs"><span>R = R₁ + R₂ + R₃</span><span>i igual en todas</span><span>V = V₁ + V₂ + V₃</span></div>
     <p>Si se desconecta una ampolleta, <b>se apagan todas</b>.</p>`),
   C('Circuito en paralelo', `<p>Varios caminos: cada resistencia se conecta directo a la fuente.</p>
     <div class="signs"><span>1/R = 1/R₁ + 1/R₂</span><span>V igual en todas</span><span>i = i₁ + i₂</span></div>
     <p class="rule">Atajo para dos resistencias: R = (R₁ · R₂) : (R₁ + R₂)</p>
     <p>Si se desconecta una, <b>las otras siguen</b>. Así son las casas.</p>`),
   C('Ejemplo resuelto', `<ul class="steps"><li>Batería de 12 V con R₁ = 2 Ω y R₂ = 4 Ω en serie</li><li>R total = 2 + 4 = 6 Ω → i = 12 : 6 = 2 A</li><li class="exm">Voltaje en R₂ = 2 · 4 = 8 V</li></ul>
     <p>Circuito <b>mixto</b>: primero resuelve el grupo en paralelo y luego suma lo que está en serie.</p>`)],
  ['Dos resistencias de 6 Ω y 3 Ω en paralelo equivalen a:','2 Ω',['9 Ω','18 Ω','4,5 Ω'],'R = (6 · 3) : (6 + 3) = 18 : 9 = <b>2 Ω</b>. En paralelo siempre queda menor que la menor.']),

'8c-fis-u4': rv('Física',4,'Potencia y energía eléctrica','#1f8a4c',
  '¡Guau! ¿Cuánto gasta la plancha de la casa? Hoy lo averiguamos.',
  'Electricidad III: Potencia eléctrica; Potencia, energía y efecto Joule; Guía de circuitos y energía (Taller de Física 8°C)',
  [C('Cómo se genera la electricidad', `<p>Las centrales <b>transforman</b> otra energía en eléctrica:</p>
     <ul><li><b>Hidroeléctrica:</b> agua de un embalse (como Ralco en el Biobío).</li><li><b>Termoeléctrica:</b> quema carbón, petróleo o gas.</li><li><b>Eólica:</b> viento. <b>Fotovoltaica:</b> luz del sol.</li><li><b>Geotérmica:</b> calor del subsuelo. <b>Mareomotriz:</b> mareas. <b>Termonuclear:</b> fisión del uranio.</li></ul>`),
   C('Potencia', `<p>Es la rapidez con que un aparato transforma la energía eléctrica. Se mide en <b>watt (W)</b> = joule por segundo.</p>
     <div class="signs"><span>P = V · i</span><span>P = i² · R</span><span>P = V² : R</span></div>
     <p class="exm">Plancha de 1.100 W en 220 V → i = 1.100 : 220 = 5 A</p>`),
   C('Energía y la cuenta de la luz', `<p class="rule">E = P · t</p>
     <ul class="steps"><li>Plancha de 1.100 W = 1,1 kW, usada 20 h al mes</li><li>E = 1,1 · 20 = 22 kWh</li><li class="exm">Si el kWh cuesta $150: 22 · 150 = $3.300</li></ul>`),
   C('Efecto Joule', `<p>Cuando circula corriente, parte de la energía se transforma en <b>calor</b>. Lo aprovechan planchas, hervidores y estufas.</p>
     <p>El <b>fusible</b> se funde y corta la corriente si esta es demasiado alta. Hoy se usan protectores termomagnéticos.</p>`)],
  ['Un hervidor de 2.000 W funciona media hora. ¿Cuánta energía consume?','1 kWh',['1.000 kWh','4 kWh','2 kWh'],'2.000 W = 2 kW. E = P · t = 2 · 0,5 = <b>1 kWh</b>.']),

'8c-qui-u1': rv('Química',1,'Modelos atómicos','#7b4fd6',
  '¡Guau! Repasemos cómo los científicos fueron descubriendo el átomo.',
  'Guía Constitución atómica de la materia 2026; Trabajo Evolución de los modelos atómicos (Taller de Química 8°C)',
  [C('Dalton (1808)', `<ul><li>La materia está hecha de átomos <b>indivisibles</b>, que no se crean ni se destruyen.</li><li>Los átomos de un mismo elemento son <b>idénticos</b>.</li><li>Se combinan en proporciones enteras y sencillas.</li></ul>
     <p class="rule">Fallas: el átomo sí tiene partes, y átomos del mismo elemento pueden ser distintos (isótopos).</p>`),
   C('Descubriendo las partículas', `<table class="rv"><tr><td><b>Crookes</b></td><td>Rayos catódicos: van del cátodo (−) al ánodo (+), tienen masa y se desvían con un imán.</td></tr>
     <tr><td><b>Thomson</b></td><td>Descubre el <b>electrón</b>. Modelo del "budín de pasas".</td></tr>
     <tr><td><b>Millikan</b></td><td>Gota de aceite: mide la carga del electrón.</td></tr>
     <tr><td><b>Goldstein</b></td><td>Rayos canales positivos → <b>protón</b>.</td></tr>
     <tr><td><b>Chadwick (1932)</b></td><td>Detecta el <b>neutrón</b> que había propuesto Rutherford.</td></tr></table>`),
   C('Rutherford, Bohr y hoy', `<ul><li><b>Rutherford:</b> lámina de oro. Núcleo pequeño, denso y positivo; casi todo el átomo es vacío.</li>
     <li><b>Bohr:</b> electrones en <b>niveles de energía</b> fijos.</li><li><b>Mecano-cuántico:</b> electrones en <b>orbitales</b>, zonas de probabilidad.</li></ul>
     <p class="rule">Los modelos cambian cuando aparecen evidencias que los anteriores no pueden explicar.</p>`)],
  ['¿Qué descubrió Rutherford con la lámina de oro?','Un núcleo pequeño, denso y positivo',['El electrón','Que el átomo es indivisible','Los orbitales'],'Casi todas las partículas atravesaban la lámina (mucho vacío) y unas pocas rebotaban al chocar con el <b>núcleo</b>.']),

'8c-qui-u2': rv('Química',2,'Constitución atómica','#0f8f8a',
  '¡Guau! Protones, neutrones y electrones: a contar se ha dicho.',
  'Guía Constitución atómica de la materia 2026 (Taller de Química 8°C)',
  [C('Partículas del átomo', `<table class="rv"><tr><td><b>Protón (p⁺)</b></td><td>Carga positiva, en el núcleo.</td></tr>
     <tr><td><b>Neutrón (n)</b></td><td>Sin carga, en el núcleo.</td></tr>
     <tr><td><b>Electrón (e⁻)</b></td><td>Carga negativa y masa muy pequeña, alrededor del núcleo.</td></tr></table>`),
   C('Z, A y cómo contar', `<p>${nuc('C',14,6)} → arriba <b>A = 14</b>, abajo <b>Z = 6</b>.</p>
     <ul><li><b>Protones = Z</b> (identifica al elemento).</li><li><b>Neutrones = A − Z</b> → 14 − 6 = 8.</li><li>Átomo neutro: <b>electrones = Z</b>.</li></ul>`),
   C('Iones', `<p class="rule">Carga = protones − electrones</p>
     <ul><li><b>Catión (+):</b> perdió electrones. Mg²⁺ (Z = 12) → 12 − 2 = 10 e⁻.</li><li><b>Anión (−):</b> ganó electrones. O²⁻ (Z = 8) → 8 + 2 = 10 e⁻.</li></ul>`),
   C('Isótopos, isóbaros e isótonos', `<ul><li><b>Isótopos:</b> mismo Z, distinto A (protio, deuterio y tritio).</li><li><b>Isóbaros:</b> igual A, distinto Z (¹⁴C y ¹⁴N).</li><li><b>Isótonos:</b> igual número de neutrones.</li><li><b>Isoelectrónicos:</b> igual número de electrones.</li></ul>
     <p class="rule">Truco: isóto<b>p</b>os = mismos <b>p</b>rotones; isóto<b>n</b>os = mismos <b>n</b>eutrones.</p>`)],
  ['¿Cuántos neutrones tiene un átomo con Z = 11 y A = 23?','12',['11','23','34'],'Neutrones = A − Z = 23 − 11 = <b>12</b>.']),

'8c-qui-u3': rv('Química',3,'Números cuánticos','#d9771a',
  '¡Guau! Los números cuánticos son la dirección de cada electrón.',
  'Guía de ejercicios Números cuánticos 8° básico (Taller de Química 8°C)',
  [C('La dirección del electrón', `<table class="rv"><tr><th>Número</th><th>¿Qué indica?</th><th>Valores</th></tr>
     <tr><td><b>n</b> principal</td><td>Nivel de energía</td><td>1, 2, 3, …</td></tr>
     <tr><td><b>l</b> secundario</td><td>Tipo de subnivel</td><td>0 hasta n − 1</td></tr>
     <tr><td><b>mₗ</b> magnético</td><td>Orbital dentro del subnivel</td><td>−l hasta +l</td></tr>
     <tr><td><b>mₛ</b> espín</td><td>Giro del electrón</td><td>+½ o −½</td></tr></table>`),
   C('Subniveles', `<table class="rv"><tr><th>Subnivel</th><th>l</th><th>Orbitales</th></tr>
     <tr><td>s</td><td>0</td><td>1 (0)</td></tr><tr><td>p</td><td>1</td><td>3 (−1, 0, +1)</td></tr>
     <tr><td>d</td><td>2</td><td>5 (−2 a +2)</td></tr><tr><td>f</td><td>3</td><td>7 (−3 a +3)</td></tr></table>
     <p class="exm">3d → n = 3, l = 2</p>`),

const unitKey = L => L && L.cc ? `${L.cc.toLowerCase()}-${L.sj}-u${L.u+1}` : null;
let RV = null;
function showReview(key, onDone, opts={}){
  const R = REVIEWS[key], S = ST[who];
  const [q, ok, ds, ex] = R.check, item = mc(ok, shuffle(ds));
  RV = {key, done:false};
  view = 'review'; setTab('path');
  app.innerHTML = `<div class="review" style="--uc:${R.c}">
    <div class="rv-top"><button class="x" id="rvX" aria-label="Volver">${IC.x}</button><span class="rv-tag">Repaso · ${R.subj} · Unidad ${R.n}</span></div>
    <h1>${R.t}</h1>
    <div id="buddy">${buddy('idle', R.intro)}</div>
    ${R.cards.map(c=>`<section class="rv-card"><h3>${c.h}</h3>${c.b}</section>`).join('')}
    <section class="rv-card rv-check"><h3>¿Entendiste?</h3><p class="rv-q">${q}</p>
      <div class="opts">${item.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
      <div id="rvFb"></div></section>
    <p class="rv-src">Basado en: ${R.src}</p>
    <div class="foot"><button class="btn" id="rvGo" disabled>${opts.go || '¡A practicar!'}</button><p class="hint" id="rvHint" style="text-align:center">Responde la pregunta para continuar.</p></div>
  </div>`;
  window.scrollTo({top:0});
  app.querySelectorAll('.rv-check .opt').forEach(b=>b.onclick=()=>{
    if (RV.done) return; RV.done = true;
    const pickI = +b.dataset.i, right = pickI===item.correct;
    app.querySelectorAll('.rv-check .opt').forEach((x,i)=>{ if(i===item.correct) x.classList.add('right'); else if(i===pickI) x.classList.add('wrong'); });
    $('#rvFb').innerHTML = `<div class="fb ${right?'ok':'no'}" style="padding:12px 14px"><h3>${right?IC.check+' ¡Correcto!':'Respuesta correcta: '+ok}</h3><div class="ex">${ex}</div></div>`;
    bark(right?'happy':'cheer');
    $('#buddy').innerHTML = buddy(right?'happy':'sad', right?'¡Guau guau! Entendiste. ¡Ahora a practicar!':'Casi. Lee la explicación; si quieres, vuelve a mirar el repaso.', right?'ok':'no');
    $('#rvGo').disabled = false; $('#rvHint').hidden = true;
