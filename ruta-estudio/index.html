  {t:'Electricidad (Física)', c:'#c43b6c', d:'#952450', src:'Taller de Física: Ley de Ohm, potencia eléctrica, circuitos y energía', L:[
    {t:'Carga y circuitos', q:[
      ['¿Qué partícula tiene carga negativa?','El electrón',['El protón','El neutrón','El átomo completo'],'Los protones son positivos.'],
      ['Dos cargas del mismo signo:','Se repelen',['Se atraen','No interactúan','Se destruyen'],'Cargas opuestas se atraen.'],
      ['¿Qué es la corriente eléctrica?','El flujo ordenado de cargas eléctricas por un conductor',['Un tipo de imán','La luz de una ampolleta','El calor de un cable'],'Se mide en amperes (A).'],
      ['¿Qué material es buen conductor de electricidad?','El cobre',['El plástico','La madera seca','El vidrio'],'Por eso se usa en los cables.'],
      ['¿Qué material es aislante?','El caucho',['El aluminio','El hierro','La plata'],'No deja pasar fácilmente la corriente.'],
      ['¿Qué elementos básicos tiene un circuito eléctrico?','Fuente de energía, conductores, receptor e interruptor',['Solo una ampolleta','Solo cables','Un imán y una brújula'],'La pila o batería es la fuente.'],
      ['En un circuito en serie, si se quema una ampolleta:','Se apagan todas',['Las otras siguen encendidas','Brillan más','No pasa nada'],'Hay un solo camino para la corriente.'],
      ['En un circuito en paralelo, si se quema una ampolleta:','Las demás siguen encendidas',['Se apagan todas','Explota el circuito','Se invierte la corriente'],'Cada ampolleta tiene su propio camino.'],
      ['¿Qué tipo de circuito se usa en las casas?','En paralelo',['En serie','Sin conductores','Abierto siempre'],'Así cada aparato funciona independiente.'],
      ['¿Qué es un circuito abierto?','Uno interrumpido, por el que no circula corriente',['Uno que funciona','Uno con muchas pilas','Uno con cables de cobre'],'Ej.: interruptor apagado.'],
      ['¿Con qué unidad se mide el voltaje?','Volt (V)',['Ampere (A)','Ohm (Ω)','Watt (W)'],'Es la diferencia de potencial.'],
      ['¿Con qué unidad se mide la resistencia eléctrica?','Ohm (Ω)',['Volt','Ampere','Joule'],'Indica la oposición al paso de corriente.'],
      ['¿Qué dispositivo protege un circuito cortando la corriente si hay exceso?','El fusible o disyuntor',['La ampolleta','El enchufe','El cable'],'Previene incendios.'],
    ]},
    {t:'Ley de Ohm y potencia', q:[
      ['¿Qué dice la Ley de Ohm?','V = I · R',['V = I + R','I = V · R','R = V + I'],'Voltaje = intensidad × resistencia.'],
      ['Si V = 12 V y R = 4 Ω, ¿cuál es la intensidad?','3 A',['48 A','16 A','8 A'],'I = V / R = 12 / 4 = 3 A.'],
      ['Si I = 2 A y R = 10 Ω, ¿cuál es el voltaje?','20 V',['5 V','12 V','0,2 V'],'V = I · R = 2 · 10.'],
      ['Si V = 220 V e I = 11 A, ¿cuál es la resistencia?','20 Ω',['2.420 Ω','209 Ω','231 Ω'],'R = V / I = 220 / 11.'],
      ['Si aumenta la resistencia y el voltaje se mantiene, la intensidad:','Disminuye',['Aumenta','No cambia','Se duplica siempre'],'I y R son inversamente proporcionales.'],
      ['¿Qué es la potencia eléctrica?','La rapidez con que un aparato transforma energía eléctrica',['La cantidad de cables','El tamaño del aparato','La resistencia'],'Se mide en watts (W).'],
      ['¿Cómo se calcula la potencia eléctrica?','P = V · I',['P = V / I','P = I / R','P = V + I'],'Voltaje por intensidad.'],
      ['Un hervidor funciona con 220 V y 10 A. ¿Cuál es su potencia?','2.200 W',['22 W','230 W','2,2 W'],'P = 220 · 10.'],
      ['¿Qué es el efecto Joule?','El calentamiento de un conductor cuando circula corriente',['La luz de los imanes','El sonido de los cables','La atracción de cargas'],'Lo aprovechan estufas y hervidores.'],
      ['¿En qué unidad cobra la compañía eléctrica la energía consumida?','Kilowatt-hora (kWh)',['Volt','Ohm','Ampere'],'Energía = potencia × tiempo.'],
      ['Una ampolleta de 100 W encendida 10 horas consume:','1 kWh',['10 kWh','100 kWh','0,1 kWh'],'100 W · 10 h = 1.000 Wh = 1 kWh.'],
      ['¿Qué aparato suele tener mayor potencia?','Una estufa eléctrica',['Un cargador de celular','Una ampolleta LED','Un reloj digital'],'Los que producen calor consumen más.'],
      ['¿Qué medida ayuda a ahorrar electricidad?','Desenchufar aparatos que no se usan',['Dejar el cargador conectado siempre','Usar ampolletas incandescentes','Abrir el refrigerador a cada rato'],'Muchos aparatos consumen en reposo.'],
    ]},
  ]},
  {t:'El átomo (Química)', c:'#7b4fd6', d:'#5a33ad', src:'Taller de Química: modelos atómicos, constitución atómica, números cuánticos', L:[
    {t:'Modelos atómicos', q:[
      ['¿Qué planteaba Dalton sobre el átomo (1808)?','Que era una esfera indivisible',['Que tenía electrones en órbitas','Que tenía un núcleo con protones','Que era un pudín con pasas'],'Era la partícula más pequeña e indivisible.'],
      ['¿Qué partícula descubrió Thomson?','El electrón',['El protón','El neutrón','El núcleo'],'Usando tubos de rayos catódicos.'],
      ['¿Cómo se conoce el modelo de Thomson?','Budín (pudín) de pasas',['Sistema planetario','Esfera indivisible','Nube de electrones'],'Electrones incrustados en una masa positiva.'],
      ['¿Qué descubrió Rutherford con su experimento de la lámina de oro?','Que el átomo tiene un núcleo pequeño, denso y positivo',['Que el átomo es indivisible','Que no hay electrones','Que los átomos son cuadrados'],'La mayoría de las partículas atravesaban la lámina.'],
      ['Según Rutherford, ¿cómo es la mayor parte del átomo?','Espacio vacío',['Sólida','Líquida','Llena de protones'],'Por eso las partículas alfa pasaban.'],
      ['¿Qué aportó Bohr al modelo atómico?','Los electrones giran en niveles de energía definidos',['El átomo es indivisible','Descubrió el neutrón','El átomo es un pudín'],'Explica los espectros de emisión.'],
      ['¿Quién descubrió el neutrón en 1932?','James Chadwick',['Dalton','Thomson','Bohr'],'Partícula sin carga del núcleo.'],
      ['¿Qué filósofo griego propuso la idea de átomo (“indivisible”)?','Demócrito',['Aristóteles','Platón','Pitágoras'],'Sin experimentos, solo por razonamiento.'],
      ['¿Qué observó Crookes en los tubos de descarga?','Rayos que se propagaban en línea recta desde el cátodo',['Que el átomo es indivisible','El núcleo','Las órbitas'],'Fueron los rayos catódicos.'],
      ['El modelo actual describe a los electrones en:','Orbitales, zonas de probabilidad',['Órbitas circulares fijas','Pasas en un budín','El núcleo'],'Modelo mecano-cuántico.'],
      ['¿Por qué cambian los modelos atómicos con el tiempo?','Porque nuevas evidencias muestran limitaciones de los anteriores',['Porque los científicos se aburren','Por moda','Porque los átomos cambian'],'La ciencia es dinámica.'],
      ['¿Qué fenómeno NO podía explicar el modelo de Dalton?','La radiactividad',['Que existen elementos','Que el agua tiene hidrógeno y oxígeno','Que los átomos se combinan'],'Mostró que el átomo sí tenía partes.'],
      ['¿Qué indican los números cuánticos?','La ubicación probable y la energía de un electrón en el átomo',['La masa del núcleo','El número de neutrones','La edad del átomo'],'Son cuatro: n, l, m y s.'],
    ]},
    {t:'Constitución atómica', q:[
      ['¿Qué indica el número atómico (Z)?','La cantidad de protones',['La cantidad de neutrones','La masa total','La cantidad de moléculas'],'Identifica al elemento.'],
      ['¿Qué indica el número másico (A)?','Protones + neutrones',['Solo protones','Solo electrones','Electrones + protones'],'Partículas del núcleo.'],
      ['Un átomo con Z = 6 y A = 14, ¿cuántos neutrones tiene?','8',['6','14','20'],'n = A − Z = 14 − 6.'],
      ['Un átomo neutro con Z = 11, ¿cuántos electrones tiene?','11',['22','10','12'],'En un átomo neutro, electrones = protones.'],
      ['¿Qué son los isótopos?','Átomos del mismo elemento con distinto número de neutrones',['Elementos distintos con igual masa','Átomos con distinto número de protones','Iones negativos'],'Igual Z, distinto A.'],
      ['Protio, deuterio y tritio son isótopos del:','Hidrógeno',['Oxígeno','Carbono','Helio'],'Tienen 0, 1 y 2 neutrones.'],
      ['¿Qué es un catión?','Un ion con carga positiva, que perdió electrones',['Un ion negativo','Un átomo neutro','Un neutrón libre'],'Ej.: Na⁺.'],
      ['¿Qué es un anión?','Un ion con carga negativa, que ganó electrones',['Un ion positivo','Un protón','Un isótopo'],'Ej.: Cl⁻.'],
      ['El ion Mg²⁺ (Z = 12) tiene:','10 electrones',['12 electrones','14 electrones','2 electrones'],'Perdió 2 electrones: 12 − 2.'],
      ['El ion O²⁻ (Z = 8) tiene:','10 electrones',['8 electrones','6 electrones','16 electrones'],'Ganó 2 electrones: 8 + 2.'],
      ['¿Qué son los isóbaros?','Átomos de elementos distintos con igual número másico',['Mismo elemento con distinto A','Igual número de neutrones','Iones con igual carga'],'Igual A, distinto Z.'],
      ['¿Qué son los isótonos?','Átomos distintos con igual número de neutrones',['Igual número másico','Mismo elemento','Igual número de electrones'],'Distinto A y Z, mismo n.'],
      ['¿Dónde se encuentran los protones y neutrones?','En el núcleo',['En la nube electrónica','Fuera del átomo','En los orbitales externos'],'Los electrones están alrededor.'],
    ]},
  ]},
];

  {t:'La Ilustración', c:'#7b4fd6', d:'#5a33ad', src:'Ficha informativa principios políticos de la Ilustración; Manual del redactor ilustrado', L:[

const sup = (b, e) => `${b}<sup>${e}</sup>`;
function rightTriFig(a, b, c, unk){
  // a = cateto horizontal, b = cateto vertical, c = hipotenusa; unk: 'a' | 'b' | 'c'
  const W=260, H=170, x0=40, y0=140, sx=170, sy=110;
  const lab = (k, v) => k===unk ? `<tspan class="unk">x</tspan>` : `${fmt(v)} cm`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Triángulo rectángulo">
    <polygon class="g-shape" points="${x0},${y0} ${x0+sx},${y0} ${x0},${y0-sy}"/>
    <path d="M${x0} ${y0-14} h14 v14" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
    <text class="g-lbl ${unk==='a'?'unk':''}" x="${x0+sx/2}" y="${y0+20}" text-anchor="middle">${lab('a',a)}</text>
    <text class="g-lbl ${unk==='b'?'unk':''}" x="${x0-8}" y="${y0-sy/2+5}" text-anchor="end">${lab('b',b)}</text>
    <text class="g-lbl ${unk==='c'?'unk':''}" x="${x0+sx/2+14}" y="${y0-sy/2-6}" text-anchor="start">${lab('c',c)}</text>
  </svg>`;
}

    if (v===3){ const [s,l]=pick(SUB.slice(0,3)), n=R(l+1,4), ask=Math.random()<.5;

    const n=R(1,4); return num(n,{prompt:`¿Cuántos subniveles distintos hay en el nivel n = ${n}?`, explain:`l puede valer de 0 hasta n − 1: ${Array.from({length:n},(_,k)=>k).join(', ')}. Son <b>${n}</b> subnivel${n>1?'es':''} (${SUB.slice(0,n).map(x=>n+x[0]).join(', ')}).`});
  }},
  qui_qn: {name:'¿Números cuánticos posibles?', gen(){
    let n=R(1,4), l=R(0,n-1), ml=R(-l,l), ms=pick(['+½','−½']), bad='';
    const r=R(1,4);
    if (r===2){ l=n+R(0,1); ml=R(-Math.min(l,2),Math.min(l,2)); bad=`l debe ser menor que n (l ≤ ${n-1}), y aquí l = ${l}.`; }
    if (r===3 && l<3){ ml=(l+1)*pick([1,-1]); bad=`mₗ solo puede ir de −${l} a +${l} cuando l = ${l}, y aquí mₗ = ${fmt(ml)}.`; }
    if (r===4 && Math.random()<.5){ n=0; l=0; ml=0; bad='n parte en 1 (n = 1, 2, 3, …); n = 0 no existe.'; }
    const ok=bad?'Imposible':'Posible';
    return mc(ok,[bad?'Posible':'Imposible'],{prompt:`¿Es posible este conjunto de números cuánticos?<br><span class="math" style="font-size:1.15rem">n = ${n}, l = ${l}, mₗ = ${fmt(ml)}, mₛ = ${ms}</span>`, explain: bad?`<b>Imposible</b>: ${bad}`:`<b>Posible</b>: l = ${l} es menor que n = ${n}; mₗ = ${fmt(ml)} está entre −${l} y +${l}; y mₛ es +½ o −½.`});
  }},
});

// un "yip" de perro chico: tono que sube rápido y cae, con formantes y algo de aspereza
function yip(c, t, o){
  const env=c.createGain(), out=c.createGain(); out.gain.value=o.gain||2.6;
  env.gain.setValueAtTime(0.0001,t); env.gain.exponentialRampToValueAtTime(o.vol,t+.012);
  env.gain.setValueAtTime(o.vol,t+o.dur*.35); env.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  const osc=c.createOscillator(); osc.type='sawtooth';
  osc.frequency.setValueAtTime(o.f0*.7,t); osc.frequency.linearRampToValueAtTime(o.f0,t+o.dur*.22); osc.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur);
  const fA=c.createBiquadFilter(); fA.type='bandpass'; fA.frequency.value=o.fA||1150; fA.Q.value=2.5;
  const fB=c.createBiquadFilter(); fB.type='bandpass'; fB.frequency.value=o.fB||2500; fB.Q.value=3.5;
  const gB=c.createGain(); gB.gain.value=.55;
  osc.connect(fA); osc.connect(fB); fB.connect(gB); fA.connect(env); gB.connect(env);
  if (!SND.noise){ SND.noise=c.createBuffer(1,Math.floor(c.sampleRate*.5),c.sampleRate); const d=SND.noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const n=c.createBufferSource(); n.buffer=SND.noise; const nf=c.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1900; nf.Q.value=1.2;
  const ng=c.createGain(); ng.gain.value=o.rough==null?.3:o.rough; n.connect(nf); nf.connect(ng); ng.connect(env);
  env.connect(out); out.connect(c.destination);
  osc.start(t); osc.stop(t+o.dur+.03); n.start(t); n.stop(t+o.dur+.03);
}
// gemidito: hacia arriba = "¡vamos!", hacia abajo = triste
function whine(c, t, up){
  const o=c.createOscillator(), g=c.createGain(), lfo=c.createOscillator(), lg=c.createGain(), d=.42;
  o.type='triangle'; o.frequency.setValueAtTime(up?720:980,t); o.frequency.exponentialRampToValueAtTime(up?1180:560,t+d);
  lfo.frequency.value=7; lg.gain.value=22; lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.05); g.gain.setValueAtTime(.16,t+d*.6); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.03); lfo.start(t); lfo.stop(t+d+.03);
}
function bark(kind){
  if (!SND.on) return; const c=actx(); if (!c) return;

    else if (kind==='party'){ [0,.14,.28].forEach((dt,i)=>yip(c,t+dt,{f0:1000+i*70,f1:680+i*40,dur:.1,vol:.45})); }
    else if (kind==='cheer'){ yip(c,t,{f0:760,f1:520,dur:.16,vol:.42,fA:950,rough:.25}); whine(c,t+.22,true); }
    else if (kind==='sad'){ whine(c,t,false); }
  } catch(e) {}
}

let view = who ? 'path' : 'who', LS=null, panelSel = null;
const app = $('#app');

function renderSnd(){
  const b=$('#bSnd'); if (!b) return;
  b.innerHTML = SND.on ? IC.sndOn : IC.sndOff; b.setAttribute('aria-pressed', SND.on); b.title = SND.on ? 'Silenciar a Goliat' : 'Activar los ladridos de Goliat';
  b.onclick = () => { SND.on=!SND.on; try{ localStorage.setItem('ruta-sound', SND.on?'on':'off'); }catch(e){} renderSnd(); if (SND.on) bark('happy'); };
}
function renderStats(){
  renderSnd();
  const box=$('#stats');
  if (!who){ box.innerHTML=''; return; }
  const S=ST[who], s=STU[who];
  box.innerHTML = `<button class="chip" id="bWho" style="--hue:${s.hue}" aria-label="Cambiar estudiante"><i>${esc(s.name[0])}</i>${esc(s.name)}<small>${s.cc.replace('C','°')}</small></button>
    <span class="stat fire" title="Racha de días">${IC.fire}${streakOf(S)}</span>
    <span class="stat xp" title="Puntos de experiencia">${IC.bolt}${S.xp.toLocaleString('es-CL')}</span>`;
  $('#bWho').onclick=()=>{ view='who'; render(); };
}
function renderSync(){
  const el=document.getElementById('syncEl'); if(!el) return;
  el.className='sync'+(sync==='cloud'?' on':'');
  el.innerHTML=`<i></i>El progreso se guarda solo en este dispositivo`;
}
function setTab(v){ $('#tPath').setAttribute('aria-pressed', v==='path'); $('#tRew').setAttribute('aria-pressed', v==='rewards'); $('#tPanel').setAttribute('aria-pressed', v==='panel'); }
$('#tRew').onclick = () => { if (!who){ view='who'; render(); return; } view='rewards'; render(); };
$('#tPath').onclick = () => { view = who ? 'path' : 'who'; render(); };
$('#tPanel').onclick = () => { view='panel'; render(); };

function render(scroll=true){
  renderStats();
  if (view==='who') renderWho();
  else if (view==='path') renderPath();
  else if (view==='panel') renderPanel();
  else if (view==='rewards') renderRewards(false);
  setTab(view==='panel'?'panel':view==='rewards'?'rewards':'path');
  if (scroll) window.scrollTo({top:0});
}

let addOpen = false;
function renderWho(){
  const full = STUDENTS.length>=MAX_PROFILES;
  app.innerHTML = `<section class="who">
    <h1>¿Quién va a practicar?</h1>
    <p class="sub">${STUDENTS.length?'Cada uno tiene su propia ruta y su propio progreso, guardado en este dispositivo.':'Crea tu perfil para empezar. Tu progreso se guarda en este dispositivo.'}</p>
    <div class="who-grid">${STUDENTS.map(s=>{ const S=ST[s.id]; return `<button class="who-card" data-id="${s.id}" style="--hue:${s.hue}">
      <span class="av">${esc(s.name[0])}</span><span class="nm">${esc(s.name)}</span><span class="cc">${courseLabel(s.cc)}</span>
      <span class="mini"><span>${IC.bolt}${S.xp.toLocaleString('es-CL')} XP</span><span>${IC.fire}${streakOf(S)} días</span></span></button>`; }).join('')}
      ${full?'':(addOpen?`<form class="who-card add-form" id="fAdd">
        <label for="nmIn">Tu nombre</label><input id="nmIn" maxlength="20" autocomplete="off" placeholder="Ej. Martina" required>
        <label for="ccIn">Curso</label><select id="ccIn"><option value="6C">6° básico</option><option value="8C">8° básico</option></select>
        <div class="add-row"><button type="button" class="btn ghost sm" id="bCancelAdd">Cancelar</button><button type="submit" class="btn sm">Crear perfil</button></div>
        <p class="hint" id="addMsg"></p></form>`
      :`<button class="who-card add" id="bAdd"><span class="av plus">+</span><span class="nm">Agregar estudiante</span><span class="cc">6° u 8° básico</span></button>`)}
    </div>
    ${full?`<p class="note slim">Este dispositivo ya tiene ${MAX_PROFILES} perfiles. Elimina uno desde el Panel para agregar otro.</p>`:''}
  </section>`;
  app.querySelectorAll('.who-card[data-id]').forEach(b=>b.onclick=()=>{ who=b.dataset.id; try{ localStorage.setItem('ruta-who',who); }catch(e){} view='path'; render(); });
  const ba=$('#bAdd'); if (ba) ba.onclick=()=>{ addOpen=true; renderWho(); $('#nmIn').focus(); };
  const bc=$('#bCancelAdd'); if (bc) bc.onclick=()=>{ addOpen=false; renderWho(); };
  const f=$('#fAdd'); if (f) f.onsubmit=e=>{ e.preventDefault();
    const name=$('#nmIn').value.trim().replace(/\s+/g,' ').slice(0,20);
    if (!name){ $('#addMsg').textContent='Escribe un nombre.'; return; }
    if (STUDENTS.some(x=>x.name.toLowerCase()===name.toLowerCase())){ $('#addMsg').textContent='Ya hay un perfil con ese nombre en este dispositivo.'; return; }
    const id='p'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
    const used=new Set(STUDENTS.map(x=>x.hue)); const hue=HUES.find(h=>!used.has(h))||HUES[STUDENTS.length%HUES.length];
    STUDENTS.push({id,name,cc:$('#ccIn').value,hue}); reindex(); saveProfiles(); loadST(id);
    addOpen=false; who=id; try{ localStorage.setItem('ruta-who',who); }catch(e){} view='path'; render();
  };
}

function weakSkills(S, sj){
  return Object.entries(S.skills).filter(([k,v])=>v.n>=2 && SKILLS[k] && (!sj || SKILL_SUBJ[k]===sj)).map(([k,v])=>[k,v.ok/v.n]).sort((a,b)=>a[1]-b[1]).slice(0,3).filter(x=>x[1]<.9).map(x=>x[0]);
}
const SUBJ_MEM = {};
function getSubj(){ if (SUBJ_MEM[who]) return SUBJ_MEM[who]; let v='mat'; try{ const r=localStorage.getItem('ruta-subj-'+who); if(r && SUBJ_T[r] && COURSES[STU[who].cc][r].length) v=r; }catch(e){} return SUBJ_MEM[who]=v; }
function setSubj(v){ SUBJ_MEM[who]=v; try{ localStorage.setItem('ruta-subj-'+who, v); }catch(e){} }

function renderPath(){
  const S=ST[who], s=STU[who], sj=getSubj(), xpT=S.days[today()]||0, pct=Math.min(100,xpT/GOAL*100), weak=weakSkills(S, sj), due=dueErrs(S, sj);
  const offs=[0,56,80,56,0,-56,-80,-56]; let k=0;
  const subStars = id => COURSES[s.cc][id].reduce((a,u)=>a+u.L.reduce((b,l)=>b+((S.lessons[l.id]||{}).stars||0),0),0);
  const subMax = id => COURSES[s.cc][id].reduce((a,u)=>a+u.L.length*3,0);
  app.innerHTML = `
  <section class="goal">
    ${mascBtn('idle')}
    <div class="txt"><h2>¡Hola, ${esc(s.name)}!</h2>
      <p>${xpT>=GOAL?'Meta de hoy cumplida. ¡Bien!':`Llevas ${xpT} de ${GOAL} XP hoy.`} · ${courseLabel(s.cc)}</p>
      <div class="bar"><i style="width:${pct}%"></i></div></div>
    <button class="btn ghost" id="bWeak" ${due.length||weak.length?'':'disabled'} title="${due.length?'Vuelve a las preguntas que fallaste en días anteriores':weak.length?'Practica lo que más te ha costado en esta asignatura':'Las preguntas que falles volverán aquí al día siguiente'}">${due.length?`Repasar errores <span class="cnt">${due.length}</span>`:weak.length?'Practicar lo difícil':'Repasar errores'}</button>
  </section>
  <nav class="subjects" aria-label="Asignaturas">${subjOf(s.cc).map(x=>`<button class="subj" data-s="${x.id}" aria-pressed="${x.id===sj}" style="--sc:${x.c}"><span>${x.t}</span><small>${IC.star.replace('<svg','<svg class="ico"')} ${subStars(x.id)}/${subMax(x.id)}</small></button>`).join('')}</nav>
  ${COURSES[s.cc][sj].map((u,ui)=>{ const st=u.L.reduce((a,l)=>a+((S.lessons[l.id]||{}).stars||0),0);
    return `<section class="unit" style="--uc:${u.c};--ud:${u.d}">
      <div class="uhead"><div><div class="n">${SUBJ_T[sj]} · Unidad ${ui+1}</div><h2>${u.t}</h2><div class="src">Basado en: ${u.src}</div>${REVIEWS[`${s.cc.toLowerCase()}-${sj}-u${ui+1}`]?`<button class="rvb" data-rv="${s.cc.toLowerCase()}-${sj}-u${ui+1}">Ver repaso</button>`:''}</div>
      <div class="meter">${IC.star.replace('<svg','<svg class="ico"')} ${st}/${u.L.length*3}</div></div>
      <div class="nodes">${u.L.map(l=>{ const n=(S.lessons[l.id]||{}).stars||0, dx=offs[(k++)%offs.length];
        return `<button class="node ${n?'':'fresh'}" style="--dx:${dx}px" data-l="${l.id}" aria-label="${l.t}, ${n} de 3 estrellas"><span class="disc">${n===3?IC.crown:IC.play}</span>${starsHtml(n)}<span class="lbl">${l.t}</span></button>`; }).join('')}</div>
    </section>`; }).join('')}`;
  app.querySelectorAll('.node').forEach(b=>b.onclick=()=>startLesson(b.dataset.l));
  app.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>showReview(b.dataset.rv, ()=>{ view='path'; render(); }, {go:'Volver a la ruta'}));
  app.querySelectorAll('.subj').forEach(b=>b.onclick=()=>{ setSubj(b.dataset.s); renderPath(); });
  if (due.length) $('#bWeak').onclick=()=>startLesson('repaso', due, false, true);
  else if (weak.length) $('#bWeak').onclick=()=>startLesson('repaso', weak);
}
