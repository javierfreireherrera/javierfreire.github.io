/* ============ lección ============ */
function startLesson(id, skills, skipRv, errMode=false){
  const rvKey = skills ? null : unitKey(LESSONS[id]);
  if (rvKey && REVIEWS[rvKey] && !skipRv && !((ST[who].reviews||{})[rvKey]))
    return showReview(rvKey, ()=>startLesson(id, null, true), {back:()=>{ view='path'; render(); }});
  const sk = skills || LESSONS[id].sk;
  const target = errMode ? Math.min(PER_LESSON, sk.length) : PER_LESSON;
  let q=[]; if (errMode) q=shuffle(sk); else while(q.length<PER_LESSON) q=q.concat(shuffle(sk));
  LS = {who, id, target, wrongRefs:new Set(), title: id==='repaso'?(errMode?'Repaso de errores':'Practicar lo difícil')+' · '+SUBJ_T[getSubj()]:SUBJ_T[LESSONS[id].sj]+' · '+LESSONS[id].t, queue:q.slice(0,target), i:0, correct:0, mistakes:0, hearts:3, tally:{}, cur:null, sel:null, done:false, combo:0, rv: rvKey && REVIEWS[rvKey] ? rvKey : null};
  view='lesson'; setTab('path'); window.scrollTo({top:0}); nextQ();
}
function nextQ(){
  if (LS.correct>=LS.target || LS.hearts<=0) return finish();
  const [base, qi] = String(LS.queue[LS.i]).split('#');
  let item = qi!==undefined && SKILLS[base].at ? SKILLS[base].at(+qi) : null;
  if (!item) item = SKILLS[base].gen();
  LS.cur = Object.assign({key:base, ref: item.qi!=null ? base+'#'+item.qi : base}, item); LS.sel=null; LS.done=false;
  drawQ();
  if (LS.cur.listen) speak(LS.cur.say);
}
function drawQ(){
  const q=LS.cur;
  app.innerHTML = `<div class="lesson">
    <div class="lbar"><button class="x" id="bQuit" aria-label="Salir de la lección">${IC.x}</button>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${LS.target}" aria-valuenow="${LS.correct}"><i style="width:${LS.correct/LS.target*100}%"></i></div>
      <div class="hearts" aria-label="${LS.hearts} vidas">${[1,2,3].map(i=>`<span class="${i<=LS.hearts?'':'off'}">${IC.heart}</span>`).join('')}</div></div>
    <div id="buddy">${buddy('idle', pick(LS.i===0?BUD.start:BUD.next))}</div>
    <div class="skill">${SKILLS[q.key].name}</div>
    <div class="prompt">${q.prompt}${q.listen && !SPEAK_OK ? `<br><b>${q.say}</b>` : ''}</div>
    ${q.say && SPEAK_OK ? `<button class="say${q.listen?' big':''}" id="bSay" aria-label="Escuchar en inglés">${IC.spk} ${q.listen?'Escuchar otra vez':'Escuchar'}</button>` : ''}
    ${q.figure?`<div class="fig">${q.figure}</div>`:''}
    ${q.type==='mc'
      ? `<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${o}</button>`).join('')}</div>`
      : `<div class="ans"><input id="inp" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu respuesta" aria-label="Tu respuesta">${q.unit?`<span class="u">${q.unit}</span>`:''}</div>
         <div class="hint">${q.hint||'Usa coma para decimales y el signo − para negativos.'}</div>`}
    <div id="fbBox"></div>
    <div class="foot" id="footBox"><button class="btn" id="bCheck" disabled>Comprobar</button></div>
  </div>`;
  $('#bQuit').onclick=()=>{ view='path'; render(); };
  const bs=$('#bSay'); if (bs) bs.onclick=()=>speak(q.say);
  const bc=$('#bCheck');
  if (q.type==='mc'){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(LS.done) return; app.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); LS.sel=+b.dataset.i; bc.disabled=false; });
  } else {
    const inp=$('#inp'); inp.focus({preventScroll:true});
    inp.oninput=()=>{ bc.disabled = parseAns(inp.value)===null; };
    inp.onkeydown=e=>{ if(e.key==='Enter' && !bc.disabled && !LS.done){ e.preventDefault(); check(); } };
  }
  bc.onclick=check;
}
function check(){
  const q=LS.cur; let ok;
  if (q.type==='mc'){
    ok = LS.sel===q.correct;
    app.querySelectorAll('.opt').forEach((b,i)=>{ if(i===q.correct) b.classList.add('right'); else if(i===LS.sel) b.classList.add('wrong'); });
  } else {
    const v=parseAns($('#inp').value); $('#inp').readOnly=true;
    ok = v!==null && Math.abs(v-q.ans) <= (q.tol||1e-6);
  }
  LS.done=true;
  const t=LS.tally[q.key]||(LS.tally[q.key]={ok:0,n:0}); t.n++;
  if (ok){ LS.correct++; t.ok++; LS.combo++; } else { LS.mistakes++; LS.hearts--; LS.queue.push(q.ref); LS.combo=0; }
  LS.i++;
  srsMark(ST[LS.who], q.ref, ok, SKILL_SUBJ[q.key]); saveLocal(LS.who);
  const bmood = ok ? (LS.combo>=3 ? 'party' : 'happy') : (LS.hearts<=0 ? 'cry' : 'sad');
  const bmsg = ok ? (LS.combo>=3 ? BUD.combo(LS.combo) : pick(BUD.ok)) : (LS.hearts<=0 ? BUD.out : pick(BUD.no));
  $('#buddy').innerHTML = buddy(bmood, bmsg, ok?'ok':'no');
  bark(ok ? (LS.combo>=3 ? 'party' : 'happy') : (LS.hearts<=0 ? 'sad' : 'cheer'));
  const right = q.type==='mc' ? q.options[q.correct] : `${q.unit==='$'?'$':''}${fmt(q.ans)}${q.unit&&q.unit!=='$'?' '+q.unit:''}`;
  $('#footBox').innerHTML='';
  $('#fbBox').innerHTML = `<div class="fb ${ok?'ok':'no'}" role="status">
    <h3>${ok?IC.check+' ¡Correcto!':'Respuesta correcta: '+right}</h3>
    <div class="ex">${q.explain}</div>
    <button class="btn" id="bNext">${LS.hearts<=0?'Ver resultado':'Continuar'}</button>
    ${!ok && LS.rv && LS.hearts>0 ? `<button class="btn ghost" id="bRv">Ver el repaso de la unidad</button>` : ''}</div>`;
  document.querySelector('.prog i').style.width = (LS.correct/LS.target*100)+'%';
  document.querySelectorAll('.hearts > span').forEach((h,i)=>h.className = i<LS.hearts?'':'off');
  const bn=$('#bNext'); bn.focus({preventScroll:true}); bn.onclick=nextQ;
  const brv=$('#bRv'); if (brv) brv.onclick=()=>showReview(LS.rv, ()=>{ view='lesson'; window.scrollTo({top:0}); nextQ(); }, {go:'Volver a la lección'});
  bn.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function finish(){
  const S=ST[LS.who], won=LS.correct>=LS.target;
  const stars = !won ? 0 : LS.mistakes===0 ? 3 : LS.mistakes<=2 ? 2 : 1;
  const xp = won ? 10 + LS.correct + (LS.mistakes===0?5:0) : LS.correct;
  const answered = LS.correct + LS.mistakes;
  S.xp += xp;
  const d=today(); S.days[d]=(S.days[d]||0)+xp;
  if (LS.id!=='repaso' && stars){ const prev=S.lessons[LS.id]||{stars:0,times:0}; S.lessons[LS.id]={stars:Math.max(prev.stars,stars), times:(prev.times||0)+1}; }
  Object.entries(LS.tally).forEach(([k,t])=>{ const s=S.skills[k]||{ok:0,n:0}; S.skills[k]={ok:s.ok+t.ok, n:s.n+t.n}; });
  S.sessions.unshift({t:Date.now(), l:LS.id, title:LS.title, ok:LS.correct, n:answered, xp, won});
  S.sessions = S.sessions.slice(0,60);
  S.updatedAt = Date.now();
  saveLocal(LS.who); push(LS.who);
  renderStats();
  const rMsg = !won ? 'Estoy un poquito triste… pero la próxima lo hacemos mejor juntos.' : stars===3 ? '¡Guau guau! ¡Perfecto! ¡Estoy saltando de alegría!' : '¡Lo lograste! ¡Qué contento estoy!';
  app.innerHTML = `<div class="result">
    ${buddy(!won?'sad':stars===3?'party':'happy', rMsg, won?'ok':'no', true)}
    ${won?starsHtml(stars,'big-stars'):''}
    <h1>${won?(stars===3?'¡Lección perfecta!':'¡Lección completada!'):'Se acabaron las vidas'}</h1>
    <p>${won?LS.title:'Repasa las explicaciones y vuelve a intentarlo. Los ejercicios cambian cada vez.'}</p>
    <div class="kpis">
      <div class="kpi"><b>+${xp}</b><span>XP</span></div>
      <div class="kpi"><b>${answered?Math.round(LS.correct/answered*100):0}%</b><span>Precisión</span></div>
      <div class="kpi"><b>${streakOf(S)}</b><span>Racha</span></div>
    </div>
    <button class="btn" id="bBack">Continuar</button>
    <button class="btn ghost" id="bAgain">Repetir con otros números</button>
  </div>`;
  if (won && stars===3) setTimeout(()=>bark('party'), 250);
  const id=LS.id, sk=LS.id==='repaso'?Object.keys(LS.tally):null;
  $('#bBack').onclick=()=>{ view='path'; render(); };
  $('#bAgain').onclick=()=>startLesson(id, sk);
  $('#bBack').focus({preventScroll:true});
}

const dKey = d => d.toLocaleDateString('en-CA');
function mondayOf(d=new Date()){ const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }
const weekKey = (d=new Date()) => dKey(mondayOf(d));
const monthKey = (d=new Date()) => dKey(d).slice(0,7);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function weekDates(d=new Date()){ const m=mondayOf(d); return Array.from({length:7},(_,i)=>{ const x=new Date(m); x.setDate(m.getDate()+i); return dKey(x); }); }

function deepMerge(t, p){ for (const k in p){ if (p[k] && typeof p[k]==='object' && !Array.isArray(p[k])){ t[k]=deepMerge(t[k]&&typeof t[k]==='object'?t[k]:{}, p[k]); } else t[k]=p[k]; } return t; }

let RWDB = null;
async function dbPatch(col, id, patch, full){
  if (!RWDB) return;
  const ref = RWDB.doc(col+'/'+id);
  try { await ref.update(patch); }
  catch(e){ try { await ref.set(JSON.parse(JSON.stringify(full))); } catch(e2) { sync = e2 && e2.code==='invalid_argument' ? 'readonly' : sync; renderSync(); } }
}
function patchHab(child, week, key, val){
  const id=`${child}_${week}`;
  HAB[id] = deepMerge(HAB[id]||{child,week,e:{}}, {e:{[key]:val}});
  saveRW(); dbPatch('habitos', id, {e:{[key]:val}}, HAB[id]);
}
function patchCan(child, key, val){
  CAN[child] = deepMerge(CAN[child]||{c:{}}, {c:{[key]:val}});
  saveRW(); dbPatch('canjes', child, {c:{[key]:val}}, CAN[child]);
}
async function saveCfg(){
  CFG.updatedAt = Date.now(); saveRW();
  if (RWDB) { try { await RWDB.doc('config/familia').set(JSON.parse(JSON.stringify(CFG))); } catch(e) {} }
}
function rerenderSoft(){ if (view==='rewards') renderRewards(false); else if (view==='panel') renderPanel(); else if (view==='path') renderStats(); }
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db'); if (!db) return; RWDB = db;
    db.doc('config/familia').onSnapshot(snap=>{ if (snap.exists){ const r=snap.data(); if ((r.updatedAt||0) >= (CFG.updatedAt||0)){ CFG=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)), JSON.parse(JSON.stringify(r))); saveRW(); rerenderSoft(); } } }, ()=>{});
    db.collection('habitos').onSnapshot(qs=>{ qs.docs.forEach(d=>{ HAB[d.id]=JSON.parse(JSON.stringify(d.data())); }); saveRW(); rerenderSoft(); }, ()=>{});
    db.collection('canjes').onSnapshot(qs=>{ qs.docs.forEach(d=>{ CAN[d.id]=JSON.parse(JSON.stringify(d.data())); }); saveRW(); rerenderSoft(); }, ()=>{});
  } catch(e) {}
})();

function habEntries(child){ return Object.values(HAB).filter(d=>d && d.child===child).flatMap(d=>Object.entries(d.e||{}).map(([k,v])=>Object.assign({k, week:d.week}, v))); }
function lessonPts(child, dates){ const S=ST[child]; return dates.reduce((a,d)=>a+(S.days[d]||0),0); }
function habPts(child, dates, status='a'){ const set=new Set(dates); return habEntries(child).filter(e=>e.s===status && set.has(e.d)).reduce((a,e)=>a+(e.p||0),0); }
function monthDates(d=new Date()){ const y=d.getFullYear(), m=d.getMonth(), n=new Date(y,m+1,0).getDate(); return Array.from({length:n},(_,i)=>dKey(new Date(y,m,i+1))); }
function periodInfo(child, per){
  const dates = per==='s' ? weekDates() : monthDates();
  const earned = lessonPts(child,dates) + habPts(child,dates,'a');
  const pending = habPts(child,dates,'p');
  const pk = per==='s' ? weekKey() : monthKey();
  const claims = Object.values((CAN[child]||{}).c||{}).filter(c=>c.per===per && c.pk===pk && c.s!=='x');
  const spent = claims.reduce((a,c)=>a+(c.p||0),0);
  return {dates, earned, pending, pk, claims, spent, avail: earned-spent};
}
const perLabel = per => per==='s' ? 'esta semana' : 'este mes';

function renderRewards(scroll=true){
  if (!who){ view='who'; return render(); }
  renderStats(); setTab('rewards');
  const s=STU[who], td=today(), hs=CFG.habits;
  const todayE = Object.fromEntries(habEntries(who).filter(e=>e.d===td).map(e=>[e.h,e]));
  const W=periodInfo(who,'s'), M=periodInfo(who,'m');
  const stateTxt = {p:'Por aprobar', a:'Aprobado', r:'No aprobado'};
  const wd=weekDates(), lw=lessonPts(who,wd), hw=habPts(who,wd,'a');
  const card = r => { const P = r.per==='s'?W:M, claimed=P.claims.find(c=>c.r===r.id), pct=Math.min(100,P.avail/r.p*100);
    let btn;
    if (claimed) btn = claimed.s==='ent' ? `<span class="pill g">Entregado</span>` : `<span class="pill y">Pedido: esperando a los papás</span>`;
    else btn = `<button class="btn sm" data-claim="${r.id}" ${P.avail>=r.p?'':'disabled'}>${P.avail>=r.p?'Canjear':`Faltan ${r.p-P.avail}`}</button>`;
    return `<div class="rw"><div class="rw-top"><b>${esc(r.n)}</b><span class="rw-pts">${r.p} pts · ${r.per==='s'?'semanal':'mensual'}</span></div>
      <div class="bar"><i style="width:${claimed?100:Math.max(0,pct)}%"></i></div><div class="rw-foot">${btn}</div></div>`; };
  app.innerHTML = `<div class="rewards">
    <h1>Mis puntos y premios</h1>
    <p class="sub">Junta puntos con lecciones y tareas de la casa. Los papás aprueban las tareas y entregan los premios.</p>
    <div class="cards">
      <div class="kpi"><b>${W.earned}</b><span>Puntos esta semana</span></div>
      <div class="kpi"><b>${M.earned}</b><span>Puntos en ${MESES[new Date().getMonth()]}</span></div>
      <div class="kpi"><b>${W.pending+0}</b><span>Pts por aprobar</span></div>
    </div>
    <p class="note slim">Esta semana: ${lw} pts de lecciones + ${hw} pts de tareas aprobadas.</p>
    <section class="sec"><h2>Tareas de hoy</h2>
      <div class="habits">${hs.map(h=>{ const e=todayE[h.id], st=e&&e.s!=='x'?e.s:null;
        return `<button class="hab ${st?'st-'+st:''}" data-hab="${h.id}" aria-pressed="${!!st}" ${st&&st!=='p'?'disabled':''}>
          <span class="chk">${st?IC.check:''}</span><span class="hn">${esc(h.n)}</span><span class="hp">+${h.p}</span>
          ${st?`<small>${stateTxt[st]}${st==='p'?' · toca para deshacer':''}</small>`:''}</button>`; }).join('')}</div>
    </section>
    <section class="sec"><h2>Premios</h2>
      <p class="note slim">Los premios semanales usan los puntos de ${perLabel('s')}; los mensuales, los de ${perLabel('m')}. Disponibles: ${W.avail} pts semanales · ${M.avail} pts mensuales.</p>
      <div class="rws">${CFG.rewards.map(card).join('')}</div>
    </section>
  </div>`;
  app.querySelectorAll('[data-hab]').forEach(b=>b.onclick=()=>{
    const h=hs.find(x=>x.id===b.dataset.hab), e=todayE[h.id], key=`${td}__${h.id}`;
    if (e && e.s==='p') patchHab(who, weekKey(), key, {s:'x', t:Date.now()});
    else if (!e || e.s==='x') patchHab(who, weekKey(), key, {h:h.id, n:h.n, d:td, p:h.p, s:'p', t:Date.now()});
    renderRewards(false);
  });
  app.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{
    const r=CFG.rewards.find(x=>x.id===b.dataset.claim), P=r.per==='s'?W:M;
    if (P.avail < r.p) return;
    patchCan(who, `${r.id}__${P.pk}`, {r:r.id, n:r.n, per:r.per, pk:P.pk, p:r.p, s:'sol', t:Date.now()});
    renderRewards(false);
  });
  if (scroll) window.scrollTo({top:0});
}

/* ---- modo padres (dentro del Panel) ---- */
function parentSection(){
  if (!parentOK){
    return `<section class="sec parent"><h2>Modo papás</h2>
      <p class="sub">${CFG.pin?'Ingresa el PIN para aprobar tareas, entregar premios y editar la lista.':'Crea un PIN de 4 dígitos para aprobar tareas, entregar premios y editar la lista.'}</p>
      <div class="name-row"><input id="pinIn" inputmode="numeric" maxlength="4" placeholder="PIN" aria-label="PIN de papás"><button class="btn" id="bPin">${CFG.pin?'Entrar':'Crear PIN'}</button></div>
      <p class="hint" id="pinMsg"></p></section>`;
  }
  const pend = STUDENTS.flatMap(s=>habEntries(s.id).filter(e=>e.s==='p').map(e=>Object.assign({child:s.id},e))).sort((a,b)=>a.t-b.t);
  const reqs = STUDENTS.flatMap(s=>Object.entries((CAN[s.id]||{}).c||{}).filter(([k,c])=>c.s==='sol').map(([k,c])=>Object.assign({child:s.id,k},c)));
  const dShort = d => { const x=new Date(d+'T12:00:00'); return x.toLocaleDateString('es-CL',{weekday:'short',day:'numeric'}); };
  return `<section class="sec parent"><h2>Modo papás <button class="btn ghost sm" id="bLock">Salir</button></h2>
    <h3>Tareas por aprobar (${pend.length})</h3>
    ${pend.length?`<div class="tbl-wrap"><table class="sk">${pend.map(e=>`<tr><td><b>${STU[e.child].name}</b></td><td>${esc(e.n)}</td><td>${dShort(e.d)}</td><td class="n">+${e.p}</td><td class="act"><button class="mbtn ok" data-ap="${e.child}|${e.week}|${e.k}" aria-label="Aprobar">${IC.check}</button><button class="mbtn no" data-rj="${e.child}|${e.week}|${e.k}" aria-label="Rechazar">${IC.x}</button></td></tr>`).join('')}</table></div>`:`<p class="note slim">No hay tareas pendientes.</p>`}
    <h3>Premios pedidos (${reqs.length})</h3>
    ${reqs.length?`<div class="tbl-wrap"><table class="sk">${reqs.map(c=>`<tr><td><b>${STU[c.child].name}</b></td><td>${esc(c.n)}</td><td class="n">${c.p} pts</td><td class="act"><button class="btn sm" data-dl="${c.child}|${c.k}">Entregado</button> <button class="mbtn no" data-cx="${c.child}|${c.k}" aria-label="Anular pedido">${IC.x}</button></td></tr>`).join('')}</table></div>`:`<p class="note slim">No hay premios pedidos.</p>`}
    <h3>Tareas de la casa</h3>
    <div class="edit" id="edH">${CFG.habits.map((h,i)=>`<div class="erow"><input id="hn${i}" value="${esc(h.n)}" aria-label="Nombre de la tarea"><input id="hp${i}" class="pts" inputmode="numeric" value="${h.p}" aria-label="Puntos"><button class="mbtn no" data-dh="${i}" aria-label="Quitar">${IC.x}</button></div>`).join('')}</div>
    <button class="btn ghost sm" id="bAddH">+ Agregar tarea</button>
    <h3>Premios</h3>
    <div class="edit" id="edR">${CFG.rewards.map((r,i)=>`<div class="erow"><input id="rn${i}" value="${esc(r.n)}" aria-label="Nombre del premio"><input id="rp${i}" class="pts" inputmode="numeric" value="${r.p}" aria-label="Puntos"><select id="rr${i}" aria-label="Período"><option value="s" ${r.per==='s'?'selected':''}>Semanal</option><option value="m" ${r.per==='m'?'selected':''}>Mensual</option></select><button class="mbtn no" data-dr="${i}" aria-label="Quitar">${IC.x}</button></div>`).join('')}</div>
    <button class="btn ghost sm" id="bAddR">+ Agregar premio</button>
    <div class="save-row"><button class="btn" id="bSaveCfg">Guardar cambios</button><span class="hint" id="cfgMsg"></span></div>
    <p class="note slim">Referencia: una lección completa da entre 18 y 23 puntos, y la meta diaria es 30. Con una lección al día se llega a unos 140 puntos por semana.</p>
  </section>`;
}
function bindParent(){
  const bp=$('#bPin');
  if (bp){ const go=()=>{ const v=$('#pinIn').value.trim(); if (!/^\d{4}$/.test(v)){ $('#pinMsg').textContent='El PIN debe tener 4 dígitos.'; return; }
      if (!CFG.pin){ CFG.pin=v; saveCfg(); parentOK=true; renderPanel(); }
      else if (v===CFG.pin){ parentOK=true; renderPanel(); } else { $('#pinMsg').textContent='PIN incorrecto.'; } };
    bp.onclick=go; $('#pinIn').onkeydown=e=>{ if(e.key==='Enter') go(); }; return; }
  $('#bLock').onclick=()=>{ parentOK=false; renderPanel(); };
  const sp = s => s.split('|');
  app.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{ const [c,w,k]=sp(b.dataset.ap); patchHab(c,w,k,{s:'a'}); renderPanel(); });
  app.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{ const [c,w,k]=sp(b.dataset.rj); patchHab(c,w,k,{s:'r'}); renderPanel(); });
  app.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{ const [c,k]=sp(b.dataset.dl); patchCan(c,k,{s:'ent', te:Date.now()}); renderPanel(); });
  app.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{ const [c,k]=sp(b.dataset.cx); patchCan(c,k,{s:'x'}); renderPanel(); });
  const readEdits = () => {
    CFG.habits = CFG.habits.map((h,i)=>({id:h.id, n:($('#hn'+i).value.trim()||h.n).slice(0,40), p:Math.max(1,Math.min(500,parseInt($('#hp'+i).value)||h.p))}));
    CFG.rewards = CFG.rewards.map((r,i)=>({id:r.id, n:($('#rn'+i).value.trim()||r.n).slice(0,40), p:Math.max(1,Math.min(5000,parseInt($('#rp'+i).value)||r.p)), per:$('#rr'+i).value}));
  };
  const uid = p => p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
  $('#bAddH').onclick=()=>{ readEdits(); CFG.habits.push({id:uid('h'), n:'Nueva tarea', p:5}); renderPanel(); };
  $('#bAddR').onclick=()=>{ readEdits(); CFG.rewards.push({id:uid('r'), n:'Nuevo premio', p:100, per:'s'}); renderPanel(); };
  app.querySelectorAll('[data-dh]').forEach(b=>b.onclick=()=>{ readEdits(); CFG.habits.splice(+b.dataset.dh,1); renderPanel(); });
  app.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>{ readEdits(); CFG.rewards.splice(+b.dataset.dr,1); renderPanel(); });
  $('#bSaveCfg').onclick=async()=>{ readEdits(); await saveCfg(); $('#cfgMsg').textContent='Guardado.'; };
}

/* ============ panel ============ */
function summary(id){
  const S=ST[id], s=STU[id], tot=Object.values(S.skills).reduce((a,x)=>({ok:a.ok+x.ok,n:a.n+x.n}),{ok:0,n:0});
  return {S, s, done:Object.values(S.lessons).filter(l=>l.stars>0).length, total:nLessons(s.cc), acc: tot.n?Math.round(tot.ok/tot.n*100):null, last:S.sessions[0]?S.sessions[0].t:null};
}
const fmtDate = t => new Date(t).toLocaleString('es-CL',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function renderPanel(){
  if (!STUDENTS.length){ app.innerHTML=`<div class="panel"><h1>Panel</h1><p class="note">Todavía no hay perfiles en este dispositivo. Ve a <b>Aprender</b> y toca <b>Agregar estudiante</b> para crear el primero.</p></div>`; return; }
  if (!panelSel || !STU[panelSel]) panelSel = (who && STU[who]) ? who : STUDENTS[0].id;
  const sm=summary(panelSel), S=sm.S, s=sm.s;
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push([d, S.days[today(d)]||0]); }
  const maxV=Math.max(GOAL+10,...days.map(x=>x[1])), W=560, H=170, bw=26, gx=(W-30)/14, sc=(H-44)/maxV, wd=['D','L','M','M','J','V','S'];
  let ch=`<line class="c-goal" x1="20" x2="${W-4}" y1="${H-24-GOAL*sc}" y2="${H-24-GOAL*sc}"/><text class="c-txt" x="${W-4}" y="${H-28-GOAL*sc}" text-anchor="end">meta ${GOAL} XP</text>`;
  days.forEach(([d,v],i)=>{ const x=24+i*gx+(gx-bw)/2, h=Math.max(v*sc,2);
    ch+=`<rect class="c-bar ${v?'':'zero'}" x="${x}" y="${H-24-h}" width="${bw}" height="${h}" rx="4"/>`;
    if (v) ch+=`<text class="c-val" x="${x+bw/2}" y="${H-28-h}" text-anchor="middle">${v}</text>`;
    ch+=`<text class="c-txt" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${wd[d.getDay()]}${d.getDate()}</text>`; });
  const rowsFor = sj => subjSkills(s.cc,sj).map(k=>{ const x=S.skills[k], p=x&&x.n?x.ok/x.n:null;
    const pill=p===null?'<span class="pill n">Sin datos</span>':p>=.85?'<span class="pill g">Dominado</span>':p>=.6?'<span class="pill y">En progreso</span>':'<span class="pill r">Reforzar</span>';
    return {name:SKILLS[k].name, n:x?x.n:0, p, pill}; });
  app.innerHTML = `<div class="panel">
    <h1>Panel</h1>
    <p class="sub">Avance de los perfiles de este dispositivo. Se actualiza cada vez que se termina una lección.</p>
    <div id="syncEl" class="sync"></div>
    <div class="fam">${STUDENTS.map(x=>{ const m=summary(x.id); return `<button class="fam-card" data-id="${x.id}" aria-pressed="${x.id===panelSel}" style="--hue:${x.hue}">
      <span class="top-row"><span class="av sm">${esc(x.name[0])}</span><span><b>${esc(x.name)}</b><small>${courseLabel(x.cc)}</small></span></span>
      <span class="fam-stats"><span><b>${m.S.xp.toLocaleString('es-CL')}</b>XP</span><span><b>${streakOf(m.S)}</b>racha</span><span><b>${m.done}/${m.total}</b>lecciones</span><span><b>${m.acc===null?'–':m.acc+'%'}</b>acierto</span></span>
      <span class="wk" hidden><span>Semana: <b>${periodInfo(x.id,'s').earned}</b> pts</span><span>Mes: <b>${periodInfo(x.id,'m').earned}</b> pts</span>${habEntries(x.id).filter(e=>e.s==='p').length?`<span class="pill y">${habEntries(x.id).filter(e=>e.s==='p').length} por aprobar</span>`:''}</span>
      <span class="last">${m.last?'Última vez: '+fmtDate(m.last):'Aún no empieza'}</span></button>`; }).join('')}</div>

    <h2 class="det">Detalle de ${esc(s.name)}</h2>
    <section class="sec"><h3>XP de los últimos 14 días</h3><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="XP por día">${ch}</svg></div></section>
    <section class="sec"><h3>Avance por unidad</h3>
      ${subjOf(s.cc).map(x=>`<h4 class="sgrp">${x.t}</h4>`+COURSES[s.cc][x.id].map(u=>{ const st=u.L.reduce((a,l)=>a+((S.lessons[l.id]||{}).stars||0),0), mx=u.L.length*3; return `<div class="umeter" style="--uc:${u.c}"><span>${u.t}</span><div class="bar"><i style="width:${st/mx*100}%"></i></div><span class="p">${st}/${mx}</span></div>`; }).join('')).join('')}
    </section>
    <section class="sec"><h3>Habilidades</h3><div class="tbl-wrap"><table class="sk">
      <tr><th>Habilidad</th><th style="text-align:right">Intentos</th><th style="text-align:right">Acierto</th><th>Estado</th></tr>
      ${subjOf(s.cc).map(x=>{ const rs=rowsFor(x.id).filter(r=>r.n>0); return `<tr class="grp"><td colspan="4">${x.t}</td></tr>`+(rs.length?rs.map(r=>`<tr><td>${r.name}</td><td class="n">${r.n}</td><td class="n">${Math.round(r.p*100)}%</td><td>${r.pill}</td></tr>`).join(''):`<tr><td colspan="4" class="muted">Sin práctica todavía</td></tr>`); }).join('')}
    </table></div></section>
    <section class="sec"><h3>Últimas sesiones</h3>
      ${S.sessions.length?`<div class="tbl-wrap"><table class="sk"><tr><th>Cuándo</th><th>Lección</th><th style="text-align:right">Correctas</th><th style="text-align:right">XP</th></tr>
      ${S.sessions.slice(0,15).map(x=>`<tr><td>${fmtDate(x.t)}</td><td>${esc(x.title)}${x.won?'':' <span class="pill r">Sin terminar</span>'}</td><td class="n">${x.ok}/${x.n}</td><td class="n">+${x.xp}</td></tr>`).join('')}</table></div>`
      :`<p class="note">${esc(s.name)} todavía no tiene sesiones. Cuando complete su primera lección, aparecerá aquí con la fecha, los aciertos y el XP ganado.</p>`}
    </section>
    <section class="sec"><h3>Perfil</h3><div class="del-row" id="delBox"><button class="btn ghost sm" id="bDel">Eliminar el perfil de ${esc(s.name)}</button></div></section>
    <p class="note">Los ejercicios de matemáticas se generan al azar en cada intento. Las preguntas de Lenguaje, Ciencias e Historia y Geografía vienen de un banco basado en el programa de 6° y 8° básico. Cada lección pide 8 respuestas correctas con 3 vidas; 0 errores = 3 estrellas.</p>
  </div>`;
  renderSync();
  app.querySelectorAll('.fam-card').forEach(b=>b.onclick=()=>{ panelSel=b.dataset.id; renderPanel(); });
  $('#bDel').onclick=()=>{ $('#delBox').innerHTML=`<span>Se borrará todo el progreso de ${esc(s.name)} en este dispositivo. ¿Seguro?</span><button class="btn ghost sm" id="bDelNo">Cancelar</button><button class="btn sm danger" id="bDelYes">Sí, eliminar</button>`;
    $('#bDelNo').onclick=()=>renderPanel();
    $('#bDelYes').onclick=()=>{ const id=s.id; STUDENTS=STUDENTS.filter(x=>x.id!==id); reindex(); saveProfiles(); delete ST[id]; try{ localStorage.removeItem('ruta-v2-'+id); }catch(e){}
      if (who===id){ who=null; try{ localStorage.removeItem('ruta-who'); }catch(e){} } panelSel=null; renderStats(); renderPanel(); }; };

}

render();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
